<title>Puzzle Reel</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Public+Sans:wght@400;500;600;700&family=Overpass+Mono:wght@400;600&display=swap">
<style>/* Layout: one puzzle per screen like a reel — a thin status bar above, the board
   as a dark asphalt slab, tools at thumb height. Signage yellow is the one accent. */
:root {
  --ground: #E4E7E9;
  --panel: #F7F8F8;
  --ink: #15191C;
  --ink-soft: #4C555D;
  --rule: #CBD1D6;
  --slab: #2A2F35;
  --slab-raise: #343A41;
  --slab-line: rgba(236, 240, 242, 0.14);
  --paint: #EEF1F2;
  --sign: #F3C316;
  --sign-ink: #6A5000;
  --on-sign: #1A1606;
  --water: #2F7FE0;
  --dry: #79838C;
  --ok: #1B8553;
  --warn: #A86200;
  --bad: #C0362E;
  --focus: #1F6FD1;
  --shadow: 0 1px 2px rgba(20, 24, 28, 0.08), 0 8px 24px rgba(20, 24, 28, 0.08);
  --font-display: "Barlow Condensed", "Arial Narrow", "Helvetica Neue", Arial, sans-serif;
  --font-body: "Public Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --font-data: "Overpass Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  --r-card: 18px;
  --r-ctl: 10px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --ground: #0E1114;
    --panel: #161A1E;
    --ink: #E7EBED;
    --ink-soft: #99A2AA;
    --rule: #2A3137;
    --slab: #22272D;
    --slab-raise: #2D333A;
    --slab-line: rgba(236, 240, 242, 0.10);
    --paint: #DCE2E5;
    --sign: #F3C316;
    --sign-ink: #F3C316;
    --on-sign: #1A1606;
    --water: #4C98F3;
    --dry: #69737B;
    --ok: #3CC487;
    --warn: #EDA23A;
    --bad: #FF6E62;
    --focus: #7DB3FF;
    --shadow: 0 1px 2px rgba(0, 0, 0, 0.4), 0 10px 30px rgba(0, 0, 0, 0.35);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --ground: #0E1114;
  --panel: #161A1E;
  --ink: #E7EBED;
  --ink-soft: #99A2AA;
  --rule: #2A3137;
  --slab: #22272D;
  --slab-raise: #2D333A;
  --slab-line: rgba(236, 240, 242, 0.10);
  --paint: #DCE2E5;
  --sign: #F3C316;
  --sign-ink: #F3C316;
  --on-sign: #1A1606;
  --water: #4C98F3;
  --dry: #69737B;
  --ok: #3CC487;
  --warn: #EDA23A;
  --bad: #FF6E62;
  --focus: #7DB3FF;
  --shadow: 0 1px 2px rgba(0, 0, 0, 0.4), 0 10px 30px rgba(0, 0, 0, 0.35);
  color-scheme: dark;
}

[hidden] { display: none !important; }
html, body { height: 100%; }
body {
  background: var(--ground);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 15px;
  line-height: 1.45;
  -webkit-tap-highlight-color: transparent;
  overflow: hidden;
}
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }

.app { height: 100%; display: flex; flex-direction: column; }

/* ---------- top bar ---------- */
.bar {
  display: flex; align-items: center; gap: 10px;
  padding-block: 10px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  border-bottom: 1px solid var(--rule);
  background: var(--panel);
  min-height: 52px;
}
.brand {
  font-family: var(--font-display);
  font-weight: 700; font-size: 22px; letter-spacing: 0.04em; text-transform: uppercase;
  display: flex; align-items: center; gap: 8px; white-space: nowrap;
}
.brand-mark {
  width: 22px; height: 22px; border-radius: 5px; background: var(--sign);
  display: grid; place-items: center; flex: none;
}
.brand-mark svg { width: 14px; height: 14px; }
.chip {
  font-family: var(--font-data); font-size: 12px; letter-spacing: 0.02em;
  padding: 3px 9px; border-radius: 999px; border: 1px solid var(--rule); color: var(--ink-soft);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0;
}
.chip.study { border-color: var(--sign); color: var(--ink); background: color-mix(in srgb, var(--sign) 16%, transparent); }
.bar-actions { margin-left: auto; display: flex; gap: 6px; flex: none; }
@media (max-width: 480px) {
  .bar { gap: 8px; }
  .brand { font-size: 19px; }
  .bar.free .chip { display: none; }
  .bar.study .brand-text { display: none; }
  .bar .btn { padding: 7px 10px; }
}
.btn {
  border: 1px solid var(--rule); background: transparent; border-radius: var(--r-ctl);
  padding: 7px 12px; font-weight: 600; font-size: 14px; line-height: 1.1;
  display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 36px;
}
.btn:hover { border-color: var(--ink-soft); }
.btn.primary { background: var(--sign); border-color: var(--sign); color: var(--on-sign); }
.btn.primary:hover { filter: brightness(1.04); }
.btn.danger { color: var(--bad); border-color: color-mix(in srgb, var(--bad) 45%, var(--rule)); }
.btn[disabled] { opacity: 0.45; cursor: default; }
.hold { position: relative; overflow: hidden; }
.hold .fill { position: absolute; inset: 0; background: color-mix(in srgb, var(--bad) 22%, transparent); transform: scaleX(0); transform-origin: left; pointer-events: none; }
.hold.holding .fill { transform: scaleX(1); transition: transform 1.2s linear; }

/* ---------- stage & cards ---------- */
.stage { position: relative; flex: 1; min-height: 0; overflow: hidden; touch-action: manipulation; }
.card.resolved { touch-action: none; }
.card {
  position: absolute; top: 12px; bottom: 12px;
  left: max(16px, env(safe-area-inset-left, 0px)); right: max(16px, env(safe-area-inset-right, 0px));
  max-width: 560px; margin-inline: auto;
  background: var(--panel); border-radius: var(--r-card); box-shadow: var(--shadow);
  display: flex; flex-direction: column; overflow: hidden;
}
.card-head { display: flex; align-items: center; flex-wrap: wrap; gap: 6px 10px; padding: 14px 16px 0; }
.badge {
  font-family: var(--font-display); font-weight: 700; font-size: 20px; letter-spacing: 0.06em; text-transform: uppercase;
  padding: 1px 10px 0; border-radius: 6px; line-height: 1.35;
}
.badge.outbound { background: var(--sign); color: var(--on-sign); }
.badge.conduit { background: var(--water); color: #fff; }
.badge.tumbler { background: #E0662F; color: #fff; }
.lvl { font-family: var(--font-data); font-size: 12px; color: var(--ink-soft); border: 1px solid var(--rule); border-radius: 6px; padding: 2px 6px; }
.meta { margin-left: auto; display: flex; gap: 10px; font-family: var(--font-data); font-size: 12.5px; color: var(--ink-soft); font-variant-numeric: tabular-nums; white-space: nowrap; }
.meta b { color: var(--ink); font-weight: 600; }
.rule { margin: 8px 16px 0; color: var(--ink-soft); font-size: 14px; max-width: 62ch; }
.rule strong { color: var(--ink); font-weight: 600; }
.board-wrap { flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center; padding: 12px 16px; position: relative; }
.board { width: 100%; height: 100%; max-width: 520px; display: block; touch-action: manipulation; user-select: none; -webkit-user-select: none; }
.tools { display: flex; gap: 8px; padding: 0 16px 14px; flex-wrap: wrap; align-items: center; }
.tools .spacer { flex: 1; }
.tool { min-width: 44px; }
.verdict {
  position: absolute; left: 50%; bottom: 8px; transform: translateX(-50%);
  font-size: 13px; font-weight: 600; padding: 4px 10px; border-radius: 999px;
  background: var(--panel); border: 1px solid var(--rule); white-space: nowrap; pointer-events: none;
  opacity: 0; transition: opacity 0.2s;
}
.verdict.show { opacity: 1; }
.verdict.optimal, .verdict.solved { color: var(--ok); border-color: color-mix(in srgb, var(--ok) 50%, var(--rule)); }
.verdict.wasted, .verdict.suboptimal, .verdict.blocked { color: var(--warn); border-color: color-mix(in srgb, var(--warn) 50%, var(--rule)); }
.verdict.dead_end, .verdict.in_dead_end, .verdict.zero_info { color: var(--bad); border-color: color-mix(in srgb, var(--bad) 50%, var(--rule)); }
.verdict.info { color: var(--ink-soft); }

.notice {
  margin: 0 16px 10px; padding: 10px 12px; border-radius: 12px; border: 1px solid var(--rule);
  display: flex; gap: 10px; align-items: center; flex-wrap: wrap; font-size: 14px;
}
.notice p { margin: 0; flex: 1 1 180px; }

.result {
  position: absolute; left: 0; right: 0; bottom: 0;
  background: var(--panel); border-top: 1px solid var(--rule);
  padding: 16px 16px 18px; display: flex; flex-direction: column; gap: 10px;
  box-shadow: 0 -12px 30px rgba(0, 0, 0, 0.12);
}
.result h3 { margin: 0; font-family: var(--font-display); font-size: 30px; line-height: 1; letter-spacing: 0.02em; text-transform: uppercase; text-wrap: balance; }
.result .stats { display: flex; flex-wrap: wrap; gap: 6px 16px; font-family: var(--font-data); font-size: 13px; color: var(--ink-soft); font-variant-numeric: tabular-nums; }
.result .stats b { color: var(--ink); font-weight: 600; }
.result .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.result .swipe { font-size: 13px; color: var(--ink-soft); }
.pill { font-size: 12px; font-weight: 700; padding: 2px 8px; border-radius: 999px; letter-spacing: 0.02em; }
.pill.ok { color: var(--ok); background: color-mix(in srgb, var(--ok) 14%, transparent); }
.pill.warn { color: var(--warn); background: color-mix(in srgb, var(--warn) 14%, transparent); }
.pill.bad { color: var(--bad); background: color-mix(in srgb, var(--bad) 14%, transparent); }

/* ---------- Outbound ---------- */
.lot-ground { fill: var(--slab); }
.lot-line { stroke: var(--slab-line); stroke-width: 0.5; }
.lot-curb { fill: none; stroke: var(--paint); stroke-opacity: 0.55; stroke-width: 0.8; stroke-dasharray: 2.4 2.4; }
.car { cursor: pointer; transition: transform 0.26s cubic-bezier(.3,.7,.3,1), opacity 0.3s; }
.car.leaving { transition: transform 0.42s cubic-bezier(.5,0,.8,.4), opacity 0.42s; }
.car .halo { fill: none; stroke-width: 1.3; opacity: 0; }
.car.flash-optimal .halo { stroke: var(--ok); opacity: 1; }
.car.flash-wasted .halo, .car.flash-blocked .halo { stroke: var(--warn); opacity: 1; }
.car.flash-dead_end .halo, .car.flash-in_dead_end .halo { stroke: var(--bad); opacity: 1; }
.car.hinted .halo { stroke: var(--sign); opacity: 1; animation: pulse 0.9s ease-in-out 3; }
.car.shake { animation: shake 0.28s; }
.car:focus, .car:focus-visible { outline: none; }
.car:focus-visible .halo { stroke: var(--focus); opacity: 1; }

/* ---------- Conduit ---------- */
.tile { cursor: pointer; transition: transform 0.16s ease-out; }
.cell .bed { fill: var(--slab-raise); }
.tile .pipe { stroke: var(--dry); stroke-width: 2.6; stroke-linecap: round; fill: none; transition: stroke 0.2s; }
.tile .hub { fill: var(--dry); transition: fill 0.2s; }
.tile .cap { fill: var(--slab-raise); stroke: var(--dry); stroke-width: 1.2; transition: stroke 0.2s; }
.tile.wet .pipe { stroke: var(--water); }
.tile.wet .hub { fill: var(--water); }
.tile.wet .cap { stroke: var(--water); fill: color-mix(in srgb, var(--water) 30%, var(--slab-raise)); }
.cell .ring { fill: none; stroke-width: 0.9; opacity: 0; }
.cell.flash-optimal .ring { stroke: var(--ok); opacity: 1; }
.cell.flash-wasted .ring { stroke: var(--warn); opacity: 1; }
.cell.hinted .ring { stroke: var(--sign); opacity: 1; animation: pulse 0.9s ease-in-out 3; }
.cell:focus, .cell:focus-visible { outline: none; }
.cell:focus-visible .ring { stroke: var(--focus); opacity: 1; }
.source-mark { fill: var(--sign); }
.source-drop { fill: var(--on-sign); }
.board.solved .tile.wet .pipe { stroke: var(--sign); }
.board.solved .tile.wet .hub { fill: var(--sign); }

/* ---------- Tumbler ---------- */
.tb { width: 100%; max-width: 420px; height: 100%; display: flex; flex-direction: column; gap: 10px; min-height: 0; }
.tb-rows { flex: 1; min-height: 0; overflow-y: auto; background: var(--slab); border-radius: 14px; padding: 8px; display: flex; flex-direction: column; gap: 4px; }
.tb-row { display: grid; grid-template-columns: 26px 1fr auto; align-items: center; gap: 8px; padding: 3px 6px; border-radius: 9px; }
.tb-row.active { background: var(--slab-raise); }
.tb-row .n { font-family: var(--font-data); font-size: 11px; color: var(--dry); text-align: right; }
.tb-pins { display: flex; gap: 6px; }
.peg { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; border: 0; padding: 0; flex: none; }
.peg.empty { background: transparent; box-shadow: inset 0 0 0 1.5px var(--slab-line); }
.peg.blank { background: rgba(255,255,255,0.05); box-shadow: inset 0 0 0 1.5px rgba(255,255,255,0.18); }
.tb-row.active .peg.blank { box-shadow: inset 0 0 0 1.5px rgba(255,255,255,0.4); }
.peg svg { width: 14px; height: 14px; }
.tb-fb { display: grid; grid-template-columns: repeat(2, 9px); gap: 3px; padding-right: 2px; }
.tb-fb i { width: 9px; height: 9px; border-radius: 50%; display: block; box-shadow: inset 0 0 0 1px rgba(255,255,255,0.18); }
.tb-fb i.x { background: var(--paint); box-shadow: none; }
.tb-fb i.p { box-shadow: inset 0 0 0 2px var(--paint); }
.tb-fbtext { font-family: var(--font-data); font-size: 11px; color: var(--dry); min-width: 34px; text-align: right; }
.tb-row .flag { width: 6px; height: 6px; border-radius: 50%; display: inline-block; margin-left: 4px; }
.tb-palette { display: flex; gap: 6px; flex-wrap: wrap; justify-content: center; }
.tb-palette .peg { width: 38px; height: 38px; cursor: pointer; box-shadow: 0 1px 0 rgba(0,0,0,0.25); }
.tb-palette .peg[disabled] { opacity: 0.45; cursor: default; }
.card[data-game="tumbler"] .verdict { top: 18px; bottom: auto; }
.tb-palette .peg svg { width: 16px; height: 16px; }
.tb-actions { display: flex; gap: 8px; justify-content: center; align-items: center; }
.tb-secret { display: flex; gap: 6px; align-items: center; justify-content: center; font-size: 13px; color: var(--ink-soft); }

/* ---------- sheets ---------- */
.sheet-backdrop { position: fixed; inset: 0; background: rgba(10, 12, 14, 0.45); z-index: 20; }
.sheet {
  position: fixed; z-index: 21; left: 0; right: 0; bottom: 0; max-height: 92%;
  background: var(--panel); border-radius: 18px 18px 0 0; box-shadow: var(--shadow);
  display: flex; flex-direction: column;
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (min-width: 720px) {
  .sheet { left: 50%; right: auto; width: 640px; transform: translateX(-50%); bottom: 24px; border-radius: 18px; max-height: calc(100% - 48px); }
}
.sheet-head {
  display: flex; align-items: center; gap: 10px; padding-block: 14px;
  padding-left: max(18px, env(safe-area-inset-left, 0px)); padding-right: max(18px, env(safe-area-inset-right, 0px));
  border-bottom: 1px solid var(--rule);
}
.sheet-head h2 { margin: 0; font-family: var(--font-display); font-size: 26px; letter-spacing: 0.03em; text-transform: uppercase; line-height: 1; }
.sheet-head .btn { margin-left: auto; }
.sheet-body {
  overflow-y: auto; padding-block: 16px 20px;
  padding-left: max(18px, env(safe-area-inset-left, 0px)); padding-right: max(18px, env(safe-area-inset-right, 0px));
  display: flex; flex-direction: column; gap: 18px;
}
.sheet-foot {
  display: flex; gap: 10px; align-items: center; flex-wrap: wrap; border-top: 1px solid var(--rule); padding-block: 12px;
  padding-left: max(18px, env(safe-area-inset-left, 0px)); padding-right: max(18px, env(safe-area-inset-right, 0px));
}
.sheet-foot .note { flex: 1 1 200px; font-size: 13px; color: var(--ink-soft); }
fieldset { border: 0; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 10px; min-width: 0; }
legend { font-family: var(--font-display); font-weight: 700; font-size: 15px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-soft); padding: 0; margin-bottom: 8px; }
.fields { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px; }
.field { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.field label, .lbl { font-size: 13px; font-weight: 600; }
.field .help { font-size: 12px; color: var(--ink-soft); }
input[type="text"], input[type="number"], select {
  border: 1px solid var(--rule); border-radius: var(--r-ctl); background: var(--ground); padding: 8px 10px; min-height: 38px; width: 100%; min-width: 0;
}
input:focus, select:focus { border-color: var(--focus); outline: none; }
.inline { display: flex; gap: 8px; align-items: stretch; }
.inline input { flex: 1; }
.plan { display: flex; flex-direction: column; gap: 8px; }
.plan-row { display: grid; grid-template-columns: 22px minmax(0, 1.4fr) minmax(0, 0.8fr) minmax(0, 0.8fr) auto auto; gap: 8px; align-items: center; }
.plan-row .idx { font-family: var(--font-data); font-size: 12px; color: var(--ink-soft); text-align: right; }
.plan-head { font-size: 12px; color: var(--ink-soft); font-weight: 600; }
.check { display: flex; gap: 8px; align-items: center; font-size: 14px; }
.check input { width: 18px; height: 18px; accent-color: var(--sign); margin: 0; flex: none; }
.checks { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 10px 16px; }
.icon-btn { border: 1px solid var(--rule); background: transparent; border-radius: 8px; width: 34px; height: 34px; display: grid; place-items: center; padding: 0; }
.presets { display: flex; gap: 8px; flex-wrap: wrap; }
.error { color: var(--bad); font-size: 13px; font-weight: 600; }
.summary-line { font-family: var(--font-data); font-size: 13px; color: var(--ink-soft); }
@media (max-width: 460px) {
  .plan-row { grid-template-columns: 18px minmax(0, 1fr) 64px 64px auto auto; gap: 6px; }
}

/* data sheet */
.stats-row { display: flex; gap: 18px; flex-wrap: wrap; font-family: var(--font-data); font-size: 13px; color: var(--ink-soft); }
.stats-row b { font-size: 22px; color: var(--ink); display: block; font-family: var(--font-display); letter-spacing: 0.02em; }
.table-wrap { overflow-x: auto; border: 1px solid var(--rule); border-radius: 12px; }
table { border-collapse: collapse; width: 100%; font-size: 13px; }
th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--rule); white-space: nowrap; }
th { font-size: 12px; color: var(--ink-soft); font-weight: 600; background: var(--ground); }
tr:last-child td { border-bottom: 0; }
td.num { font-family: var(--font-data); font-variant-numeric: tabular-nums; text-align: right; }
.empty-state { color: var(--ink-soft); font-size: 14px; }
.copybox { width: 100%; min-height: 160px; font-family: var(--font-data); font-size: 12px; border: 1px solid var(--rule); border-radius: 10px; background: var(--ground); padding: 10px; resize: vertical; }
.confirm { border: 1px solid color-mix(in srgb, var(--bad) 40%, var(--rule)); border-radius: 12px; padding: 12px; display: flex; flex-direction: column; gap: 10px; }

/* end / resume panels */
.panel-card { padding: 22px 20px; gap: 14px; overflow-y: auto; bottom: auto; max-height: calc(100% - 24px); }
.panel-card h2 { margin: 0; font-family: var(--font-display); font-size: 38px; line-height: 0.95; text-transform: uppercase; letter-spacing: 0.02em; text-wrap: balance; }
.panel-card p { margin: 0; color: var(--ink-soft); max-width: 60ch; }
.kv { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 10px; }
.kv div { border: 1px solid var(--rule); border-radius: 12px; padding: 10px 12px; }
.kv span { display: block; font-size: 12px; color: var(--ink-soft); }
.kv b { font-family: var(--font-display); font-size: 26px; letter-spacing: 0.02em; }

.toast {
  position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(18px + env(safe-area-inset-bottom, 0px)); z-index: 30;
  background: var(--ink); color: var(--panel); padding: 9px 14px; border-radius: 10px; font-size: 14px; font-weight: 600;
  max-width: calc(100% - 32px); box-shadow: var(--shadow);
}
.loading { margin: auto; color: var(--ink-soft); font-size: 14px; display: flex; gap: 10px; align-items: center; }
.spinner { width: 18px; height: 18px; border-radius: 50%; border: 2px solid var(--rule); border-top-color: var(--sign); animation: spin 0.8s linear infinite; }

@keyframes spin { to { transform: rotate(360deg); } }
@keyframes pulse { 0%, 100% { stroke-opacity: 1; } 50% { stroke-opacity: 0.25; } }
@keyframes shake { 0%, 100% { translate: 0 0; } 25% { translate: -0.8px 0; } 75% { translate: 0.8px 0; } }

@media (max-height: 620px) {
  .card-head { padding-top: 10px; }
  .rule { font-size: 12.5px; margin-top: 4px; }
  .board-wrap { padding-block: 8px; }
  .tools { padding-bottom: 10px; }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; transition-duration: 0.01ms !important; }
}
</style>

<div class="app" id="app">
  <header class="bar free" id="bar">
    <div class="brand">

  <main class="stage" id="stage" aria-live="polite"></main>
</div>
<div id="layer"></div>
<div class="toast" id="toast" role="status" hidden></div>

<script>/* Puzzle Reel engines: pure, deterministic, DOM-free.
 * Every generator takes (level, seed) and returns the same puzzle for the same pair.
 * Every game exposes the same run interface so one harness can log and score moves. */
function PuzzleEnginesFactory(root) {
  'use strict';

  // ---------- seeded randomness ----------
  function fnv1a(str) {
    let h = 0x811c9dc5;
    for (let i = 0; i < str.length; i++) {
      h ^= str.charCodeAt(i);
      h = Math.imul(h, 0x01000193);
    }
    return h >>> 0;
  }
  function mulberry32(a) {
    a = a >>> 0;
    return function () {
      a = (a + 0x6D2B79F5) >>> 0;
      let t = a;
      t = Math.imul(t ^ (t >>> 15), t | 1);
      t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  function makeRng(seed) {
    const r = mulberry32(seed);
    r.int = (n) => Math.floor(r() * n);
    r.shuffle = (arr) => {
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(r() * (i + 1));
        const t = arr[i]; arr[i] = arr[j]; arr[j] = t;
      }
      return arr;
    };
    return r;
  }
  function puzzleSeed(sessionSeed, block, game, level, j) {
    return fnv1a(sessionSeed + '|' + block + '|' + game + '|' + level + '|' + j);
  }

  // =====================================================================
  // OUTBOUND: cars only drive forward. A tapped car leaves the lot if its
  // lane is clear, otherwise it slides until it bumps into something.
  // Forward-only movement makes the state graph acyclic, so we can label
  // every reachable state with its distance to the goal.
  // =====================================================================
  const DIR = { N: [0, -1], E: [1, 0], S: [0, 1], W: [-1, 0] };
  const DIRS = ['N', 'E', 'S', 'W'];
  const EXIT = -1;

  function obOccupancy(p, st) {
    const occ = new Int16Array(p.w * p.h).fill(-1);
    for (let i = 0; i < p.cars.length; i++) {
      const a = st[i];
      if (a === EXIT) continue;
      const c = p.cars[i];
      const d = DIR[c.dir];
      for (let k = 0; k < c.len; k++) {
        occ[(c.y + (k + a) * d[1]) * p.w + (c.x + (k + a) * d[0])] = i;
      }
    }
    return occ;
  }
  // New advance for car i: EXIT if it leaves, unchanged if it cannot move.
  function obSlide(p, st, occ, i) {
    const c = p.cars[i];
    const a = st[i];
    const d = DIR[c.dir];
    let fx = c.x + (c.len - 1 + a) * d[0];
    let fy = c.y + (c.len - 1 + a) * d[1];
    let steps = 0;
    for (;;) {
      const nx = fx + d[0], ny = fy + d[1];
      if (nx < 0 || ny < 0 || nx >= p.w || ny >= p.h) return EXIT;
      if (occ[ny * p.w + nx] !== -1) return a + steps;
      fx = nx; fy = ny; steps++;
    }
  }
  function obKey(st, B) {
    let k = 0;
    for (let i = st.length - 1; i >= 0; i--) k = k * B + (st[i] === EXIT ? B - 1 : st[i]);
    return k;
  }
  function obMovable(p, st) {
    const occ = obOccupancy(p, st);
    const out = [];
    for (let i = 0; i < p.cars.length; i++) {
      if (st[i] === EXIT) continue;
      if (obSlide(p, st, occ, i) !== st[i]) out.push(i);
    }
    return out;
  }

  // Full analysis of the reachable state graph.
  // d: fewest taps to clear the lot (Infinity = dead end)
  // p: chance a player tapping movable cars at random clears the lot
  function obAnalyze(p) {
    const n = p.cars.length;
    const B = Math.max(p.w, p.h) + 2;
    const memo = new Map();
    let deadStates = 0;
    function solve(st) {
      const key = obKey(st, B);
      const hit = memo.get(key);
      if (hit) return hit;
      let left = 0;
      for (let i = 0; i < n; i++) if (st[i] !== EXIT) left++;
      let res;
      if (left === 0) {
        res = { d: 0, p: 1, m: 0 };
      } else {
        const occ = obOccupancy(p, st);
        let best = Infinity, ps = 0, m = 0;
        for (let i = 0; i < n; i++) {
          if (st[i] === EXIT) continue;
          const na = obSlide(p, st, occ, i);
          if (na === st[i]) continue;
          m++;
          const ns = st.slice();
          ns[i] = na;
          const r = solve(ns);
          if (r.d + 1 < best) best = r.d + 1;
          ps += r.p;
        }
        res = { d: best, p: m ? ps / m : 0, m };
        if (best === Infinity) deadStates++;
      }
      memo.set(key, res);
      return res;
    }
    const start = new Array(n).fill(0);
    const r0 = solve(start);
    // first-move profile
    const occ = obOccupancy(p, start);
    let firstMoves = 0, safeFirst = 0, optimalFirst = 0;
    for (let i = 0; i < n; i++) {
      const na = obSlide(p, start, occ, i);
      if (na === 0) continue;
      firstMoves++;
      const ns = start.slice(); ns[i] = na;
      const r = memo.get(obKey(ns, B));
      if (r.d !== Infinity) safeFirst++;
      if (r.d === r0.d - 1) optimalFirst++;
    }
    return {
      memo, B,
      optimal: r0.d,
      pRandom: r0.p,
      states: memo.size,
      deadStates,
      firstMoves, safeFirst, optimalFirst,
    };
  }

  function dirOf(v) { return v[0] === 1 ? 'E' : v[0] === -1 ? 'W' : v[1] === 1 ? 'S' : 'N'; }

  // Plants a four-car trap. A sits in a lane that crosses V's lane. If A is
  // driven too early it slides onto that crossing, stops against B, and the
  // cycle A <- B <- Z <- V <- A can no longer be broken. Cars are added in an
  // order that keeps the lot solvable (V, then Z, then B, then A).
  function obPlantTrap(L, rng, occ, cars) {
    const w = L.w, h = L.h;
    const inb = (c) => c[0] >= 0 && c[1] >= 0 && c[0] < w && c[1] < h;
    const isFree = (c) => inb(c) && occ[c[1] * w + c[0]] === -1;
    const add = (a, v, k) => [a[0] + v[0] * k, a[1] + v[1] * k];
    const laneOf = (front, d) => {
      const out = [];
      let c = add(front, d, 1);
      while (inb(c)) { out.push(c); c = add(c, d, 1); }
      return out;
    };
    const clearLane = (front, d, extra) => laneOf(front, d).every((c) => isFree(c) && !(extra && extra.some((e) => e[0] === c[0] && e[1] === c[1])));
    const carCells = (rear, d, len) => { const out = []; for (let k = 0; k < len; k++) out.push(add(rear, d, k)); return out; };
    const len = () => (rng() < L.truck ? 3 : 2);
    for (let attempt = 0; attempt < 80; attempt++) {
      // A
      const d = DIR[DIRS[rng.int(4)]];
      const la = len();
      const aRear = [rng.int(w), rng.int(h)];
      const aCells = carCells(aRear, d, la);
      if (!aCells.every(isFree)) continue;
      const aFront = aCells[la - 1];
      if (!clearLane(aFront, d)) continue;
      const lane = laneOf(aFront, d);
      if (lane.length < 3) continue;
      // B: perpendicular, covering lane[k]; facing n
      const k = 1 + rng.int(lane.length - 1);
      const n = rng() < 0.5 ? [-d[1], d[0]] : [d[1], -d[0]];
      const lb = 2;
      const off = rng.int(lb);
      const bRear = add(lane[k], n, -off);
      const bCells = carCells(bRear, n, lb);
      if (!bCells.every(isFree) || bCells.some((c) => aCells.some((e) => e[0] === c[0] && e[1] === c[1]))) continue;
      const bFront = bCells[lb - 1];
      const bLane = laneOf(bFront, n);
      if (bLane.length < 2) continue;
      if (!clearLane(bFront, n, aCells)) continue;
      // X: a cell A covers only after sliding up to B
      const lo = Math.max(0, k - la);
      const xi = lo + rng.int(k - lo);
      const X = lane[xi];
      // Z: in B's lane, parallel to A, facing back toward X's line
      const t = rng.int(Math.min(2, bLane.length - 1));
      const Q = bLane[t];
      const lz = 2;
      const zDir = [-d[0], -d[1]];
      const zCells = carCells(add(Q, zDir, -(lz - 1)), zDir, lz); // rear first, front = Q
      const taken = aCells.concat(bCells);
      if (!zCells.every((c) => isFree(c) && !taken.some((e) => e[0] === c[0] && e[1] === c[1]))) continue;
      if (!clearLane(Q, zDir, taken)) continue;
      // P: where Z's lane meets X's line
      const P = add(Q, zDir, k - xi);
      // V: on X's line beyond A's lane, covering P, facing A's lane
      const vDir = [-n[0], -n[1]];
      const lv = 2;
      const q = rng.int(lv);
      const vFront = add(P, vDir, q);
      const vCells = carCells(add(vFront, vDir, -(lv - 1)), vDir, lv);
      // front must stay strictly on Z's side of A's lane
      const sideDist = (c) => (c[0] - X[0]) * n[0] + (c[1] - X[1]) * n[1];
      if (sideDist(vFront) < 1) continue;
      const taken2 = taken.concat(zCells);
      if (!vCells.every((c) => isFree(c) && !taken2.some((e) => e[0] === c[0] && e[1] === c[1]))) continue;
      if (!clearLane(vFront, vDir, taken2)) continue;
      // commit in solvable order: A, B, Z, V (V leaves first)
      const commit = (rear, dv, l) => {
        const id = cars.length;
        cars.push({ x: rear[0], y: rear[1], dir: dirOf(dv), len: l });
        for (const c of carCells(rear, dv, l)) occ[c[1] * w + c[0]] = id;
      };
      commit(aRear, d, la);
      commit(bRear, n, lb);
      commit(zCells[0], zDir, lz);
      commit(vCells[0], vDir, lv);
      return true;
    }
    return false;
  }

  // Constructive placement: each new car must have a clear lane to the edge
  // past the cars already placed, so clearing them in reverse order always works.
  function obPlace(L, rng) {
    const w = L.w, h = L.h;
    const occ = new Int16Array(w * h).fill(-1);
    const cars = [];
    let planted = 0;
    for (let g = 0; g < (L.traps || 0); g++) {
      if (cars.length + 4 > L.cars) break;
      if (obPlantTrap(L, rng, occ, cars)) planted++;
    }
    if (L.traps && planted < 1) return null;
    let tries = 0;
    while (cars.length < L.cars && tries < 600) {
      tries++;
      const len = rng() < L.truck ? 3 : 2;
      const dir = DIRS[rng.int(4)];
      const d = DIR[dir];
      const x = rng.int(w), y = rng.int(h);
      const fx = x + (len - 1) * d[0], fy = y + (len - 1) * d[1];
      if (fx < 0 || fy < 0 || fx >= w || fy >= h) continue;
      let ok = true;
      for (let k = 0; k < len && ok; k++) if (occ[(y + k * d[1]) * w + (x + k * d[0])] !== -1) ok = false;
      if (!ok) continue;
      let lx = fx + d[0], ly = fy + d[1];
      while (ok && lx >= 0 && ly >= 0 && lx < w && ly < h) {
        if (occ[ly * w + lx] !== -1) ok = false;
        lx += d[0]; ly += d[1];
      }
      if (!ok) continue;
      const id = cars.length;
      cars.push({ x, y, dir, len });
      for (let k = 0; k < len; k++) occ[(y + k * d[1]) * w + (x + k * d[0])] = id;
    }
    return cars.length === L.cars ? cars : null;
  }

  const Outbound = {
    id: 'outbound',
    name: 'Outbound',
    noun: 'car',
    rule: 'Tap a car to drive it forward. It leaves the lot if the way is clear, or stops when it bumps into something.',
    goal: 'Clear the lot.',
    // band: target range for the chance that random tapping clears the lot
    levels: {
      1: { w: 5, h: 5, cars: 5, truck: 0, traps: 0, band: [0.99, 1], attempts: 40 },
      2: { w: 6, h: 6, cars: 7, truck: 0.1, traps: 0, band: [0.99, 1], attempts: 40 },
      3: { w: 6, h: 6, cars: 8, truck: 0.15, traps: 1, band: [0.2, 0.75], attempts: 120 },
      4: { w: 6, h: 6, cars: 10, truck: 0.2, traps: 2, band: [0.1, 0.4], attempts: 160 },
      5: { w: 7, h: 7, cars: 12, truck: 0.25, traps: 3, band: [0, 0.18], attempts: 200 },
    },
    describe(p) { return p.w + '×' + p.h + ' lot, ' + p.cars.length + ' cars'; },
    generate(level, seed) {
      const L = this.levels[level];
      const rng = makeRng(seed);
      let best = null, bestGap = Infinity;
      for (let attempt = 0; attempt < L.attempts; attempt++) {
        const placed = obPlace(L, rng);
        if (!placed) continue;
        rng.shuffle(placed); // car ids must not reveal the solution order
        const p = { w: L.w, h: L.h, cars: placed };
        const an = obAnalyze(p);
        if (an.optimal === Infinity) continue;
        const lo = L.band[0], hi = L.band[1];
        const gap = an.pRandom < lo ? lo - an.pRandom : an.pRandom > hi ? an.pRandom - hi : 0;
        if (gap < bestGap) { best = { p, an }; bestGap = gap; }
        if (gap === 0) break;
      }
      if (!best) {
        // extremely rare: fall back to a lot without planted traps
        const fallback = Object.assign({}, L, { traps: 0 });
        for (let attempt = 0; !best && attempt < 200; attempt++) {
          const placed = obPlace(fallback, rng);
          if (!placed) continue;
          rng.shuffle(placed);
          const p = { w: L.w, h: L.h, cars: placed };
          const an = obAnalyze(p);
          if (an.optimal !== Infinity) best = { p, an };
        }
        bestGap = Infinity;
      }
      const cars = best.p.cars.map((c, i) => ({
        id: i, label: 'c' + (i + 1), x: c.x, y: c.y, dir: c.dir, len: c.len,
        color: (i * 7 + rng.int(3)) % 10,
      }));
      const an = best.an;
      return {
        game: 'outbound', level, seed,
        w: L.w, h: L.h, cars,
        an,
        reference: an.optimal,
        features: {
          cars: cars.length,
          trucks: cars.filter((c) => c.len === 3).length,
          optimal_moves: an.optimal,
          p_random_solve: round(an.pRandom, 4),
          reachable_states: an.states,
          dead_end_states: an.deadStates,
          first_moves: an.firstMoves,
          safe_first_moves: an.safeFirst,
          in_band: bestGap === 0,
        },
      };
    },
    newRun(p) { return { st: new Array(p.cars.length).fill(0), hist: [] }; },
    dist(p, st) {
      const r = p.an.memo.get(obKey(st, p.an.B));
      return r ? r.d : Infinity;
    },
    remaining(p, run) { return run.st.filter((a) => a !== EXIT).length; },
    movable(p, run) { return obMovable(p, run.st); },
    // Tap car i. Returns a scored action record.
    tap(p, run, i) {
      if (run.st[i] === EXIT) return null;
      const occ = obOccupancy(p, run.st);
      const from = run.st[i];
      const to = obSlide(p, run.st, occ, i);
      const dB = this.dist(p, run.st);
      if (to === from) {
        return { kind: 'blocked', target: p.cars[i].label, index: i, from, to, dBefore: dB, dAfter: dB, cls: 'blocked' };
      }
      run.hist.push([i, from]);
      run.st[i] = to;
      const dA = this.dist(p, run.st);
      let cls;
      if (dB === Infinity) cls = 'in_dead_end';
      else if (dA === Infinity) cls = 'dead_end';
      else if (dA === dB - 1) cls = 'optimal';
      else cls = 'wasted';
      const solved = run.st.every((a) => a === EXIT);
      const stuck = !solved && obMovable(p, run.st).length === 0;
      return { kind: 'move', target: p.cars[i].label, index: i, from, to, exited: to === EXIT, dBefore: dB, dAfter: dA, cls, solved, stuck };
    },
    undo(p, run) {
      const h = run.hist.pop();
      if (!h) return null;
      const i = h[0], back = h[1];
      const was = run.st[i];
      const dB = this.dist(p, run.st);
      run.st[i] = back;
      return { target: p.cars[i].label, index: i, from: was, to: back, dBefore: dB, dAfter: this.dist(p, run.st) };
    },
    restart(p, run) { run.st.fill(0); run.hist = []; },
    hint(p, run) {
      const dB = this.dist(p, run.st);
      if (dB === Infinity) return { kind: 'dead_end' };
      const occ = obOccupancy(p, run.st);
      for (let i = 0; i < p.cars.length; i++) {
        if (run.st[i] === EXIT) continue;
        const na = obSlide(p, run.st, occ, i);
        if (na === run.st[i]) continue;
        const ns = run.st.slice(); ns[i] = na;
        if (this.dist(p, ns) === dB - 1) return { kind: 'target', index: i, target: p.cars[i].label };
      }
      return { kind: 'none' };
    },
    progress(p, run) { return { done: p.cars.length - this.remaining(p, run), total: p.cars.length }; },
    serialize(run) { return { st: run.st.slice(), hist: run.hist.map((h) => h.slice()) }; },
    restore(p, data) { return { st: data.st.slice(), hist: data.hist.map((h) => h.slice()) }; },
  };

  // =====================================================================
  // CONDUIT: every tile is part of one spanning tree. Tiles start rotated.
  // A tap turns a tile a quarter turn clockwise. Puzzles have exactly one
  // solution, so each tile has a known number of taps left.
  // =====================================================================
  const N = 1, E = 2, S = 4, W = 8;
  const SIDES = [N, E, S, W];
  const OPP = { 1: 4, 2: 8, 4: 1, 8: 2 };
  const DXY = { 1: [0, -1], 2: [1, 0], 4: [0, 1], 8: [-1, 0] };
  function rotCW(m, r) {
    r = ((r % 4) + 4) % 4;
    for (let k = 0; k < r; k++) m = ((m << 1) | (m >> 3)) & 15;
    return m;
  }
  function bits(m) { let c = 0; while (m) { c += m & 1; m >>= 1; } return c; }
  function periodOf(m) { return rotCW(m, 1) === m ? 1 : rotCW(m, 2) === m ? 2 : 4; }

  // Random spanning tree grown from the source; no four-way crossings.
  function cdTree(w, h, src, rng) {
    for (let attempt = 0; attempt < 50; attempt++) {
      const masks = new Array(w * h).fill(0);
      const inTree = new Uint8Array(w * h);
      const frontier = [];
      const addFrontier = (c) => {
        const x = c % w, y = (c / w) | 0;
        for (const s of SIDES) {
          const nx = x + DXY[s][0], ny = y + DXY[s][1];
          if (nx < 0 || ny < 0 || nx >= w || ny >= h) continue;
          const nc = ny * w + nx;
          if (!inTree[nc]) frontier.push([c, s, nc]);
        }
      };
      inTree[src] = 1;
      addFrontier(src);
      let count = 1;
      while (frontier.length && count < w * h) {
        const idx = rng.int(frontier.length);
        const e = frontier[idx];
        frontier[idx] = frontier[frontier.length - 1];
        frontier.pop();
        const c = e[0], s = e[1], nc = e[2];
        if (inTree[nc]) continue;
        if (bits(masks[c]) >= 3) continue;
        masks[c] |= s;
        masks[nc] |= OPP[s];
        inTree[nc] = 1;
        count++;
        addFrontier(nc);
      }
      if (count === w * h) return masks;
    }
    return null;
  }

  // Constraint solver: counts solutions (up to `limit`) for a set of tiles
  // whose rotations are unknown. Edges must agree, borders stay closed,
  // and the network must be one tree.
  function cdSolve(w, h, tiles, limit) {
    const n = w * h;
    const cand = [];
    for (let i = 0; i < n; i++) {
      const seen = [];
      for (let r = 0; r < 4; r++) {
        const m = rotCW(tiles[i], r);
        if (seen.indexOf(m) < 0) seen.push(m);
      }
      cand.push(seen);
    }
    const dom0 = new Uint8Array(n);
    for (let i = 0; i < n; i++) {
      const x = i % w, y = (i / w) | 0;
      let d = 0;
      for (let k = 0; k < cand[i].length; k++) {
        const m = cand[i][k];
        if ((m & N) && y === 0) continue;
        if ((m & S) && y === h - 1) continue;
        if ((m & W) && x === 0) continue;
        if ((m & E) && x === w - 1) continue;
        d |= 1 << k;
      }
      dom0[i] = d;
    }
    const sideState = (dom, i, s) => {
      let open = 0, closed = 0;
      const c = cand[i];
      for (let k = 0; k < c.length; k++) {
        if (!(dom[i] & (1 << k))) continue;
        if (c[k] & s) open++; else closed++;
      }
      if (!open && !closed) return -1;
      return open && closed ? 2 : open ? 1 : 0;
    };
    const propagate = (dom, queue) => {
      while (queue.length) {
        const i = queue.pop();
        const x = i % w, y = (i / w) | 0;
        if (!dom[i]) return false;
        for (const s of SIDES) {
          const st = sideState(dom, i, s);
          if (st === -1) return false;
          if (st === 2) continue;
          const nx = x + DXY[s][0], ny = y + DXY[s][1];
          if (nx < 0 || ny < 0 || nx >= w || ny >= h) continue;
          const j = ny * w + nx;
          const os = OPP[s];
          let nd = 0;
          const cj = cand[j];
          for (let k = 0; k < cj.length; k++) {
            if (!(dom[j] & (1 << k))) continue;
            if (((cj[k] & os) ? 1 : 0) === st) nd |= 1 << k;
          }
          if (nd !== dom[j]) {

    const t = $('#toast');
    t.textContent = msg;
    t.hidden = false;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => { t.hidden = true; }, ms || 2400);

  // ------------------------------------------------- puzzle generation
  // Generation runs in a worker built from the same engine source, so the
  // next puzzle is ready while the current one is played. Same seed, same puzzle.
  function safeGenerate(game, level, seed) {
    let lastErr = null;
    for (let k = 0; k < 4; k++) {
      try { return E.games[game].generate(level, (seed + k) >>> 0); } catch (e) { lastErr = e; }
    }
    throw lastErr;
  }
  const Gen = {
    worker: null, nextId: 1, waits: new Map(), cache: new Map(), inflight: new Map(),
    init() {
      try {
        if (typeof Worker === 'undefined' || typeof PuzzleEnginesFactory !== 'function') return;
        const src = '(' + PuzzleEnginesFactory.toString() + ')(self);\n' +
          'self.onmessage = function (e) { var d = e.data, p = null, err = null;' +
          ' for (var k = 0; k < 4 && !p; k++) { try { p = self.Engines.games[d.game].generate(d.level, (d.seed + k) >>> 0); } catch (x) { err = x; } }' +
          ' if (p) self.postMessage({ id: d.id, puzzle: p }); else self.postMessage({ id: d.id, error: String(err && err.message || err) }); };';
        const url = URL.createObjectURL(new Blob([src], { type: 'text/javascript' }));
        const w = new Worker(url);
        w.onmessage = (e) => {
          const job = this.waits.get(e.data.id);
          if (!job) return;
          this.waits.delete(e.data.id);
          clearTimeout(job.timer);
          if (e.data.error) job.fallback(); else job.resolve(e.data.puzzle);
        };
        w.onerror = () => this.fail();
        this.worker = w;
      } catch (e) { this.worker = null; }
    },
    fail() {
      this.worker = null;
      for (const job of this.waits.values()) { clearTimeout(job.timer); job.fallback(); }
      this.waits.clear();
    },
    key(g, l, sd) { return g + '|' + l + '|' + sd; },
    put(k, p) {
      this.cache.set(k, p);
      while (this.cache.size > 14) this.cache.delete(this.cache.keys().next().value);
    },
    peek(g, l, sd) { return this.cache.get(this.key(g, l, sd)) || null; },
    sync(g, l, sd) {
      const k = this.key(g, l, sd);
      let p = this.cache.get(k);
      if (!p) { p = safeGenerate(g, l, sd); this.put(k, p); }
      return p;
    },
    get(g, l, sd) {
      const k = this.key(g, l, sd);
      if (this.cache.has(k)) return Promise.resolve(this.cache.get(k));
      if (this.inflight.has(k)) return this.inflight.get(k);
      const pr = new Promise((resolve, reject) => {
        const viaMain = () => setTimeout(() => { try { resolve(safeGenerate(g, l, sd)); } catch (e) { reject(e); } }, 0);
        if (!this.worker) { viaMain(); return; }
        const id = this.nextId++;
        const job = {
          resolve, fallback: viaMain,
          timer: setTimeout(() => { if (this.waits.has(id)) { this.waits.delete(id); viaMain(); } }, 20000),
        };
        this.waits.set(id, job);
        try { this.worker.postMessage({ id, game: g, level: l, seed: sd }); } catch (e) { this.waits.delete(id); clearTimeout(job.timer); viaMain(); }
      }).then((p) => { this.put(k, p); this.inflight.delete(k); return p; }, (e) => { this.inflight.delete(k); throw e; });
      this.inflight.set(k, pr);
      return pr;
    },
  };

  // ------------------------------------------------------- sequencing
  // A plan is a list of blocks. Puzzle seeds come from (session seed, block,
  // game, level, occurrence), so fixed blocks give everyone the same puzzles
  // and adaptive blocks give everyone the same puzzle at each level.
  function seqInit(blocks, seed) { return { seed, blocks: clone(blocks), b: 0, k: 0, n: 0, adapt: {}, counts: {} }; }
  function seqTotal(S) { return S.blocks.reduce((a, b) => a + b.count, 0); }
  function seqNext(S) {
    while (S.b < S.blocks.length && S.k >= S.blocks[S.b].count) { S.b++; S.k = 0; }
    if (S.b >= S.blocks.length) return null;
    const B = S.blocks[S.b];
    const game = B.game === 'mixed' ? ORDER[S.k % ORDER.length] : B.game;
    const akey = S.b + ':' + game;
    if (!S.adapt[akey]) S.adapt[akey] = { level: B.level, streak: 0 };
    const level = B.adaptive ? S.adapt[akey].level : B.level;
    const ckey = S.b + ':' + game + ':' + level;
    const j = S.counts[ckey] || 0;
    S.counts[ckey] = j + 1;
    const spec = {
      seq: S.n + 1, block: S.b + 1, inBlock: S.k + 1, game, level, adaptive: !!B.adaptive, j,
      seed: E.puzzleSeed(S.seed, S.b, game, level, j),
    };
    spec.id = 'B' + spec.block + '-' + game + '-L' + level + '-' + (j + 1);
    S.k++;
    S.n++;
    return spec;
  }
  // 2-up / 1-down staircase per game within a block
  function seqRecord(S, spec, success) {
    if (!spec.adaptive) return null;
    const a = S.adapt[(spec.block - 1) + ':' + spec.game];
    if (!a) return null;
    const before = a.level;
    if (success) {
      a.streak++;
      if (a.streak >= 2) { a.level = Math.min(5, a.level + 1); a.streak = 0; }
    } else {
      a.level = Math.max(1, a.level - 1);
      a.streak = 0;
    }
    return { from: before, to: a.level, changed: a.level !== before };
  }

  const PRESETS = [

  // ------------------------------------------------------- sessions
  const Sessions = {
    index() { return store.get('pr1.index', []); },
    load(id) { return store.get('pr1.s.' + id, null); },
    save(S) {
      const ok = store.set('pr1.s.' + S.id, S);
      const idx = this.index().filter((x) => x.id !== S.id);
      idx.unshift({ id: S.id, kind: S.kind, participant: S.participant, condition: S.condition, startedAt: S.startedAt, status: S.status, puzzles: S.puzzles.length });
      return store.set('pr1.index', idx) && ok;
    },
    all() { return this.index().map((x) => this.load(x.id)).filter(Boolean); },
    prune() {
      const idx = this.index();
      const free = idx.filter((x) => x.kind === 'free');
      if (free.length <= 6) return;
      const drop = new Set(free.slice(6).map((x) => x.id));
      for (const id of drop) store.del('pr1.s.' + id);
      store.set('pr1.index', idx.filter((x) => !drop.has(x.id)));
    },
    clear() {
      for (const x of this.index()) store.del('pr1.s.' + x.id);
      store.del('pr1.index');
      store.del('pr1.active');
    },
  };
  function newSession(kind, setup) {
    return {
      id: uid(), kind,
      participant: (setup.participant || '').trim(),
      condition: (setup.condition || '').trim(),
      seed: setup.seed >>> 0,
      options: Object.assign({}, setup.options),
      blocks: clone(setup.blocks),
      app_version: APP_VERSION, engine_version: E.version,
      device: {

        pixel_ratio: window.devicePixelRatio || 1,
        touch: 'ontouchstart' in window ? 1 : 0,
      },
      startedAt: new Date().toISOString(), endedAt: null, status: 'active',
      t0wall: Date.now(),
      seq: seqInit(setup.blocks, setup.seed >>> 0),
      events: [], puzzles: [],
      hasMoves: false,
      live: null,
    };
  }

  const APPLIES = {

  function blankCounts() {
    return { moves: 0, optimal: 0, wasted: 0, dead_end: 0, in_dead_end: 0, blocked: 0, undo: 0, restart: 0, hint: 0, suboptimal: 0, zero_info: 0, inconsistent: 0, neutral: 0, solved: 0, infoRatioSum: 0, infoRatioN: 0 };

  // ============================================================== cards
  class Card {
    constructor(app, spec, puzzle, snap) {
      this.app = app;
      this.spec = spec;
      this.p = puzzle;
      this.G = E.games[spec.game];
      this.o = app.session.options;
      this.par = Math.max(1, Math.ceil(puzzle.reference * this.o.par));
      this.run = snap ? this.G.restore(puzzle, snap.run) : this.G.newRun(puzzle);
      this.c = snap ? Object.assign(blankCounts(), snap.c) : blankCounts();
      this.t0 = now() - (snap ? snap.elapsed : 0);
      this.frozen = snap && snap.summary ? snap.elapsed : null;
      this.firstMove = snap ? snap.firstMove : null;
      this.hiddenMs = snap ? snap.hiddenMs : 0;
      this.hiddenAt = null;
      this.startedAt = snap ? snap.startedAt : new Date().toISOString();
      this.summary = snap ? snap.summary : null;
      this.extra = snap ? snap.extra : null;
      this.busy = false;
      this.timers = new Set();
      this.el = h('article', { class: 'card', 'data-game': spec.game, 'aria-label': this.G.name + ', level ' + spec.level });
      this.buildFrame();
      this.buildBoard();
      this.refresh();
      this.updateMeta();
      if (this.summary) this.showResult(this.summary);
    }
    later(fn, ms) { const t = setTimeout(() => { this.timers.delete(t); fn(); }, ms); this.timers.add(t); return t; }
    destroy() {
      clearInterval(this.tick);
      for (const t of this.timers) clearTimeout(t);
      this.timers.clear();
    }
    elapsed() { return this.frozen != null ? this.frozen : now() - this.t0; }
    buildFrame() {
      this.metaEl = h('div', { class: 'meta', 'aria-live': 'off' });
      const head = h('header', { class: 'card-head' },
        h('span', { class: 'badge ' + this.spec.game, text: this.G.name }),
        h('span', { class: 'lvl', title: 'Level', text: 'L' + this.spec.level }),
        this.metaEl);
      const rule = h('p', { class: 'rule' }, this.G.rule + ' ', h('strong', { text: this.G.goal }));
      this.wrap = h('div', { class: 'board-wrap' });
      this.verdictEl = h('div', { class: 'verdict', role: 'status' });
      this.wrap.append(this.verdictEl);
      this.noticeEl = h('div', { class: 'notice', hidden: true });
      this.toolsEl = h('footer', { class: 'tools' });
      this.el.append(head, rule, this.wrap, this.noticeEl, this.toolsEl);
      this.buildTools();
    }
    buildTools() {
      const t = this.toolsEl;
      t.textContent = '';
      if (this.o.undo && this.G.undo) {
        t.append(h('button', { class: 'btn tool', type: 'button', onclick: () => this.doUndo() }, 'Undo'));
        t.append(h('button', { class: 'btn tool', type: 'button', onclick: () => this.doRestart() }, 'Restart'));
      }
      if (this.o.hints) t.append(h('button', { class: 'btn tool', type: 'button', onclick: () => this.doHint() }, 'Hint'));
      t.append(h('span', { class: 'spacer' }));
      if (this.o.skip) {
        this.skipBtn = h('button', { class: 'btn tool', type: 'button', onclick: () => this.doSkip() }, 'Skip');
        t.append(this.skipBtn);
      }
      t.hidden = !t.querySelector('button');
    }
    start() {
      this.t0 = now();
      this.log('puzzle_start', {
        detail: JSON.stringify({ params: this.G.describe(this.p), reference: this.p.reference, par: this.par, features: this.p.features }),
      });
      this.startTimer();
    }
    startTimer() {
      clearInterval(this.tick);
      if (this.summary) return;
      this.tick = setInterval(() => this.updateMeta(), 1000);
    }
    updateMeta() {
      const m = this.metaEl;
      m.textContent = '';
      const t = this.elapsed();
      if (this.o.counter) {
        if (this.spec.game === 'tumbler') {
          const n = this.summary ? this.run.tries.length : Math.min(this.run.tries.length + 1, this.p.max);
          m.append(h('span', null, (this.summary ? 'Tries ' : 'Try ') + '', h('b', { text: String(n) }), '/' + this.p.max));
        }
        else m.append(h('span', null, 'Moves ', h('b', { text: String(this.c.moves) }), ' · par ' + this.par));
        if (!this.o.limit) m.append(h('span', { text: clock(t) }));
      }
      if (this.o.limit) {
        const left = this.o.limit * 1000 - t;
        m.append(h('span', null, h('b', { text: clock(left) }), ' left'));
        if (left <= 0 && !this.summary) this.resolve('timeout');
      }
    }
    log(event, fields) { this.app.logPuzzle(this, event, fields || {}); }
    verdict(cls, extraText) {
      const map = VERDICT[this.spec.game] || {};
      const text = (map[cls] || '') + (extraText || '');
      if (!text) return;
      const v = this.verdictEl;
      v.className = 'verdict show ' + cls;
      v.textContent = text;
      clearTimeout(this.verdictTimer);
      this.verdictTimer = this.later(() => { v.className = 'verdict'; }, 1700);
    }
    note(text, buttons) {
      const n = this.noticeEl;
      n.textContent = '';
      n.append(h('p', { text }));
      (buttons || []).forEach((b) => n.append(b));
      n.hidden = false;
    }
    hideNotice() { this.noticeEl.hidden = true; }
    moveFields(rec) {
      return {
        move_no: this.c.moves, target: rec.target,
        from: this.pos(rec.from), to: this.pos(rec.to),
        d_before: fin(rec.dBefore), d_after: fin(rec.dAfter), cls: rec.cls,
      };
    }
    pos(v) { return v == null ? '' : v; }
    commit(rec) {
      if (rec.kind === 'blocked') {
        this.c.blocked++;
        this.log('blocked', this.moveFields(rec));
        if (this.o.feedback) this.verdict('blocked');
        this.app.touch();
        return;
      }
      this.c.moves++;
      this.app.session.hasMoves = true;
      if (this.firstMove == null) this.firstMove = rec.t_ms != null ? rec.t_ms : Math.round(this.elapsed());
      if (rec.cls && this.c[rec.cls] != null) this.c[rec.cls]++;
      if (rec.consistent === false && !rec.solved) this.c.inconsistent++;
      if (rec.infoBest > 0) { this.c.infoRatioSum += rec.infoExpected / rec.infoBest; this.c.infoRatioN++; }
      const f = this.moveFields(rec);
      if (rec.t_ms != null) f.t_ms = rec.t_ms;
      this.log('move', f);
      if (this.o.feedback) this.verdict(rec.cls, this.verdictExtra ? this.verdictExtra(rec) : '');
      this.updateMeta();
      if (rec.solved) { this.resolve('solved'); return; }
      if (rec.failed) { this.resolve('failed'); return; }
      if (rec.stuck) this.showStuck();
      this.app.touch();
    }
    doUndo() {
      if (this.summary || this.busy) return;
      const r = this.G.undo(this.p, this.run);
      if (!r) return;
      this.c.undo++;
      this.log('undo', { move_no: this.c.moves, target: r.target, from: this.pos(r.from), to: this.pos(r.to), d_before: fin(r.dBefore), d_after: fin(r.dAfter) });
      this.hideNotice();
      this.afterUndo(r);
      this.updateMeta();
      this.app.touch();
    }
    doRestart() {
      if (this.summary || this.busy) return;
      const dB = this.G.dist ? fin(this.G.dist(this.p, this.spec.game === 'outbound' ? this.run.st : this.run.rot)) : '';
      this.G.restart(this.p, this.run);
      this.c.restart++;
      const dA = this.G.dist ? fin(this.G.dist(this.p, this.spec.game === 'outbound' ? this.run.st : this.run.rot)) : '';
      this.log('restart', { move_no: this.c.moves, d_before: dB, d_after: dA });
      this.hideNotice();
      this.refresh(true);
      this.updateMeta();
      this.app.touch();
    }
    doHint() {
      if (this.summary || this.busy) return;
      const hint = this.G.hint(this.p, this.run);
      this.c.hint++;
      this.log('hint', { move_no: this.c.moves, target: hint.target != null ? hint.target : '', detail: JSON.stringify(hint) });
      this.showHint(hint);
      this.app.touch();
    }
    doSkip() {
      if (this.summary || this.busy) return;
      if (!this.skipArmed) {
        this.skipArmed = true;
        this.skipBtn.textContent = 'Tap again to skip';
        this.later(() => { this.skipArmed = false; if (this.skipBtn) this.skipBtn.textContent = 'Skip'; }, 2500);
        return;
      }
      this.resolve('skipped');
    }
    showStuck() {
      const btns = [];
      if (this.o.undo) {
        btns.push(h('button', { class: 'btn', type: 'button', onclick: () => this.doUndo() }, 'Undo'));
        btns.push(h('button', { class: 'btn', type: 'button', onclick: () => this.doRestart() }, 'Restart'));
        this.note('No car can move, and cars are still in the lot.', btns);
      } else {
        this.note('No car can move, and cars are still in the lot.');
        this.later(() => this.resolve('failed'), 1400);
      }
    }
    resolve(outcome) {
      if (this.summary) return;
      clearInterval(this.tick);
      if (this.hiddenAt != null) { this.hiddenMs += now() - this.hiddenAt; this.hiddenAt = null; }
      const dur = Math.round(this.elapsed());
      this.frozen = dur;
      const solved = outcome === 'solved';
      const sm = {
        outcome,
        success: solved && this.c.moves <= this.par,
        duration_ms: dur,
        first_move_ms: this.firstMove,
        hidden_ms: Math.round(this.hiddenMs),
        moves: this.c.moves,
        reference: this.p.reference,
        par: this.par,
        efficiency: this.c.moves ? r4(this.p.reference / this.c.moves) : '',
      };
      this.summary = sm;
      this.hideNotice();
      const res = this.app.onPuzzleEnd(this, sm);
      sm.level_next = res.level_next;
      sm.level_change = res.change && res.change.changed ? res.change : null;
      if (this.onResolved) this.onResolved(outcome);
      this.showResult(sm);
    }
    showResult(sm) {
      if (this.resultEl) this.resultEl.remove();
      const panel = h('section', { class: 'result', 'aria-label': 'Result' });
      panel.append(h('h3', { text: (HEADLINE[this.spec.game] || {})[sm.outcome] || 'Done' }));
      if (this.o.counter) {
        const stats = h('div', { class: 'stats' });
        stats.append(h('span', null, 'Time ', h('b', { text: clock(sm.duration_ms) })));
        const unit = this.spec.game === 'tumbler' ? 'Tries ' : this.spec.game === 'conduit' ? 'Turns ' : 'Moves ';
        stats.append(h('span', null, unit, h('b', { text: String(sm.moves) }), ' · par ' + sm.par));
        const refLabel = this.spec.game === 'tumbler' ? 'Solver needed ' : 'Fewest possible ';
        stats.append(h('span', null, refLabel, h('b', { text: String(sm.reference) })));
        if (this.spec.game === 'outbound' && this.c.dead_end) stats.append(h('span', null, 'Dead ends ', h('b', { text: String(this.c.dead_end) })));
        panel.append(stats);
      }
      const row = h('div', { class: 'row' });
      const last = this.app.isLast(this.spec);
      const next = h('button', { class: 'btn primary', type: 'button', onclick: () => this.app.next() }, last ? 'Finish' : 'Next puzzle');
      row.append(next);
      if (this.o.counter) {
        if (sm.outcome === 'solved') row.append(h('span', { class: 'pill ' + (sm.success ? 'ok' : 'warn'), text: sm.success ? 'At or under par' : 'Over par' }));
        if (sm.level_change) row.append(h('span', { class: 'pill ' + (sm.level_change.to > sm.level_change.from ? 'ok' : 'warn'), text: 'Next ' + this.G.name + ': L' + sm.level_change.to }));
      }
      if (!last) row.append(h('span', { class: 'swipe', text: 'or swipe up' }));
      panel.append(row);
      this.el.append(panel);
      this.el.classList.add('resolved');
      this.resultEl = panel;
      this.later(() => { try { next.focus({ preventScroll: true }); } catch (e) { /* focus is optional */ } }, 60);
    }
    snapshot() {
      return {
        spec: this.spec,
        run: this.G.serialize(this.run),
        c: this.c,
        elapsed: Math.round(this.elapsed()),
        firstMove: this.firstMove,
        hiddenMs: Math.round(this.hiddenMs + (this.hiddenAt != null ? now() - this.hiddenAt : 0)),
        startedAt: this.startedAt,
        summary: this.summary,
        extra: this.extraSnapshot ? this.extraSnapshot() : null,

    }
    onKey() { return false; }
  }

  // ------------------------------------------------------------ Outbound
  class OutboundCard extends Card {
    pos(v) { return v === E.EXIT ? 'exit' : v == null ? '' : v; }
    buildBoard() {
      const p = this.p, U = 10, pad = 3;
      const W = p.w * U, H = p.h * U;
      const svgEl = s('svg', { class: 'board', viewBox: (-pad) + ' ' + (-pad) + ' ' + (W + pad * 2) + ' ' + (H + pad * 2), role: 'group', 'aria-label': 'Parking lot, ' + p.w + ' by ' + p.h + ', ' + p.cars.length + ' cars' });
      svgEl.append(s('rect', { class: 'lot-ground', x: -pad, y: -pad, width: W + pad * 2, height: H + pad * 2, rx: 4 }));
      for (let x = 1; x < p.w; x++) svgEl.append(s('line', { class: 'lot-line', x1: x * U, y1: 0.8, x2: x * U, y2: H - 0.8 }));
      for (let y = 1; y < p.h; y++) svgEl.append(s('line', { class: 'lot-line', x1: 0.8, y1: y * U, x2: W - 0.8, y2: y * U }));
      svgEl.append(s('rect', { class: 'lot-curb', x: 0, y: 0, width: W, height: H, rx: 1.5 }));
      this.carEls = p.cars.map((c, i) => { const g = this.drawCar(c, i); svgEl.append(g); return g; });
      this.svg = svgEl;
      this.wrap.prepend(svgEl);
    }
    center(c, adv) {
      const d = DIRV[c.dir];
      const rx = c.x + adv * d[0], ry = c.y + adv * d[1];
      const fx = rx + (c.len - 1) * d[0], fy = ry + (c.len - 1) * d[1];
      return [((rx + fx) / 2 + 0.5) * 10, ((ry + fy) / 2 + 0.5) * 10];
    }
    drawCar(c, i) {
      const L = c.len * 10;
      const col = CAR_COLORS[c.color % CAR_COLORS.length];
      const mark = col.dark ? 'rgba(20,20,20,0.75)' : 'rgba(255,255,255,0.92)';
      const g = s('g', { class: 'car', tabindex: '0', role: 'button', 'aria-label': 'Car ' + c.label + (c.len === 3 ? ', truck' : '') + ', facing ' + DIRNAME[c.dir] });
      const body = s('g', { transform: 'rotate(' + ANGLE[c.dir] + ')' });
      const top = -L / 2;
      body.append(s('rect', { class: 'halo', x: -4.8, y: top + 0.2, width: 9.6, height: L - 0.4, rx: 3.1 }));
      body.append(s('rect', { x: -4.1, y: top + 0.9, width: 8.2, height: L - 1.8, rx: 2.4, fill: col.fill }));
      body.append(s('rect', { x: -3.4, y: top + 1.05, width: 1.7, height: 0.9, rx: 0.4, fill: '#FFF6CF' }));
      body.append(s('rect', { x: 1.7, y: top + 1.05, width: 1.7, height: 0.9, rx: 0.4, fill: '#FFF6CF' }));
      if (c.len === 3) {
        body.append(s('rect', { x: -3.3, y: top + 2.6, width: 6.6, height: 5.2, rx: 1.2, fill: 'rgba(0,0,0,0.26)' }));
        body.append(s('rect', { x: -3.3, y: top + 2.6, width: 6.6, height: 1.6, rx: 0.8, fill: 'rgba(255,255,255,0.55)' }));
        body.append(s('rect', { x: -3.6, y: top + 9.0, width: 7.2, height: L - 10.4, rx: 1, fill: 'rgba(255,255,255,0.22)' }));
      } else {
        body.append(s('rect', { x: -3.3, y: top + 3.0, width: 6.6, height: L - 6.4, rx: 1.4, fill: 'rgba(0,0,0,0.24)' }));
        body.append(s('rect', { x: -3.3, y: top + 3.0, width: 6.6, height: 1.9, rx: 0.9, fill: 'rgba(255,255,255,0.6)' }));
      }
      const cy = c.len === 3 ? top + 5.6 : top + L / 2 + 0.8;
      body.append(s('path', { d: 'M -1.7 ' + (cy + 0.9) + ' L 0 ' + (cy - 0.8) + ' L 1.7 ' + (cy + 0.9), fill: 'none', stroke: mark, 'stroke-width': 0.95, 'stroke-linecap': 'round', 'stroke-linejoin': 'round' }));
      g.append(body);
      g.addEventListener('click', () => this.tap(i));
      g.addEventListener('keydown', (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); this.tap(i); } });
      return g;
    }
    place(i, instant) {
      const c = this.p.cars[i], g = this.carEls[i], a = this.run.st[i];
      if (a === E.EXIT) {
        g.style.display = 'none';
        return;
      }
      g.style.display = '';
      g.classList.remove('leaving');
      const xy = this.center(c, a);
      if (instant) g.style.transition = 'none';
      g.style.opacity = '1';
      g.style.transform = 'translate(' + xy[0] + 'px,' + xy[1] + 'px)';
      if (instant) { void g.getBoundingClientRect(); g.style.transition = ''; }
    }
    refresh(animated) { this.p.cars.forEach((c, i) => this.place(i, !animated)); }
    tap(i) {
      if (this.summary || this.busy) return;
      const rec = this.G.tap(this.p, this.run, i);
      if (!rec) return;
      if (rec.kind === 'blocked') this.shake(i);
      else this.animateMove(i, rec);
      if (this.o.feedback) this.flash(i, rec.cls);

    animateMove(i, rec) {
      const c = this.p.cars[i], g = this.carEls[i];
      if (rec.exited) {
        const far = Math.max(this.p.w, this.p.h) + c.len + 2;
        const xy = this.center(c, rec.from + far);
        g.classList.add('leaving');
        g.style.transform = 'translate(' + xy[0] + 'px,' + xy[1] + 'px)';
        g.style.opacity = '0';
        this.later(() => { if (this.run.st[i] === E.EXIT) g.style.display = 'none'; }, 460);
      } else {
        this.place(i, false);

    }
    shake(i) {
      const g = this.carEls[i];

    flash(i, cls) {

    afterUndo(r) {

          h('button', { class: 'btn', type: 'button', onclick: () => this.doUndo() }, 'Undo'),
        ] : []);
      }
    }
  }

  // ------------------------------------------------------------- Conduit
  class ConduitCard extends Card {
    buildBoard() {
      const p = this.p, U = 10, pad = 1.5;
      const svgEl = s('svg', { class: 'board', viewBox: (-pad) + ' ' + (-pad) + ' ' + (p.w * U + pad * 2) + ' ' + (p.h * U + pad * 2), role: 'group', 'aria-label': 'Pipe grid, ' + p.w + ' by ' + p.h });
      svgEl.append(s('rect', { class: 'lot-ground', x: -pad, y: -pad, width: p.w * U + pad * 2, height: p.h * U + pad * 2, rx: 3 }));
      this.angle = this.run.rot.map((r) => r * 90);
      this.cells = [];
      this.tiles = [];
      for (let i = 0; i < p.w * p.h; i++) {
        const x = i % p.w, y = (i / p.w) | 0;
        const cx = x * U + U / 2, cy = y * U + U / 2;
        const cell = s('g', { class: 'cell', tabindex: '0', role: 'button', 'aria-label': 'Tile row ' + (y + 1) + ', column ' + (x + 1) + (i === p.src ? ', source' : '') });
        cell.append(s('rect', { class: 'bed', x: x * U + 0.45, y: y * U + 0.45, width: U - 0.9, height: U - 0.9, rx: 1.6 }));
        const tile = s('g', { class: 'tile' });
        tile.style.transformOrigin = cx + 'px ' + cy + 'px';
        const m = p.sol[i];
        let deg = 0;
        for (const side of [1, 2, 4, 8]) {
          if (!(m & side)) continue;
          deg++;
          tile.append(s('line', { class: 'pipe', x1: cx, y1: cy, x2: cx + SIDEV[side][0] * 5, y2: cy + SIDEV[side][1] * 5 }));
        }
        if (i !== p.src) {
          if (deg === 1) tile.append(s('circle', { class: 'cap', cx, cy, r: 2.2 }));
          else if (deg >= 3) tile.append(s('circle', { class: 'hub', cx, cy, r: 1.75 }));
        }
        cell.append(tile);
        if (i === p.src) {
          cell.append(s('rect', { class: 'source-mark', x: cx - 3.1, y: cy - 3.1, width: 6.2, height: 6.2, rx: 1.3 }));
          cell.append(s('path', { class: 'source-drop', d: 'M' + cx + ' ' + (cy - 2.1) + ' C ' + (cx + 1.6) + ' ' + (cy - 0.2) + ', ' + (cx + 1.5) + ' ' + (cy + 1.9) + ', ' + cx + ' ' + (cy + 1.9) + ' C ' + (cx - 1.5) + ' ' + (cy + 1.9) + ', ' + (cx - 1.6) + ' ' + (cy - 0.2) + ', ' + cx + ' ' + (cy - 2.1) + ' Z' }));
        }
        cell.append(s('rect', { class: 'ring', x: x * U + 0.45, y: y * U + 0.45, width: U - 0.9, height: U - 0.9, rx: 1.6 }));
        cell.addEventListener('click', () => this.tap(i));
        cell.addEventListener('keydown', (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); this.tap(i); } });
        svgEl.append(cell);
        this.cells.push(cell);
        this.tiles.push(tile);
      }
      this.svg = svgEl;
      this.wrap.prepend(svgEl);
    }
    setAngle(i, instant) {
      const t = this.tiles[i];
      if (instant) t.style.transition = 'none';
      t.style.transform = 'rotate(' + this.angle[i] + 'deg)';
      if (instant) { void t.getBoundingClientRect(); t.style.transition = ''; }
    }
    wet() {
      const on = this.G.connected(this.p, this.run);
      this.tiles.forEach((t, i) => t.classList.toggle('wet', !!on[i]));
    }
    refresh(animated) {
      this.angle = this.run.rot.map((r, i) => {
        if (!animated || this.angle[i] == null) return r * 90;
        const cur = this.angle[i];
        const base = cur - (((cur % 360) + 360) % 360);
        return base + r * 90;
      });
      this.tiles.forEach((t, i) => this.setAngle(i, !animated));
      this.wet();
      this.svg.classList.toggle('solved', !!(this.summary && this.summary.outcome === 'solved'));
    }
    tap(i) {
      if (this.summary || this.busy) return;
      const rec = this.G.tap(this.p, this.run, i);
      this.angle[i] += 90;
      this.setAngle(i, false);
      this.wet();
      if (this.o.feedback) this.flash(i, rec.cls);
      this.commit(rec);
    }
    flash(i, cls) {
      const k = 'flash-' + cls;
      this.cells[i].classList.add(k);
      this.later(() => this.cells[i].classList.remove(k), 650);
    }
    afterUndo(r) {
      this.angle[r.index] -= 90;
      this.setAngle(r.index, false);
      this.wet();
    }
    showHint(hint) {
      if (hint.kind !== 'target') return;
      const c = this.cells[hint.index];
      c.classList.add('hinted');
      this.later(() => c.classList.remove('hinted'), 2700);
    }
    onResolved(outcome) { if (outcome === 'solved') this.svg.classList.add('solved'); }
  }

  // ------------------------------------------------------------- Tumbler
  function pegGlyph(c) {
    const pg = PEGS[c];
    return s('svg', { viewBox: '0 0 16 16', 'aria-hidden': 'true' }, s('path', { d: pg.glyph, fill: pg.ink }));
  }
  function peg(c, tag, attrs) {
    const el = h(tag || 'span', Object.assign({ class: 'peg' }, attrs || {}));
    if (c == null) { el.classList.add('blank'); return el; }
    el.style.background = PEGS[c].fill;
    el.append(pegGlyph(c));
    return el;
  }
  class TumblerCard extends Card {
    buildBoard() {
      const p = this.p;
      this.draft = this.extra && Array.isArray(this.extra.draft) ? this.extra.draft.slice() : new Array(p.P).fill(null);
      const tb = h('div', { class: 'tb' });
      this.rowsEl = h('div', { class: 'tb-rows', role: 'list', 'aria-label': 'Tries' });
      this.palEl = h('div', { class: 'tb-palette', role: 'group', 'aria-label': 'Colors' });
      for (let c = 0; c < p.C; c++) {
        this.palEl.append(peg(c, 'button', { type: 'button', 'aria-label': 'Add ' + PEGS[c].name + ' (key ' + (c + 1) + ')', onclick: () => this.put(c) }));
      }
      this.clearBtn = h('button', { class: 'btn', type: 'button', onclick: () => this.clearDraft() }, 'Clear');
      this.tryBtn = h('button', { class: 'btn primary', type: 'button', onclick: () => this.submit() }, 'Try this code');
      this.actionsEl = h('div', { class: 'tb-actions' }, this.clearBtn, this.tryBtn);
      tb.append(this.rowsEl, this.palEl, this.actionsEl);
      this.wrap.prepend(tb);
    }
    put(c) {
      if (this.summary || this.busy) return;
      const k = this.draft.indexOf(null);
      if (k < 0) return;
      this.draft[k] = c;
      this.refresh();
    }
    clearSlot(k) {
      if (this.summary || this.busy) return;
      this.draft[k] = null;
      this.refresh();
    }
    clearDraft() {
      if (this.summary || this.busy) return;
      this.draft = new Array(this.p.P).fill(null);
      this.refresh();
    }
    refresh() {
      const p = this.p, tries = this.run.tries;
      this.rowsEl.textContent = '';
      let activeEl = null;
      for (let r = 0; r < p.max; r++) {
        const row = h('div', { class: 'tb-row', role: 'listitem' });
        row.append(h('span', { class: 'n', text: String(r + 1) }));
        const pins = h('div', { class: 'tb-pins' });
        if (r < tries.length) {
          const t = tries[r];
          t.digits.forEach((d) => pins.append(peg(d)));
          row.append(pins, this.feedbackEl(t.exact, t.partial));
          row.setAttribute('aria-label', 'Try ' + (r + 1) + ': ' + t.digits.map((d) => PEGS[d].name).join(', ') + '. ' + t.exact + ' right spot, ' + t.partial + ' wrong spot.');
        } else if (r === tries.length && !this.summary) {
          row.classList.add('active');
          this.draft.forEach((d, k) => {
            const b = peg(d, 'button', { type: 'button', 'aria-label': d == null ? 'Empty slot ' + (k + 1) : 'Remove ' + PEGS[d].name + ' from slot ' + (k + 1), onclick: () => this.clearSlot(k) });
            pins.append(b);
          });
          row.append(pins, h('span', { class: 'tb-fbtext', text: '' }));
          activeEl = row;
        } else {
          for (let k = 0; k < p.P; k++) pins.append(h('span', { class: 'peg empty' }));
          row.append(pins, h('span'));
        }
        this.rowsEl.append(row);
      }
      if (this.summary && this.summary.outcome !== 'solved') {
        const row = h('div', { class: 'tb-row active', 'aria-label': 'The code' });
        const pins = h('div', { class: 'tb-pins' });
        p.secretDigits.forEach((d) => pins.append(peg(d)));
        row.append(h('span', { class: 'n', text: '=' }), pins, h('span', { class: 'tb-fbtext', text: 'code' }));
        this.rowsEl.append(row);
        activeEl = row;
      }
      const full = this.draft.every((d) => d != null);
      this.tryBtn.disabled = !full || !!this.summary || this.busy;
      this.clearBtn.disabled = this.draft.every((d) => d == null) || !!this.summary;
      this.palEl.querySelectorAll('button').forEach((b) => { b.disabled = !!this.summary || full; });
      const target = activeEl || this.rowsEl.lastChild;
      if (target) this.later(() => { try { target.scrollIntoView({ block: 'nearest' }); } catch (e) { /* optional */ } }, 0);
    }
    feedbackEl(exact, partial) {
      const box = h('div', { class: 'tb-fb', 'aria-hidden': 'true' });
      for (let k = 0; k < this.p.P; k++) box.append(h('i', { class: k < exact ? 'x' : k < exact + partial ? 'p' : '' }));
      const wrap = h('span', { style: 'display:flex;align-items:center;gap:8px' }, h('span', { class: 'tb-fbtext', text: '●' + exact + ' ○' + partial }), box);
      return wrap;
    }
    submit() {
      if (this.summary || this.busy) return;
      if (this.draft.some((d) => d == null)) return;
      const t = Math.round(this.elapsed());
      const rec = this.G.guess(this.p, this.run, this.draft.slice());
      rec.t_ms = t;
      this.draft = new Array(this.p.P).fill(null);
      this.busy = true;
      this.refresh();
      // feedback is on screen now; the slower information score follows
      requestAnimationFrame(() => this.later(() => {
        this.G.annotate(this.p, rec);
        this.busy = false;
        this.commit(rec);
        if (!this.summary) this.refresh();
      }, 0));
    }
    moveFields(rec) {
      return {
        move_no: this.c.moves, target: rec.target, cls: rec.cls,
        exact: rec.exact, partial: rec.partial,
        cands_before: rec.candsBefore, cands_after: rec.candsAfter,
        consistent: rec.consistent ? 1 : 0,
        info_expected: r4(rec.infoExpected), info_best: r4(rec.infoBest), info_actual: r4(rec.infoActual),
        best_try: rec.bestTry || '',
      };
    }
    verdictExtra(rec) {
      if (rec.solved) return '';
      return rec.consistent ? '' : ' · it did not fit earlier clues';
    }
    showHint(hint) {
      const n = hint.count;
      const v = this.verdictEl;
      v.className = 'verdict show info';
      v.textContent = n === 1 ? 'Only one code fits your clues' : n + ' codes still fit your clues';
      clearTimeout(this.verdictTimer);
      this.verdictTimer = this.later(() => { v.className = 'verdict'; }, 2600);
    }
    onResolved() { this.refresh(); }
    extraSnapshot() { return { draft: this.draft.slice() }; }
    onKey(e) {
      if (this.summary) return false;
      const n = parseInt(e.key, 10);
      if (n >= 1 && n <= this.p.C) { this.put(n - 1); return true; }
      if (e.key === 'Backspace') {
        let k = -1;
        this.draft.forEach((d, i) => { if (d != null) k = i; });
        if (k >= 0) this.clearSlot(k);
        return true;
      }
      if (e.key === 'Enter') { this.submit(); return true; }
      return false;
    }
  }

  function makeCard(app, spec, puzzle, snap) {
    if (spec.game === 'outbound') return new OutboundCard(app, spec, puzzle, snap);
    if (spec.game === 'conduit') return new ConduitCard(app, spec, puzzle, snap);
    return new TumblerCard(app, spec, puzzle, snap);
  }

  // ============================================================ export
  const EVENT_COLS = ['session_id', 'participant', 'condition', 'session_kind', 'session_seed', 'app_version', 'event_index', 'event', 'wall_time', 't_session_ms', 'seq', 'block', 'puzzle_id', 'puzzle_seed', 'game', 'level', 'adaptive', 't_ms', 'move_no', 'target', 'from', 'to', 'd_before', 'd_after', 'cls', 'exact', 'partial', 'cands_before', 'cands_after', 'consistent', 'info_expected', 'info_best', 'info_actual', 'best_try', 'detail'];
  const PUZZLE_COLS = ['session_id', 'participant', 'condition', 'session_kind', 'session_seed', 'app_version', 'seq', 'block', 'in_block', 'puzzle_id', 'puzzle_seed', 'game', 'level', 'adaptive', 'params', 'outcome', 'success', 'started_at', 'ended_at', 'duration_ms', 'first_move_ms', 'hidden_ms', 'moves', 'reference', 'par', 'efficiency', 'n_optimal', 'n_wasted', 'n_dead_end', 'n_in_dead_end', 'n_blocked', 'n_undo', 'n_restart', 'n_hint', 'n_suboptimal', 'n_zero_info', 'n_inconsistent', 'mean_info_ratio', 'level_next', 'features'];

  function sessionFields(S) {
    return { session_id: S.id, participant: S.participant, condition: S.condition, session_kind: S.kind, session_seed: S.seed, app_version: S.app_version };
  }
  function csv(cols, rows) {
    const esc = (v) => {
      if (v == null) return '';
      const t = typeof v === 'object' ? JSON.stringify(v) : String(v);
      return /[",\r\n]/.test(t) ? '"' + t.replace(/"/g, '""') + '"' : t;
    };
    return [cols.join(',')].concat(rows.map((r) => cols.map((c) => esc(r[c])).join(','))).join('\r\n') + '\r\n';
  }
  function eventsCSV(list) {
    const rows = [];
    for (const S of list) {
      const base = sessionFields(S);
      for (const e of S.events) rows.push(Object.assign({}, base, e, { event_index: e.i }));
    }
    return csv(EVENT_COLS, rows);
  }
  function puzzlesCSV(list) {
    const rows = [];
    for (const S of list) {
      const base = sessionFields(S);
      for (const p of S.puzzles) rows.push(Object.assign({}, base, p));
    }
    return csv(PUZZLE_COLS, rows);
  }
  function exportJSON(list) {
    return JSON.stringify({
      app: 'Puzzle Reel', app_version: APP_VERSION, engine_version: E.version, exported_at: new Date().toISOString(),

  function codebookMarkdown() {
