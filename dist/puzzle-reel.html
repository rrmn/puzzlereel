<body>
<div class="app" id="app" data-scene="outbound">
  <main class="stage" id="stage" aria-live="polite"></main>
  <header class="hud" id="hud">
    <div id="hud-left"></div>
    <div class="hud-mid" id="hud-mid"></div>
    <div class="hud-right" id="hud-right"></div>
  </header>
</div>
<div id="layer"></div>
<div class="toast" id="toast" role="status" hidden></div>

<script>/* Puzzle Reel engines: pure, deterministic, DOM-free.
 * Every generator takes (level, seed) and returns the same puzzle for the same pair.
 * Every game exposes the same run interface so one harness can log and score moves. */
function PuzzleEnginesFactory(root) {
  'use strict';

  // ---------- seeded randomness ----------
  function fnv1a(str) {
    let h = 0x811c9dc5;
    for (let i = 0; i < str.length; i++) {
      h ^= str.charCodeAt(i);
      h = Math.imul(h, 0x01000193);
    }
    return h >>> 0;
  }
  function mulberry32(a) {
    a = a >>> 0;
    return function () {
      a = (a + 0x6D2B79F5) >>> 0;
      let t = a;
      t = Math.imul(t ^ (t >>> 15), t | 1);
      t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  function makeRng(seed) {
    const r = mulberry32(seed);
    r.int = (n) => Math.floor(r() * n);
    r.shuffle = (arr) => {
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(r() * (i + 1));
        const t = arr[i]; arr[i] = arr[j]; arr[j] = t;
      }
      return arr;
    };
    return r;
  }
  function puzzleSeed(sessionSeed, block, game, level, j) {
    return fnv1a(sessionSeed + '|' + block + '|' + game + '|' + level + '|' + j);
  }

  // =====================================================================
  // OUTBOUND: cars only drive forward. A tapped car leaves the lot if its
  // lane is clear, otherwise it slides until it bumps into something.
  // Forward-only movement makes the state graph acyclic, so we can label
  // every reachable state with its distance to the goal.
  // =====================================================================
  const DIR = { N: [0, -1], E: [1, 0], S: [0, 1], W: [-1, 0] };
  const DIRS = ['N', 'E', 'S', 'W'];
  const EXIT = -1;

  function obOccupancy(p, st) {
    const occ = new Int16Array(p.w * p.h).fill(-1);
    for (let i = 0; i < p.cars.length; i++) {
      const a = st[i];
      if (a === EXIT) continue;
      const c = p.cars[i];
      const d = DIR[c.dir];
      for (let k = 0; k < c.len; k++) {
        occ[(c.y + (k + a) * d[1]) * p.w + (c.x + (k + a) * d[0])] = i;
      }
    }
    return occ;
  }
  // New advance for car i: EXIT if it leaves, unchanged if it cannot move.
  function obSlide(p, st, occ, i) {
    const c = p.cars[i];
    const a = st[i];
    const d = DIR[c.dir];
    let fx = c.x + (c.len - 1 + a) * d[0];
    let fy = c.y + (c.len - 1 + a) * d[1];
    let steps = 0;
    for (;;) {
      const nx = fx + d[0], ny = fy + d[1];
      if (nx < 0 || ny < 0 || nx >= p.w || ny >= p.h) return EXIT;
      if (occ[ny * p.w + nx] !== -1) return a + steps;
      fx = nx; fy = ny; steps++;
    }
  }
  function obKey(st, B) {
    let k = 0;
    for (let i = st.length - 1; i >= 0; i--) k = k * B + (st[i] === EXIT ? B - 1 : st[i]);
    return k;
  }
  function obMovable(p, st) {
    const occ = obOccupancy(p, st);
    const out = [];
    for (let i = 0; i < p.cars.length; i++) {
      if (st[i] === EXIT) continue;
      if (obSlide(p, st, occ, i) !== st[i]) out.push(i);
    }
    return out;
  }

  // Full analysis of the reachable state graph.
  // d: fewest taps to clear the lot (Infinity = dead end)
  // p: chance a player tapping movable cars at random clears the lot
  function obAnalyze(p) {
    const n = p.cars.length;
    const B = Math.max(p.w, p.h) + 2;
    const memo = new Map();
    let deadStates = 0;
    function solve(st) {
      const key = obKey(st, B);
      const hit = memo.get(key);
      if (hit) return hit;
      let left = 0;
      for (let i = 0; i < n; i++) if (st[i] !== EXIT) left++;
      let res;
      if (left === 0) {
        res = { d: 0, p: 1, m: 0, s: 0 };
      } else {
        const occ = obOccupancy(p, st);
        let best = Infinity, ps = 0, m = 0, sl = Infinity;
        for (let i = 0; i < n; i++) {
          if (st[i] === EXIT) continue;
          const na = obSlide(p, st, occ, i);
          if (na === st[i]) continue;
          m++;
          const ns = st.slice();
          ns[i] = na;
          const r = solve(ns);
          if (r.d + 1 < best) best = r.d + 1;
          const rs = r.s + (na === EXIT ? 0 : 1);
          if (rs < sl) sl = rs;
          ps += r.p;
        }
        res = { d: best, p: m ? ps / m : 0, m, s: sl };
        if (best === Infinity) deadStates++;
      }
      memo.set(key, res);
      return res;
    }
    const start = new Array(n).fill(0);
    const r0 = solve(start);
    // first-move profile
    const occ = obOccupancy(p, start);
    let firstMoves = 0, safeFirst = 0, optimalFirst = 0;
    for (let i = 0; i < n; i++) {
      const na = obSlide(p, start, occ, i);
      if (na === 0) continue;
      firstMoves++;
      const ns = start.slice(); ns[i] = na;
      const r = memo.get(obKey(ns, B));
      if (r.d !== Infinity) safeFirst++;
      if (r.d === r0.d - 1) optimalFirst++;
    }
    return {
      memo, B,
      optimal: r0.d,
      pRandom: r0.p,
      minSlides: r0.s,     // 0: tapping only cars with a clear way out always works
      states: memo.size,
      deadStates,
      firstMoves, safeFirst, optimalFirst,
    };
  }

  function dirOf(v) { return v[0] === 1 ? 'E' : v[0] === -1 ? 'W' : v[1] === 1 ? 'S' : 'N'; }

  // Plants a four-car trap. A sits in a lane that crosses V's lane. If A is
  // driven too early it slides onto that crossing, stops against B, and the
  // cycle A <- B <- Z <- V <- A can no longer be broken. Cars are added in an
  // order that keeps the lot solvable (V, then Z, then B, then A).
  function obPlantTrap(L, rng, occ, cars) {
    const w = L.w, h = L.h;
    const inb = (c) => c[0] >= 0 && c[1] >= 0 && c[0] < w && c[1] < h;
    const isFree = (c) => inb(c) && occ[c[1] * w + c[0]] === -1;
    const add = (a, v, k) => [a[0] + v[0] * k, a[1] + v[1] * k];
    const laneOf = (front, d) => {
      const out = [];
      let c = add(front, d, 1);
      while (inb(c)) { out.push(c); c = add(c, d, 1); }
      return out;
    };
    const clearLane = (front, d, extra) => laneOf(front, d).every((c) => isFree(c) && !(extra && extra.some((e) => e[0] === c[0] && e[1] === c[1])));
    const carCells = (rear, d, len) => { const out = []; for (let k = 0; k < len; k++) out.push(add(rear, d, k)); return out; };
    const len = () => (rng() < L.truck ? 3 : 2);
    for (let attempt = 0; attempt < 80; attempt++) {
      // A
      const d = DIR[DIRS[rng.int(4)]];
      const la = len();
      const aRear = [rng.int(w), rng.int(h)];
      const aCells = carCells(aRear, d, la);
      if (!aCells.every(isFree)) continue;
      const aFront = aCells[la - 1];
      if (!clearLane(aFront, d)) continue;
      const lane = laneOf(aFront, d);
      if (lane.length < 3) continue;
      // B: perpendicular, covering lane[k]; facing n
      const k = 1 + rng.int(lane.length - 1);
      const n = rng() < 0.5 ? [-d[1], d[0]] : [d[1], -d[0]];
      const lb = 2;
      const off = rng.int(lb);
      const bRear = add(lane[k], n, -off);
      const bCells = carCells(bRear, n, lb);
      if (!bCells.every(isFree) || bCells.some((c) => aCells.some((e) => e[0] === c[0] && e[1] === c[1]))) continue;
      const bFront = bCells[lb - 1];
      const bLane = laneOf(bFront, n);
      if (bLane.length < 2) continue;
      if (!clearLane(bFront, n, aCells)) continue;
      // X: a cell A covers only after sliding up to B
      const lo = Math.max(0, k - la);
      const xi = lo + rng.int(k - lo);
      const X = lane[xi];
      // Z: in B's lane, parallel to A, facing back toward X's line
      const t = rng.int(Math.min(2, bLane.length - 1));
      const Q = bLane[t];
      const lz = 2;
      const zDir = [-d[0], -d[1]];
      const zCells = carCells(add(Q, zDir, -(lz - 1)), zDir, lz); // rear first, front = Q
      const taken = aCells.concat(bCells);
      if (!zCells.every((c) => isFree(c) && !taken.some((e) => e[0] === c[0] && e[1] === c[1]))) continue;
      if (!clearLane(Q, zDir, taken)) continue;
      // P: where Z's lane meets X's line
      const P = add(Q, zDir, k - xi);
      // V: on X's line beyond A's lane, covering P, facing A's lane
      const vDir = [-n[0], -n[1]];
      const lv = 2;
      const q = rng.int(lv);
      const vFront = add(P, vDir, q);
      const vCells = carCells(add(vFront, vDir, -(lv - 1)), vDir, lv);
      // front must stay strictly on Z's side of A's lane
      const sideDist = (c) => (c[0] - X[0]) * n[0] + (c[1] - X[1]) * n[1];
      if (sideDist(vFront) < 1) continue;
      const taken2 = taken.concat(zCells);
      if (!vCells.every((c) => isFree(c) && !taken2.some((e) => e[0] === c[0] && e[1] === c[1]))) continue;
      if (!clearLane(vFront, vDir, taken2)) continue;
      // commit in solvable order: A, B, Z, V (V leaves first)
      const commit = (rear, dv, l) => {
        const id = cars.length;
        cars.push({ x: rear[0], y: rear[1], dir: dirOf(dv), len: l });
        for (const c of carCells(rear, dv, l)) occ[c[1] * w + c[0]] = id;
      };
      commit(aRear, d, la);
      commit(bRear, n, lb);
      commit(zCells[0], zDir, lz);
      commit(vCells[0], vDir, lv);
      return true;
    }
    return false;
  }

  // Plants a pinwheel: four cars that each block the next (X <- Y <- Z <- W <- X),
  // so none of them can leave until one slides part of the way. In the base
  // layout X (east) and Z (west) have room to slide past the car they block;
  // W and Y do not. g: columns between X's front and Y; q: rows between W and X.
  // Any of 8 rotations and mirror images, at a random place where it fits.
  function obPlantLoop(L, rng, occ, cars) {
    const w = L.w, h = L.h;
    for (let attempt = 0; attempt < 400; attempt++) {
      const g = 3 + (rng() < 0.3 ? 1 : 0), q = 1 + (rng() < 0.35 ? 1 : 0);
      // cars as [rear..front] cells and a direction, in base coordinates
      const base = [
        { cells: [[0, 1 + q], [1, 1 + q]], d: [1, 0] },              // X, east
        { cells: [[g + 1, 2 + q], [g + 1, 1 + q]], d: [0, -1] },     // Y, north
        { cells: [[g + 2, 1], [g + 1, 1]], d: [-1, 0] },             // Z, west
        { cells: [[1, 0], [1, 1]], d: [0, 1] },                      // W, south
      ];
      const sym = rng.int(8);
      const tf = (v) => { let x = v[0], y = v[1]; for (let k = 0; k < (sym & 3); k++) { const t = x; x = -y; y = t; } return sym & 4 ? [-x, y] : [x, y]; };
      let cs = base.map((c) => ({ cells: c.cells.map(tf), d: tf(c.d) }));
      let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
      for (const c of cs) for (const [x, y] of c.cells) { minX = Math.min(minX, x); minY = Math.min(minY, y); maxX = Math.max(maxX, x); maxY = Math.max(maxY, y); }
      if (maxX - minX >= w || maxY - minY >= h) continue;
      const ox = rng.int(w - (maxX - minX)) - minX, oy = rng.int(h - (maxY - minY)) - minY;
      cs = cs.map((c) => ({ cells: c.cells.map(([x, y]) => [x + ox, y + oy]), d: c.d }));
      const mine = new Set();
      for (const c of cs) for (const [x, y] of c.cells) mine.add(y * w + x);
      let ok = true;
      for (const id of mine) if (occ[id] !== -1) ok = false;
      // every lane, from each front to the edge, is clear of earlier cars
      for (const c of cs) {
        if (!ok) break;
        let [x, y] = c.cells[c.cells.length - 1];
        for (x += c.d[0], y += c.d[1]; x >= 0 && y >= 0 && x < w && y < h; x += c.d[0], y += c.d[1]) {
          if (occ[y * w + x] !== -1) { ok = false; break; }
        }
      }
      if (!ok) continue;
      for (const c of cs) {
        const id = cars.length;
        const [rx, ry] = c.cells[0];
        cars.push({ x: rx, y: ry, dir: dirOf(c.d), len: c.cells.length });
        for (const [x, y] of c.cells) occ[y * w + x] = id;
      }
      return true;
    }
    return false;
  }

  // Lots that need planning: traps first (cleared last), then pinwheels, then
  // ordinary cars with a clear way out (cleared first). Every pinwheel needs one
  // slide, so the lot cannot be cleared by tapping only cars with a clear way out.
  function obBuild(L, rng) {
    const w = L.w, h = L.h;
    const occ = new Int16Array(w * h).fill(-1);
    const cars = [];
    let planted = 0;
    for (let g = 0; g < (L.traps || 0); g++) {
      if (cars.length + 4 > L.cars) break;
      if (obPlantTrap(L, rng, occ, cars)) planted++;
    }
    if (L.traps && planted < 1) return null;
    for (let g = 0; g < (L.loops || 0); g++) if (!obPlantLoop(L, rng, occ, cars)) return null;
    let tries = 0;
    while (cars.length < L.cars && tries < 900) {
      tries++;
      const len = rng() < L.truck ? 3 : 2;
      const dir = DIRS[rng.int(4)];
      const d = DIR[dir];
      const x = rng.int(w), y = rng.int(h);
      const fx = x + (len - 1) * d[0], fy = y + (len - 1) * d[1];
      if (fx < 0 || fy < 0 || fx >= w || fy >= h) continue;
      let ok = true;
      for (let k = 0; k < len && ok; k++) if (occ[(y + k * d[1]) * w + (x + k * d[0])] !== -1) ok = false;
      for (let lx = fx + d[0], ly = fy + d[1]; ok && lx >= 0 && ly >= 0 && lx < w && ly < h; lx += d[0], ly += d[1]) if (occ[ly * w + lx] !== -1) ok = false;
      if (!ok) continue;
      const id = cars.length;
      cars.push({ x, y, dir, len });
      for (let k = 0; k < len; k++) occ[(y + k * d[1]) * w + (x + k * d[0])] = id;
    }
    return cars.length === L.cars ? cars : null;
  }

  // Constructive placement: each new car must have a clear lane to the edge
  // past the cars already placed, so clearing them in reverse order always works.
  function obPlace(L, rng) {
    const w = L.w, h = L.h;
    const occ = new Int16Array(w * h).fill(-1);
    const cars = [];
    let planted = 0;
    for (let g = 0; g < (L.traps || 0); g++) {
      if (cars.length + 4 > L.cars) break;
      if (obPlantTrap(L, rng, occ, cars)) planted++;
    }
    if (L.traps && planted < 1) return null;
    let tries = 0;
    while (cars.length < L.cars && tries < 600) {
      tries++;
      const len = rng() < L.truck ? 3 : 2;
      const dir = DIRS[rng.int(4)];
      const d = DIR[dir];
      const x = rng.int(w), y = rng.int(h);
      const fx = x + (len - 1) * d[0], fy = y + (len - 1) * d[1];
      if (fx < 0 || fy < 0 || fx >= w || fy >= h) continue;
      let ok = true;
      for (let k = 0; k < len && ok; k++) if (occ[(y + k * d[1]) * w + (x + k * d[0])] !== -1) ok = false;
      if (!ok) continue;
      let lx = fx + d[0], ly = fy + d[1];
      while (ok && lx >= 0 && ly >= 0 && lx < w && ly < h) {
        if (occ[ly * w + lx] !== -1) ok = false;
        lx += d[0]; ly += d[1];
      }
      if (!ok) continue;
      const id = cars.length;
      cars.push({ x, y, dir, len });
      for (let k = 0; k < len; k++) occ[(y + k * d[1]) * w + (x + k * d[0])] = id;
    }
    return cars.length === L.cars ? cars : null;
  }

  const Outbound = {
    id: 'outbound',
    name: 'Outbound',
    noun: 'car',
    rule: 'Tap a car to drive it forward. It leaves the lot if the way is clear, or stops when it bumps into something.',
    goal: 'Clear the lot.',
    // loops: pinwheels, each needing one slide part of the way (so tapping only
    // cars with a clear way out stops working); traps: tempting dead ends;
    // band: target range for the chance that random tapping clears the lot
    levels: {
      1: { w: 5, h: 5, cars: 5, truck: 0, loops: 0, traps: 0, band: [0.99, 1], attempts: 40 },
      2: { w: 6, h: 6, cars: 7, truck: 0.1, loops: 0, traps: 0, band: [0.99, 1], attempts: 40 },
      3: { w: 6, h: 6, cars: 8, truck: 0.1, loops: 1, traps: 0, band: [0, 1], attempts: 40 },
      4: { w: 7, h: 7, cars: 10, truck: 0.15, loops: 1, traps: 1, band: [0.1, 0.55], attempts: 200 },
      5: { w: 7, h: 7, cars: 11, truck: 0.15, loops: 2, traps: 0, band: [0, 0.3], attempts: 200 },
    },
    describe(p) { return p.w + '×' + p.h + ' lot, ' + p.cars.length + ' cars'; },
    generate(level, seed) {
      const L = this.levels[level];
      const rng = makeRng(seed);
      let best = null, bestGap = Infinity;
      for (let attempt = 0; attempt < L.attempts; attempt++) {
        const placed = L.loops ? obBuild(L, rng) : obPlace(L, rng);
        if (!placed) continue;
        rng.shuffle(placed); // car ids must not reveal the solution order
        const p = { w: L.w, h: L.h, cars: placed };
        const an = obAnalyze(p);
        if (an.optimal === Infinity) continue;
        const lo = L.band[0], hi = L.band[1];
        const gap = an.pRandom < lo ? lo - an.pRandom : an.pRandom > hi ? an.pRandom - hi : 0;
        if (gap < bestGap) { best = { p, an }; bestGap = gap; }
        if (gap === 0) break;
      }
      if (!best) {
        // extremely rare: fall back to a lot without planted traps
        const fallback = Object.assign({}, L, { traps: 0, loops: Math.min(1, L.loops || 0) });
        for (let attempt = 0; !best && attempt < 200; attempt++) {
          const placed = fallback.loops ? obBuild(fallback, rng) : obPlace(fallback, rng);
          if (!placed) continue;
          rng.shuffle(placed);
          const p = { w: L.w, h: L.h, cars: placed };
          const an = obAnalyze(p);
          if (an.optimal !== Infinity) best = { p, an };
        }
        bestGap = Infinity;
      }
      const cars = best.p.cars.map((c, i) => ({
        id: i, label: 'c' + (i + 1), x: c.x, y: c.y, dir: c.dir, len: c.len,
        color: (i * 7 + rng.int(3)) % 10,
      }));
      const an = best.an;
      return {
        game: 'outbound', level, seed,
        w: L.w, h: L.h, cars,
        an,
        reference: an.optimal,
        features: {
          cars: cars.length,
          trucks: cars.filter((c) => c.len === 3).length,
          optimal_moves: an.optimal,
          slides_needed: an.minSlides,
          p_random_solve: round(an.pRandom, 4),
          reachable_states: an.states,
          dead_end_states: an.deadStates,
          first_moves: an.firstMoves,
          safe_first_moves: an.safeFirst,
          in_band: bestGap === 0,
        },
      };
    },
    newRun(p) { return { st: new Array(p.cars.length).fill(0), hist: [] }; },
    dist(p, st) {
      const r = p.an.memo.get(obKey(st, p.an.B));
      return r ? r.d : Infinity;
    },
    remaining(p, run) { return run.st.filter((a) => a !== EXIT).length; },
    movable(p, run) { return obMovable(p, run.st); },
    // Tap car i. Returns a scored action record.
    tap(p, run, i) {
      if (run.st[i] === EXIT) return null;
      const occ = obOccupancy(p, run.st);
      const from = run.st[i];
      const to = obSlide(p, run.st, occ, i);
      const dB = this.dist(p, run.st);
      if (to === from) {
        return { kind: 'blocked', target: p.cars[i].label, index: i, from, to, dBefore: dB, dAfter: dB, cls: 'blocked' };
      }
      run.hist.push([i, from]);
      run.st[i] = to;
      const dA = this.dist(p, run.st);
      let cls;
      if (dB === Infinity) cls = 'in_dead_end';
      else if (dA === Infinity) cls = 'dead_end';
      else if (dA === dB - 1) cls = 'optimal';
      else cls = 'wasted';
      const solved = run.st.every((a) => a === EXIT);
      const stuck = !solved && obMovable(p, run.st).length === 0;
      return { kind: 'move', target: p.cars[i].label, index: i, from, to, exited: to === EXIT, dBefore: dB, dAfter: dA, cls, solved, stuck };
    },
    undo(p, run) {
      const h = run.hist.pop();
      if (!h) return null;
      const i = h[0], back = h[1];
      const was = run.st[i];
      const dB = this.dist(p, run.st);
      run.st[i] = back;
      return { target: p.cars[i].label, index: i, from: was, to: back, dBefore: dB, dAfter: this.dist(p, run.st) };
    },
    restart(p, run) { run.st.fill(0); run.hist = []; },
    hint(p, run) {
      const dB = this.dist(p, run.st);
      if (dB === Infinity) return { kind: 'dead_end' };
      const occ = obOccupancy(p, run.st);
      for (let i = 0; i < p.cars.length; i++) {
        if (run.st[i] === EXIT) continue;
        const na = obSlide(p, run.st, occ, i);
        if (na === run.st[i]) continue;
        const ns = run.st.slice(); ns[i] = na;
        if (this.dist(p, ns) === dB - 1) return { kind: 'target', index: i, target: p.cars[i].label };
      }
      return { kind: 'none' };
    },
    progress(p, run) { return { done: p.cars.length - this.remaining(p, run), total: p.cars.length }; },
    // the car standing in front of car i, or -1 when its lane is clear
    blocker(p, run, i) {
      if (run.st[i] === EXIT) return -1;
      const occ = obOccupancy(p, run.st);
      const c = p.cars[i], a = run.st[i], d = DIR[c.dir];
      let x = c.x + (c.len - 1 + a) * d[0], y = c.y + (c.len - 1 + a) * d[1];
      for (;;) {
        x += d[0]; y += d[1];
        if (x < 0 || y < 0 || x >= p.w || y >= p.h) return -1;
        const o = occ[y * p.w + x];
        if (o !== -1) return o;
      }
    },
    // cars that can never leave from the current state (empty unless in a dead end)
    stuckCars(p, run) {
      const n = p.cars.length, B = p.an.B;
      const canLeave = new Array(n).fill(false);
      const seen = new Set([obKey(run.st, B)]);
      const stack = [run.st.slice()];
      while (stack.length && seen.size < 20000) {
        const st = stack.pop();
        const occ = obOccupancy(p, st);
        for (let i = 0; i < n; i++) {
          if (st[i] === EXIT) { canLeave[i] = true; continue; }
          const na = obSlide(p, st, occ, i);
          if (na === st[i]) continue;
          const ns = st.slice(); ns[i] = na;
          const k = obKey(ns, B);
          if (!seen.has(k)) { seen.add(k); stack.push(ns); }
        }
      }
      const out = [];
      for (let i = 0; i < n; i++) if (run.st[i] !== EXIT && !canLeave[i]) out.push(i);
      return out;
    },
    // three cars in a chain: red frees blue, blue frees yellow
    practice() {
      const raw = [
        { x: 1, y: 1, dir: 'E', len: 2, color: 0 },
        { x: 2, y: 3, dir: 'N', len: 2, color: 1 },
        { x: 0, y: 3, dir: 'E', len: 2, color: 2 },
      ];
      const cars = raw.map((c, i) => Object.assign({ id: i, label: 'c' + (i + 1) }, c));
      const p = { w: 4, h: 4, cars };
      const an = obAnalyze(p);
      return {
        game: 'outbound', level: 0, seed: 0, w: 4, h: 4, cars, an,
        reference: an.optimal,
        features: { cars: 3, trucks: 0, optimal_moves: an.optimal, p_random_solve: round(an.pRandom, 4), reachable_states: an.states, dead_end_states: an.deadStates, practice: true },
      };
    },
    serialize(run) { return { st: run.st.slice(), hist: run.hist.map((h) => h.slice()) }; },
    restore(p, data) { return { st: data.st.slice(), hist: data.hist.map((h) => h.slice()) }; },
  };

  // =====================================================================
  // CONDUIT: every tile is part of one spanning tree. Tiles start rotated.
  // A tap turns a tile a quarter turn clockwise. Puzzles have exactly one
  // solution, so each tile has a known number of taps left.
  // =====================================================================
  const N = 1, E = 2, S = 4, W = 8;
  const SIDES = [N, E, S, W];
  const OPP = { 1: 4, 2: 8, 4: 1, 8: 2 };
  const DXY = { 1: [0, -1], 2: [1, 0], 4: [0, 1], 8: [-1, 0] };
  function rotCW(m, r) {
    r = ((r % 4) + 4) % 4;
    for (let k = 0; k < r; k++) m = ((m << 1) | (m >> 3)) & 15;
    return m;
  }
  function bits(m) { let c = 0; while (m) { c += m & 1; m >>= 1; } return c; }
  function periodOf(m) { return rotCW(m, 1) === m ? 1 : rotCW(m, 2) === m ? 2 : 4; }

  // Random spanning tree grown from the source; no four-way crossings.
  function cdTree(w, h, src, rng) {
    for (let attempt = 0; attempt < 50; attempt++) {
      const masks = new Array(w * h).fill(0);
      const inTree = new Uint8Array(w * h);
      const frontier = [];
      const addFrontier = (c) => {
        const x = c % w, y = (c / w) | 0;
        for (const s of SIDES) {
          const nx = x + DXY[s][0], ny = y + DXY[s][1];
          if (nx < 0 || ny < 0 || nx >= w || ny >= h) continue;
          const nc = ny * w + nx;
          if (!inTree[nc]) frontier.push([c, s, nc]);
        }
      };
      inTree[src] = 1;
      addFrontier(src);
      let count = 1;
      while (frontier.length && count < w * h) {
        const idx = rng.int(frontier.length);
        const e = frontier[idx];
        frontier[idx] = frontier[frontier.length - 1];
        frontier.pop();
        const c = e[0], s = e[1], nc = e[2];
        if (inTree[nc]) continue;
        if (bits(masks[c]) >= 3) continue;
        masks[c] |= s;
        masks[nc] |= OPP[s];
        inTree[nc] = 1;
        count++;
        addFrontier(nc);
      }
      if (count === w * h) return masks;
    }
    return null;
  }

  // Constraint solver: counts solutions (up to `limit`) for a set of tiles
  // whose rotations are unknown. Edges must agree, borders stay closed,
  // and the network must be one tree.
  // With `dry` set to the source tile, two-arm pipes other than the source may
  // also stay out of the network (dry). Those solutions are counted in
  // `bypass`: every plant watered, no open end, some pipe left out. Counting
  // arms shows no other tile can be left out: the network keeps 2(n-1) minus
  // the arms of the dry tiles, and a connected network needs at least two per
  // tile it keeps, so every dry tile has exactly two arms.
  function cdSolve(w, h, tiles, limit, dry) {
    const n = w * h;
    const canDry = dry != null;
    const cand = [], dryBit = new Uint8Array(n);
    for (let i = 0; i < n; i++) {
      const seen = [];
      for (let r = 0; r < 4; r++) {
        const m = rotCW(tiles[i], r);
        if (seen.indexOf(m) < 0) seen.push(m);
      }
      if (canDry && i !== dry && bits(tiles[i]) === 2) { dryBit[i] = 1 << seen.length; seen.push(0); }
      cand.push(seen);
    }
    const dom0 = new Uint8Array(n);
    for (let i = 0; i < n; i++) {
      const x = i % w, y = (i / w) | 0;
      let d = 0;
      for (let k = 0; k < cand[i].length; k++) {
        const m = cand[i][k];
        if ((m & N) && y === 0) continue;
        if ((m & S) && y === h - 1) continue;
        if ((m & W) && x === 0) continue;
        if ((m & E) && x === w - 1) continue;
        d |= 1 << k;
      }
      dom0[i] = d;
    }
    const sideState = (dom, i, s) => {
      let open = 0, closed = 0;
      const c = cand[i];
      for (let k = 0; k < c.length; k++) {
        if (!(dom[i] & (1 << k))) continue;
        if (c[k] & s) open++; else closed++;
      }
      if (!open && !closed) return -1;
      return open && closed ? 2 : open ? 1 : 0;
    };
    const propagate = (dom, queue) => {
      while (queue.length) {
        const i = queue.pop();
        const x = i % w, y = (i / w) | 0;
        if (!dom[i]) return false;
        for (const s of SIDES) {
          const st = sideState(dom, i, s);
          if (st === -1) return false;
          if (st === 2) continue;
          const nx = x + DXY[s][0], ny = y + DXY[s][1];
          if (nx < 0 || ny < 0 || nx >= w || ny >= h) continue;
          const j = ny * w + nx;
          const os = OPP[s];
          let nd = 0;
          const cj = cand[j];
          for (let k = 0; k < cj.length; k++) {
            if (!(dom[j] & (1 << k))) continue;
            if (((cj[k] & os) ? 1 : 0) === st) nd |= 1 << k;
          }
          if (nd !== dom[j]) {
            if (!nd) return false;
            dom[j] = nd;
            queue.push(j);
          }
        }
      }
      return true;
    };
    const globalOk = (dom) => {
      const parent = new Int32Array(n);
      for (let i = 0; i < n; i++) parent[i] = i;
      const find = (a) => { while (parent[a] !== a) { parent[a] = parent[parent[a]]; a = parent[a]; } return a; };
      for (let i = 0; i < n; i++) {
        const x = i % w, y = (i / w) | 0;
        if (x < w - 1 && sideState(dom, i, E) === 1) {
          const a = find(i), b = find(i + 1);
          if (a === b) return false;
          parent[a] = b;
        }
        if (y < h - 1 && sideState(dom, i, S) === 1) {
          const a = find(i), b = find(i + w);
          if (a === b) return false;
          parent[a] = b;
        }
      }
      const loose = new Uint8Array(n), size = new Int32Array(n), wet = new Int32Array(n);
      let mustWet = 0;
      for (let i = 0; i < n; i++) {
        const r = find(i);
        size[r]++;
        if (!(dom[i] & dryBit[i])) { wet[r]++; mustWet++; }
        if (!loose[r]) for (const s of SIDES) if (sideState(dom, i, s) === 2) { loose[r] = 1; break; }
      }
      for (let i = 0; i < n; i++) {
        if (find(i) !== i || loose[i] || size[i] === n) continue;
        if (!canDry) return false;
        if (size[i] === 1 && dom[i] === dryBit[i]) continue; // a pipe left dry
        if (find(dry) === i && wet[i] === mustWet) continue; // the source's network holds every tile that must be wet
        return false;
      }
      return true;
    };
    let solutions = 0, nodes = 0, bypass = 0;
    let first = null;
    const done = () => solutions >= limit || bypass > 0;
    const dfs = (dom) => {
      nodes++;
      if (nodes > 200000) return;
      if (!globalOk(dom)) return;
      let bi = -1, bc = 9;
      for (let i = 0; i < n; i++) {
        const c = bits(dom[i]);
        if (c > 1 && c < bc) { bc = c; bi = i; }
      }
      if (bi === -1) {
        solutions++;
        let left = 0;
        for (let i = 0; i < n; i++) if (dryBit[i] && dom[i] === dryBit[i]) left++;

  const Conduit = {

    // pick: how many unique boards to compare; the one that needs the most
    // search beyond local edge rules is kept, so higher levels need more reasoning

      2: { w: 4, h: 4, pick: 1, attempts: 160 },
      3: { w: 4, h: 5, pick: 1, attempts: 160 },
      4: { w: 5, h: 5, pick: 8, attempts: 240 },

      const [minNeed, maxNeed] = this.turnRange(sol.length);
      let start, need;
      for (let draw = 0; draw < 20; draw++) {
        start = valid.map((vs) => (rng() < this.keepRight ? 0 : vs[rng.int(vs.length)]));
        need = needOf(start);
        // never close to solved, never a long tapping job: turn single tiles to
        // another allowed position that brings the total toward the range
        // without overshooting it
        for (let guard = 0; (need < minNeed || need > maxNeed) && guard < 2000; guard++) {
          const i = rng.int(sol.length);
          const k = turnsAt(i, start[i]);
          const opts = valid[i].filter((r) => { const t = need - k + turnsAt(i, r); return need < minNeed ? t > need && t <= maxNeed : t < need && t >= minNeed; });
          if (!opts.length) continue;

      }
      const tally = { end: 0, straight: 0, elbow: 0, tee: 0 };
      for (const m of sol) {
        const b = bits(m);

        else if (b === 3) tally.tee++;
        else if (m === (N | S) || m === (E | W)) tally.straight++;

          forced_by_local_rules: chosen.res.forced,

    hint(p, run) {

    practice() {

        reference: need,
        features: { tiles: 9, optimal_turns: need, forced_by_local_rules: res.forced, search_nodes: res.nodes, practice: true },

    progress(p, run) {

    restore(p, data) { return { rot: data.rot.slice(), hist: data.hist.slice() }; },

  // =====================================================================
  // TUMBLER: a hidden code of P pins in C colors (repeats allowed).
  // Two clue styles:
  //   pin   - every pin of a try is marked: right spot, elsewhere, or absent
  //           (repeated colors are matched left to right, as in Wordle)
  //   count - only the number of right-spot and right-color pins is shown
  // We track the set of codes still consistent with every clue and score
  // each try by the information it was expected to give.
  // =====================================================================
  const spaceCache = new Map();
  function tbSpace(P, C) {
    const key = P + ':' + C;
    if (spaceCache.has(key)) return spaceCache.get(key);
    const total = Math.pow(C, P);
    const dig = new Uint8Array(total * P);
    const cnt = new Uint8Array(total * C);
    for (let code = 0; code < total; code++) {
      let v = code;
      for (let k = P - 1; k >= 0; k--) {
        const d = v % C;
        v = (v / C) | 0;
        dig[code * P + k] = d;
        cnt[code * C + d]++;
      }
    }
    const all = new Int32Array(total);
    for (let i = 0; i < total; i++) all[i] = i;
    const sp = { P, C, total, dig, cnt, all, rem: new Int8Array(C), firstBest: {}, canon: new Map() };
    spaceCache.set(key, sp);
    return sp;

  // count clue: exact * (P + 1) + right-color-wrong-spot
  function tbCount(sp, a, b) {
    const P = sp.P, C = sp.C, dig = sp.dig, cnt = sp.cnt;
    let ex = 0, com = 0;
    const ao = a * P, bo = b * P;
    for (let k = 0; k < P; k++) if (dig[ao + k] === dig[bo + k]) ex++;
    const ac = a * C, bc = b * C;
    for (let c = 0; c < C; c++) {
      const x = cnt[ac + c], y = cnt[bc + c];
      com += x < y ? x : y;
    }
    return ex * (P + 1) + (com - ex);
  }
  // pin clue for try a against code b: base-3 number of per-pin marks
  // (2 right spot, 1 elsewhere, 0 absent), first pin most significant
  function tbPin(sp, a, b) {
    const P = sp.P, dig = sp.dig, rem = sp.rem;
    rem.fill(0);
    const ao = a * P, bo = b * P;
    for (let k = 0; k < P; k++) if (dig[ao + k] !== dig[bo + k]) rem[dig[bo + k]]++;
    let key = 0;
    for (let k = 0; k < P; k++) {
      const g = dig[ao + k];
      let m = 0;
      if (g === dig[bo + k]) m = 2;
      else if (rem[g] > 0) { m = 1; rem[g]--; }
      key = key * 3 + m;
    }

  function tbPatternReps(sp) {

    const rec = (left, max, acc) => {
      if (left === 0) { if (acc.length <= sp.C) parts.push(acc.slice()); return; }
      for (let k = Math.min(left, max); k >= 1; k--) { acc.push(k); rec(left - k, k, acc); acc.pop(); }

  // them needs checking: a code is kept when its unseen colors first appear
  // in increasing order (e.g. with C..G unseen, CCDE is kept, DDCE is not).
  function tbCanonical(sp, seen) {
    if (sp.canon.has(seen)) return sp.canon.get(seen);
    const unseen = [];
    for (let c = 0; c < sp.C; c++) if (!(seen & (1 << c))) unseen.push(c);
    const out = [];
    for (let code = 0; code < sp.total; code++) {
      let next = 0, used = 0, ok = true;
      for (let k = 0; k < sp.P && ok; k++) {
        const d = sp.dig[code * sp.P + k];

        if (used & (1 << d)) continue;

        else { used |= 1 << d; next++; }

  function tbBest(sp, S, seen, mode) {

    const inS = new Uint8Array(sp.total);
    for (let i = 0; i < S.length; i++) inS[S[i]] = 1;

    for (let i = 0; i < candidates.length; i++) {
      const g = candidates[i];
      const H = tbEntropy(sp, g, S, buf, mode);

  function tbSolverPath(sp, secret, mode) {

    const path = [];
    const win = tbWin(sp, mode), f = tbFn(mode);
    for (let step = 0; step < 30; step++) {
      const g = tbBest(sp, S, tbSeen(sp, path), mode).code;
      path.push(g);
      const fb = f(sp, g, secret);
      if (fb === win) break;
      S = tbFilter(sp, S, g, fb, mode);
    }
    return path;
  }

  const Tumbler = {
    id: 'tumbler',
    name: 'Tumbler',
    noun: 'try',
    // pin clues say more per try, so their ladder uses longer codes; both
    // ladders keep taps per code near the shared ladder (about 6, 8, 10, 12, 14)
    levels: {
      1: { pin: { P: 2, C: 4, max: 6 }, count: { P: 2, C: 4, max: 6 } },
      2: { pin: { P: 3, C: 4, max: 6 }, count: { P: 2, C: 5, max: 7 } },
      3: { pin: { P: 3, C: 5, max: 6 }, count: { P: 3, C: 3, max: 7 } },
      4: { pin: { P: 4, C: 5, max: 7 }, count: { P: 3, C: 4, max: 7 } },
      5: { pin: { P: 4, C: 6, max: 7 }, count: { P: 3, C: 5, max: 8 } },
    },
    letters: 'ABCDEFG',
    describe(p) { return p.P + ' pins, ' + p.C + ' colors, ' + (p.clue === 'count' ? 'count clues' : 'pin clues'); },
    build(level, seed, P, C, max, secret, clue) {
      const sp = tbSpace(P, C);
      const path = tbSolverPath(sp, secret, clue);
      return {
        game: 'tumbler', level, seed, clue,
        P, C, max,
        secret,
        secretDigits: tbDecode(sp, secret),
        reference: path.length,
        features: {
          pins: P, colors: C, max_tries: max, clues: clue,
          possible_codes: sp.total,
          bits: round(Math.log2(sp.total), 3),
          solver_tries: path.length,

    },
    generate(level, seed, variant) {
      const clue = variant === 'count' ? 'count' : 'pin';
      const L = this.levels[level][clue];
      const rng = makeRng(seed);

    // two pins, three colors: the first guided try lands both colors in the wrong spots
    practice(variant) {

      const sp = tbSpace(2, 3);

    },
    toLetters(sp, code) { return tbDecode(sp, code).map((d) => this.letters[d]).join(''); },
    newRun(p) { return { tries: [], S: tbSpace(p.P, p.C).all, revealed: new Array(p.P).fill(null) }; },

    // Scores a try against the hidden code. Feedback is immediate; the

    guess(p, run, digits) {

      const g = tbEncode(sp, digits);

      for (let i = 0; i < S.length; i++) if (S[i] === g) { consistent = true; break; }
      const Hg = tbEntropy(sp, g, S, new Int32Array(tbKeys(sp, mode)), mode);
      const fb = tbFn(mode)(sp, g, p.secret);

      const partial = marks.filter((m) => m === 1).length;
      const S2 = tbFilter(sp, S, g, fb, mode);
      const seenBefore = tbSeen(sp, run.tries.map((t) => tbEncode(sp, t.digits)), run.revealed);

      rec.bestTry = this.toLetters(sp, best.code);
      if (!rec.solved) {

  let downloadsReady = Promise.resolve(null);
  async function saveFile(filename, data) {
    let dl = null;
    try { dl = await downloadsReady; } catch (e) { dl = null; }
    if (dl) {
      try {
        await dl.save({ filename, data });
        toast('Saved ' + filename);
        return;
      } catch (e) {
        const code = e && e.code;
        if (code === 'declined') { toast('Save cancelled'); return; }
        if (code === 'rate_limited') { toast('Another save is waiting for your answer'); return; }
      }
    }
    // A self-hosted copy (no claude.ai viewer around it) can use a normal browser download.
    if (!window.claude) {
      try {
        const type = /\.json$/.test(filename) ? 'application/json' : /\.md$/.test(filename) ? 'text/markdown' : 'text/csv';
        const url = URL.createObjectURL(new Blob([data], { type: type + ';charset=utf-8' }));
        const a = h('a', { href: url, download: filename, hidden: true });
        document.body.append(a);
        a.click();
        a.remove();
        setTimeout(() => URL.revokeObjectURL(url), 4000);
        toast('Saved ' + filename);
        return;
      } catch (e) { /* fall back to the copy box */ }
    }
    showCopy(filename, data);
  }
  function showCopy(filename, data) {

      const done = () => toast('Copied ' + filename);

      try { navigator.clipboard.writeText(data).then(done, select); } catch (e) { select(); }

    openSheet('Copy data', [
      h('p', { class: 'empty-state', text: 'Saving files is not available here. Copy this into a file named ' + filename + '.' }),

  }

  const Stats = {
    blank() { return { cards: 0, solved: 0, perfect: 0, stars: 0, ms: 0, top: 0, tries: 0, plan: 0, planN: 0 }; },
    add(all, r) {
      const t = all[r.game] || (all[r.game] = this.blank());
      t.cards++;
      if (r.outcome === 'solved' || r.outcome === 'complete') t.solved++;
      if (r.stars === 3) t.perfect++;
      t.stars += r.stars || 0;
      t.ms += r.duration_ms || 0;
      t.top = Math.max(t.top, r.level || 0, Number(r.level_next) || 0);
      if (r.game === 'tumbler' && r.outcome === 'solved') t.tries += r.moves || 0;
      if (r.game === 'stacks' && r.outcome === 'solved' && r.first_move_ms !== '' && r.first_move_ms != null) { t.plan += Number(r.first_move_ms); t.planN++; }
    },
    // the first time, built from the free play already logged on this device
    load(app) {
      const all = store.get('pr1.gstats', null);
      if (all) return { all, built: false };
      const a = {}, cur = app.session;
      const list = Sessions.all().filter((S) => S.kind === 'free' && (!cur || S.id !== cur.id));
      if (cur && cur.kind === 'free') list.push(cur);
      for (const S of list) for (const r of S.puzzles) if (!Number(r.practice) && r.outcome !== 'abandoned') this.add(a, r);
      store.set('pr1.gstats', a);
      return { all: a, built: true };
    },
    record(app, r) {
      const st = this.load(app);
      if (!st.built) { this.add(st.all, r); store.set('pr1.gstats', st.all); }
    },
  };

  function holdEnd(onDone) {
    const b = h('button', { class: 'hud-btn holdx', type: 'button', 'aria-label': 'End the session (press and hold)' }, icon('x'));
    b.append(s('svg', { class: 'ring', viewBox: '0 0 44 44', 'aria-hidden': 'true' }, s('circle', { cx: 22, cy: 22, r: 20 })));
    let timer = null;
    const start = (e) => {
      if (e && e.preventDefault) e.preventDefault();
      if (timer) return;
      b.classList.add('holding');
      timer = setTimeout(() => { timer = null; b.classList.remove('holding'); onDone(); }, 1200);
    };
    const cancel = () => { clearTimeout(timer); timer = null; b.classList.remove('holding'); };
    b.addEventListener('pointerdown', start);
    ['pointerup', 'pointerleave', 'pointercancel', 'keyup', 'blur'].forEach((ev) => b.addEventListener(ev, cancel));
    b.addEventListener('keydown', (e) => { if (e.key === 'Enter' || e.key === ' ') start(e); });
    b.addEventListener('contextmenu', (e) => e.preventDefault());
    return b;
  }

    // sessions, between visits in free play. A level without a value starts
    // 83 ms (5 frames at 60 Hz) above the level below it, if that one has a value.
    glimpseBook(spec) {

      if (S.kind === 'free') return { book: store.get('pr1.glimpse', {}), free: true };
      if (!S.glimpse) S.glimpse = {};

      const { book } = this.glimpseBook(spec);
      if (book[spec.level] > 0) return { ms: book[spec.level] };
      for (let k = spec.level - 1; k >= 1; k--) if (book[k] > 0) return { ms: Math.min(E.games.glimpse.startMs, book[k] + 83) };
      return null;
    },
    glimpseKeep(spec, ms) {
      if (spec.practice || !(ms > 0)) return;
      const { book, free } = this.glimpseBook(spec);
      book[spec.level] = Math.round(ms * 100) / 100;
      if (free) store.set('pr1.glimpse', book);
    },

    boot(data) {
      Gen.init();
      try {
        if (window.claude && typeof window.claude.use === 'function') downloadsReady = window.claude.use('downloads').catch(() => null);
      } catch (e) { downloadsReady = Promise.resolve(null); }
      this.bindGlobal();
      store.del('pr1.focus');
      if (data && data.v === 2 && data.session) {
        const S = data.session;
        if (data.engine === E.version) { this.restore(S, data.card, 'page update'); return; }
        // the games changed: a study picks up at the same puzzle, built fresh; free play starts over as the full mix
        if (S.kind === 'study' && S.status === 'active') {
          if (data.card && data.card.spec && !data.card.spec.practice && !data.card.summary) S.pending = data.card.spec;
          this.restore(S, null, 'page update, games changed');
          return;
        }
        if (S.kind === 'free' && S.status === 'active' && S.hasMoves) {
          S.status = 'closed';
          S.endedAt = new Date().toISOString();
          S.live = null;
          Sessions.save(S);
        }
      }
      const activeId = store.get('pr1.active', null);
      const S = activeId ? Sessions.load(activeId) : null;
      if (S && S.kind === 'study' && S.status === 'active' && S.app_version === APP_VERSION) { this.showResume(S); return; }
      this.startFree(true);
    },
    applySound() {
      const S = this.session;
      Sound.on = S && S.kind === 'study' ? !!S.options.sound : store.get('pr1.sound', true) !== false;
    },

    // ---------- sessions
    startFree(first, focus) {
      this.closeCurrent();
      let game = focus || 'mixed';
      if (game !== 'mixed' && ORDER.indexOf(game) < 0) game = 'mixed';
      const levels = store.get('pr1.levels', {});
      const S = newSession('free', { seed: randomSeed(), participant: '', condition: '', options: FREE_OPTIONS, blocks: [{ game, count: FREE_COUNT, level: 2, adaptive: true }] });
      ORDER.forEach((g) => { S.seq.adapt['0:' + g] = { level: Math.min(5, Math.max(1, levels[g] || 2)), streak: 0 }; });
      S.practiced = Object.assign({}, store.get('pr1.practiced', {}));
      // the mixed feed opens with a game this player has not tried yet
      if (game === 'mixed') { const k = ORDER.findIndex((g) => !S.practiced[g]); if (k > 0) S.seq.k = k; }
      this.session = S;
      this.applySound();
      this.logEvent({ event: 'session_start', detail: JSON.stringify({ options: S.options, blocks: S.blocks }) });
      Sessions.prune();
      this.advance(first);
    },
    startStudy(setup) {
      this.closeCurrent();
      const S = newSession('study', setup);
      this.session = S;
      this.applySound();
      store.set('pr1.active', S.id);
      this.logEvent({ event: 'session_start', detail: JSON.stringify({ options: S.options, blocks: S.blocks }) });
      this.save();
      this.advance(false);
    },
    closeCurrent() {
      const S = this.session;
      if (!S) return;
      if (this.card && !this.card.summary) this.card.resolve('abandoned');
      if (S.status === 'active') {
        S.status = S.kind === 'free' ? 'closed' : 'ended_early';
        S.endedAt = new Date().toISOString();
        this.logEvent({ event: 'session_end', detail: S.status });
      }
      S.live = null;
      if (S.kind === 'study') store.del('pr1.active');
      this.save();
      if (this.card) this.card.destroy();
      this.card = null;
    },
    finish(status) {
      const S = this.session;
      if (!S || S.status !== 'active') return;
      if (this.card && !this.card.summary) this.card.resolve('abandoned');
      S.status = status;
      S.endedAt = new Date().toISOString();
      this.logEvent({ event: 'session_end', detail: status });
      S.live = null;
      S.pending = null;
      if (S.kind === 'study') store.del('pr1.active');
      this.save();
      if (this.card) this.card.destroy();
      this.card = null;
      this.showEnd();
    },
    isLast(spec) {
      const S = this.session;
      return !spec.practice && S.kind === 'study' && spec.seq >= seqTotal(S.seq);
    },
    needsPractice(game) {
      const S = this.session;
      return !!S.options.practice && !S.practiced[game];
    },

    // ---------- puzzle flow
    next(fromDy) {
      if (this.busy) return;
      if (this.card && !this.card.summary) return;
      this.advance(false, fromDy);
    },
    async advance(first, fromDy) {
      const S = this.session;
      if (!S || S.status !== 'active') return;
      const spec = S.pending || seqNext(S.seq);
      S.pending = null;
      if (!spec) { this.finish('complete'); return; }
      if (this.needsPractice(spec.game)) {
        S.pending = spec;
        await this.show(practiceSpec(spec.game, spec.variant), null, true, fromDy);
        return;
      }
      await this.show(spec, null, first, fromDy);
    },
    async show(spec, snap, first, fromDy) {
      this.busy = true;
      try {
        let p = null;
        if (spec.practice) p = E.games[spec.game].practice(spec.variant);
        else {
          p = Gen.peek(spec.game, spec.level, spec.seed, spec.variant);
          if (!p && first) { try { p = Gen.sync(spec.game, spec.level, spec.seed, spec.variant); } catch (e) { p = null; } }
          if (!p) {
            this.swap(this.panel([h('div', { class: 'spinner', role: 'status', 'aria-label': 'Loading' })], spec.game), fromDy);
            fromDy = 0;
            p = await Gen.get(spec.game, spec.level, spec.seed, spec.variant);
          }
        }
        if (this.card) this.card.destroy();
        const card = makeCard(this, spec, p, snap);
        this.card = card;
        $('#app').dataset.scene = spec.game;
        this.swap(card.el, fromDy);
        if (snap) {
          this.logPuzzle(card, 'resume', { move_no: card.c.moves });
          card.startTimer();
          card.later(() => card.guide(), 520);
        } else {
          card.start();
        }
        if (!spec.practice) this.prefetch(spec);
        else if (this.session.pending) this.prefetchSpec(this.session.pending);
        this.renderHud();
        this.touch(true);
      } catch (e) {
        this.swap(this.panel([
          h('h2', { text: 'That puzzle did not load' }),
          h('p', { text: String((e && e.message) || e) }),
          h('div', { class: 'stack' }, h('button', { class: 'wide solid', type: 'button', onclick: () => this.advance(false) }, 'Try the next one', icon('next'))),
        ]));
      } finally {
        this.busy = false;
      }
    },
    prefetchSpec(spec) { Gen.get(spec.game, spec.level, spec.seed, spec.variant).catch(() => {}); },
    // Free play, every game alike: one level up per success until the first miss
    // in that game, then two successes in a row per level. Research blocks: always two.
    upAfter(game) {
      if (!this.session || this.session.kind !== 'free') return 2;
      return store.get('pr1.settled', {})[game] ? 2 : 1;
    },
    prefetch(spec) {
      const S = this.session;
      const outcomes = spec.adaptive ? [true, false] : [true];
      for (const ok of outcomes) {
        const c = clone(S.seq);
        seqRecord(c, spec, ok, this.upAfter(spec.game));
        const nx = seqNext(c);
        if (nx) this.prefetchSpec(nx);
      }
    },
    onPuzzleEnd(card, sm) {
      const S = this.session, sp = card.spec;
      // leaving a puzzle by switching games or ending the session is not a miss
      // in free play a skip is not a miss either: it is one tap, made for variety
      const neutral = sm.outcome === 'abandoned' || (S.kind === 'free' && sm.outcome === 'skipped');
      const change = sp.practice || neutral ? null : seqRecord(S.seq, sp, sm.success, this.upAfter(sp.game));
      const level_next = sp.adaptive && change ? change.to : '';
      this.logPuzzle(card, 'puzzle_end', { move_no: card.c.moves, cls: sm.outcome, detail: JSON.stringify({ success: sm.success, stars: sm.stars, moves: sm.moves, par: sm.par, reference: sm.reference }) });
      if (change && change.changed) this.logPuzzle(card, 'level_change', { from: change.from, to: change.to });
      const c = card.c, applies = APPLIES[sp.game];
      const n = (k) => (applies.indexOf(k) >= 0 ? c[k] : '');
      const g = sm.gl || null;
      if (g && !sp.practice && g.n) {
        this.glimpseKeep(sp, card.run.ms);
        if (S.kind === 'free' && g.best_ms != null && sm.outcome === 'complete') {
          const best = store.get('pr1.glbest', {});
          if (best[sp.level] != null && g.best_ms < best[sp.level] - 0.5) sm.newBest = g.best_ms;
          if (best[sp.level] == null || g.best_ms < best[sp.level]) { best[sp.level] = g.best_ms; store.set('pr1.glbest', best); }
        }
      }
      S.puzzles.push({
        seq: sp.seq, block: sp.block, in_block: sp.inBlock, puzzle_id: sp.id, puzzle_seed: card.p.seed,
        game: sp.game, level: sp.level, adaptive: sp.adaptive ? 1 : 0, practice: sp.practice ? 1 : 0, params: card.G.describe(card.p),
        outcome: sm.outcome, success: sm.success ? 1 : 0, stars: sm.stars, started_at: card.startedAt, ended_at: new Date().toISOString(),
        duration_ms: sm.duration_ms, first_move_ms: sm.first_move_ms == null ? '' : sm.first_move_ms, hidden_ms: sm.hidden_ms,
        moves: sm.moves, reference: sm.reference, par: sm.par, efficiency: sm.efficiency,
        n_optimal: n('optimal'), n_wasted: n('wasted'), n_dead_end: n('dead_end'), n_in_dead_end: n('in_dead_end'),
        n_blocked: n('blocked'), n_undo: n('undo'), n_restart: n('restart'), n_hint: n('hint'),
        n_suboptimal: n('suboptimal'), n_zero_info: n('zero_info'), n_inconsistent: n('inconsistent'),
        mean_info_ratio: sp.game === 'tumbler' && c.infoRatioN ? r4(c.infoRatioSum / c.infoRatioN) : '',
        n_correct: g ? g.correct : '', accuracy: g && g.n ? r4(g.accuracy) : '',
        threshold_ms: g && g.threshold_ms != null ? g.threshold_ms : '', best_ms: g && g.best_ms != null ? g.best_ms : '',
        start_ms: g && g.start_ms != null ? g.start_ms : '', end_ms: g && g.end_ms != null ? g.end_ms : '',
        n_reversals: g ? g.reversals : '', refresh_ms: g && g.refresh_ms != null ? r4(g.refresh_ms) : '',
        n_frame_drops: g ? g.drops : '', field_px: g && card.R ? Math.round(card.R) : '',
        level_next,
        features: JSON.stringify(card.p.features),
      });
      if (sp.practice) {
        // leaving the practice board for another game does not count as having played it
        if (sm.outcome !== 'abandoned') {
          S.practiced[sp.game] = true;
          if (S.kind === 'free') store.set('pr1.practiced', S.practiced);
        }
      } else if (S.kind === 'free') {
        if (!sm.success && !neutral) {
          const settled = store.get('pr1.settled', {});
          if (!settled[sp.game]) { settled[sp.game] = true; store.set('pr1.settled', settled); }
        }
        // free play keeps stars, a streak and per-game levels between visits
        if (sm.outcome !== 'abandoned') {
          const won = sm.outcome === 'solved' || (sm.outcome === 'complete' && sm.stars > 0);
          store.set('pr1.stars', store.get('pr1.stars', 0) + sm.stars);
          store.set('pr1.streak', won ? store.get('pr1.streak', 0) + 1 : 0);
        }
        if (change) { const lv = store.get('pr1.levels', {}); lv[sp.game] = change.to; store.set('pr1.levels', lv); }
        if (sm.outcome !== 'abandoned') Stats.record(this, S.puzzles[S.puzzles.length - 1]);
        this.hudBump = sm.stars > 0;
      }
      this.renderHud();
      this.touch(true);
      return { level_next, change };
    },

    // ---------- logging & persistence
    logEvent(fields) {
      const S = this.session;
      if (!S) return;
      const e = Object.assign({ i: S.events.length + 1, wall_time: new Date().toISOString(), t_session_ms: Date.now() - S.t0wall }, fields);
      S.events.push(e);
    },
    logPuzzle(card, event, fields) {
      const sp = card.spec;
      this.logEvent(Object.assign({
        event, seq: sp.seq, block: sp.block, puzzle_id: sp.id, puzzle_seed: card.p.seed,
        game: sp.game, level: sp.level, adaptive: sp.adaptive ? 1 : 0, practice: sp.practice ? 1 : 0, t_ms: Math.round(card.elapsed()),
      }, fields));
    },
    touch(immediate) {
      clearTimeout(this.saveTimer);
      if (immediate) this.save();
      else this.saveTimer = setTimeout(() => this.save(), 500);
    },
    save() {
      const S = this.session;
      if (!S) return;
      if (S.kind === 'free' && !S.hasMoves) return;
      S.live = this.card && S.status === 'active' ? this.card.snapshot() : null;
      const ok = Sessions.save(S);
      if (!ok && !this.warnedStorage) {
        this.warnedStorage = true;
        toast('This browser is not keeping data between visits. Save your data before closing.', 5000);
      }
    },
    snapshot() {
      return { v: 2, engine: E.version, session: this.session, card: this.card && this.session && this.session.status === 'active' ? this.card.snapshot() : null };
    },
    async restore(S, cardSnap, reason) {
      this.session = S;
      if (S.t0wall == null) S.t0wall = Date.parse(S.startedAt) || Date.now();
      if (!S.practiced) S.practiced = {};
      this.applySound();
      if (S.status !== 'active') { this.renderHud(); this.showEnd(); return; }
      if (S.kind === 'study') store.set('pr1.active', S.id);
      this.logEvent({ event: 'resume', detail: reason });
      if (cardSnap && cardSnap.spec) await this.show(cardSnap.spec, cardSnap, false);
      else await this.advance(false);
    },

    // ---------- views
    panel(kids, scene) {
      const el = h('article', { class: 'scene panel' }, h('div', { class: 'panel-body' }, kids));
      if (scene) el.setAttribute('data-game', scene);
      return el;
    },
    swap(el, fromDy) {
      const stage = $('#stage');
      const olds = Array.from(stage.children).filter((c) => c !== el && !c.dataset.leaving);
      stage.append(el);
      const canAnimate = typeof el.animate === 'function';
      const quiet = reducedMotion() || !olds.length || !canAnimate;
      const H = stage.clientHeight || 800;
      for (const old of olds) {
        old.dataset.leaving = '1';
        if (quiet) { old.remove(); continue; }
        const a = old.animate([{ transform: 'translateY(' + (fromDy || 0) + 'px)' }, { transform: 'translateY(' + -H + 'px)' }], { duration: 400, easing: 'cubic-bezier(.3,.6,.2,1)' });
        a.onfinish = () => old.remove();
        setTimeout(() => old.remove(), 800);
      }
      if (!quiet) el.animate([{ transform: 'translateY(' + H + 'px)' }, { transform: 'translateY(0)' }], { duration: 400, easing: 'cubic-bezier(.3,.6,.2,1)' });
      else if (olds.length && canAnimate) el.animate([{ opacity: 0 }, { opacity: 1 }], { duration: 160 });
    },
    renderHud() {
      const S = this.session;
      const L = $('#hud-left'), M = $('#hud-mid'), R = $('#hud-right');
      L.textContent = ''; M.textContent = ''; R.textContent = '';
      const study = !!(S && S.kind === 'study' && S.status === 'active');
      if (study) {
        L.append(h('span', { class: 'who', text: S.participant || 'Participant' }));
        const total = seqTotal(S.seq);
        const at = this.card && !this.card.spec.practice ? this.card.spec.seq : S.pending ? S.pending.seq : S.seq.n;
        if (total <= 40) {
          const segs = h('div', { class: 'segs', role: 'progressbar', 'aria-valuemin': '0', 'aria-valuemax': String(total), 'aria-valuenow': String(at), 'aria-label': 'Puzzle ' + at + ' of ' + total });
          for (let i = 1; i <= total; i++) segs.append(h('i', { class: i < at ? 'done' : i === at ? 'now' : '' }));
          M.append(segs);
        } else {
          const bar = h('div', { class: 'segbar', role: 'progressbar', 'aria-valuemin': '0', 'aria-valuemax': String(total), 'aria-valuenow': String(at) }, h('b'));
          bar.firstChild.style.width = Math.round((100 * Math.max(0, at - 1)) / total) + '%';
          M.append(bar);
        }
        R.append(holdEnd(() => this.finish('ended_early')));
      } else {
        L.append(h('button', { class: 'hud-btn', type: 'button', 'aria-label': 'Menu', onclick: () => this.openMenu() }, icon('menu')));
        const only = S && S.kind === 'free' && S.blocks[0] && S.blocks[0].game !== 'mixed' ? S.blocks[0].game : null;
        if (only) {
          M.append(h('button', { class: 'only-chip', type: 'button', 'aria-label': 'Only ' + LABEL[only] + '. Back to all games', onclick: () => this.startFree(false, 'mixed') },
            icon(GAME_ICON[only]), h('span', { text: LABEL[only] + ' only' }), h('span', { class: 'chip-x' }, icon('x'))));
        } else {
          M.append(h('div', { class: 'wordmark' }, h('span', { class: 'logo', 'aria-hidden': 'true' }, h('i'), h('i'), h('i'), h('i'), h('i')), 'Puzzle Reel'));
        }
        if (!S || S.kind === 'free') {
          const stars = h('span', { class: 'pill', 'aria-label': store.get('pr1.stars', 0) + ' stars' }, icon('star', 'star'), String(store.get('pr1.stars', 0)));
          R.append(stars);
          const streak = store.get('pr1.streak', 0);
          if (streak >= 2) R.append(h('span', { class: 'pill', 'aria-label': streak + ' solved in a row' }, icon('flame', 'flame'), String(streak)));
          if (this.hudBump) { this.hudBump = false; setTimeout(() => stars.classList.add('bump'), 900); }
        }
      }
    },
    showEnd() {
      const S = this.session;
      $('#app').dataset.scene = 'panel';
      const real = S.puzzles.filter((p) => !p.practice);
      const solved = real.filter((p) => p.outcome === 'solved' || p.outcome === 'complete').length;
      const stars = real.reduce((a, p) => a + (p.stars || 0), 0);
      const total = real.reduce((a, p) => a + (p.duration_ms || 0), 0);
      const done = S.status === 'complete';
      const name = (S.participant || 'participant').replace(/[^A-Za-z0-9_-]+/g, '_');
      const panel = this.panel([

        h('div', { class: 'tiles' },
          h('div', null, h('b', { text: String(real.length) }), h('span', { text: 'puzzles' })),
          h('div', null, h('b', { text: String(solved) }), h('span', { text: 'solved' })),
          h('div', null, h('b', { text: String(stars) }), h('span', { text: 'stars' })),
          h('div', null, h('b', { text: clock(total) }), h('span', { text: 'on puzzles' }))),
        h('p', { class: 'meta-line', text: [S.participant, S.condition, 'seed ' + S.seed, S.events.length + ' events'].filter(Boolean).join(' · ') }),
        h('div', { class: 'row3' },
          h('button', { class: 'mini', type: 'button', onclick: () => saveFile('puzzle-reel_moves_' + name + '_' + stamp() + '.csv', eventsCSV([S])) }, icon('save'), 'Moves CSV'),
          h('button', { class: 'mini', type: 'button', onclick: () => saveFile('puzzle-reel_puzzles_' + name + '_' + stamp() + '.csv', puzzlesCSV([S])) }, icon('save'), 'Puzzles CSV'),
          h('button', { class: 'mini', type: 'button', onclick: () => saveFile('puzzle-reel_' + name + '_' + stamp() + '.json', exportJSON([S])) }, icon('save'), 'JSON')),

          h('button', { class: 'wide soft', type: 'button', onclick: () => this.startFree(false) }, icon('play'), 'Free play')),
      ]);

    },
    showResume(S) {
      this.session = null;
      $('#app').dataset.scene = 'panel';
      const at = S.live && S.live.spec && !S.live.spec.practice ? S.live.spec.seq : S.pending ? S.pending.seq : S.seq.n;
      const panel = this.panel([
        h('div', { class: 'big-badge' }, icon('pause')),
        h('h2', { text: 'Session paused' }),
        h('p', { text: (S.participant || 'The participant') + ' was on puzzle ' + Math.max(at, 1) + ' of ' + seqTotal(S.seq) + '. Resume to continue exactly there; the gap is logged.' }),
        h('div', { class: 'stack' },
