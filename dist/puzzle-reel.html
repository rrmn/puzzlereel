.res-chip .res-met { width: 14px; height: 14px; stroke-width: 3.2; }
.next {
  margin-top: 4px; width: 100%; max-width: 360px; height: 58px; border: 0; border-radius: 999px;
  background: var(--paper-ink); color: var(--paper);
  font-family: var(--display); font-weight: 600; font-size: 21px;
  display: inline-flex; align-items: center; justify-content: center; gap: 10px;
  box-shadow: 0 5px 0 rgba(0,0,0,.25); transition: transform 0.12s, box-shadow 0.12s;
}
.next svg { width: 24px; height: 24px; }
.next:active { transform: translateY(3px); box-shadow: 0 2px 0 rgba(0,0,0,.25); }
.swipe { color: var(--paper-soft); height: 18px; }
.swipe svg { width: 22px; height: 22px; animation: nudgeup 1.4s ease-in-out infinite; }

/* -------------------------------------------------------------- panels */
.panel-body { flex: 1; min-height: 0; overflow-y: auto; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; text-align: center; padding: 10px 26px 28px; }
.panel-body h2 { margin: 0; font-family: var(--display); font-weight: 700; font-size: 38px; line-height: 1.02; text-wrap: balance; }
.panel-body p { margin: 0; color: var(--ink2); max-width: 34ch; font-size: 16px; }
.big-badge { width: 92px; height: 92px; border-radius: 30px; display: grid; place-items: center; background: var(--chip); }
.big-badge svg { width: 52px; height: 52px; }
.tiles { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; width: 100%; max-width: 340px; }
.tiles div { background: var(--chip); border-radius: 18px; padding: 12px 10px; }
.tiles b { display: block; font-family: var(--display); font-weight: 600; font-size: 30px; line-height: 1.1; font-variant-numeric: tabular-nums; }
.tiles span { font-size: 13px; color: var(--ink2); }
.stack { display: flex; flex-direction: column; gap: 10px; width: 100%; max-width: 340px; }
.wide { height: 54px; border-radius: 999px; border: 0; font-family: var(--display); font-weight: 600; font-size: 19px; display: inline-flex; align-items: center; justify-content: center; gap: 9px; transition: transform 0.12s; }
.wide:active { transform: scale(0.97); }
.wide svg { width: 21px; height: 21px; }
.wide.solid { background: var(--btn); color: var(--btn-ink); box-shadow: 0 4px 0 rgba(0,0,0,.22); }
.wide.soft { background: var(--chip); color: var(--ink); }
.row3 { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
.mini { height: 40px; padding: 0 14px; border-radius: 999px; border: 0; background: var(--chip); color: var(--ink); font-weight: 500; font-size: 14px; display: inline-flex; align-items: center; gap: 6px; }
.mini svg { width: 17px; height: 17px; }
.meta-line { font-family: var(--mono); font-size: 12.5px; color: var(--ink2); }
.spinner { width: 44px; height: 44px; border-radius: 50%; border: 4px solid var(--chip); border-top-color: var(--ink); animation: spin 0.8s linear infinite; }

/* -------------------------------------------------------------- sheets */
.sheet-backdrop { position: fixed; inset: 0; z-index: 20; background: rgba(12, 12, 24, 0.5); animation: fadein 0.2s; }
.sheet {
  position: fixed; z-index: 21; left: 0; right: 0; bottom: 0; max-height: 92%;
  background: var(--sheet); color: var(--sheet-ink); border-radius: 26px 26px 0 0;
  display: flex; flex-direction: column; box-shadow: 0 -20px 60px rgba(0,0,0,.3);
  padding-bottom: env(safe-area-inset-bottom, 0px);
  animation: rise 0.32s cubic-bezier(.2,.9,.25,1);
}
@media (min-width: 720px) {
  .sheet { left: 50%; right: auto; width: 620px; margin-left: -310px; bottom: 24px; border-radius: 26px; max-height: calc(100% - 48px); }
}
.sheet-head { display: flex; align-items: center; gap: 12px; padding-block: 16px 10px; padding-left: max(22px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.sheet-head h2 { margin: 0; font-family: var(--display); font-weight: 700; font-size: 27px; line-height: 1.1; }
.sheet-head .x { margin-left: auto; width: 40px; height: 40px; border-radius: 50%; border: 0; background: var(--field); display: grid; place-items: center; }
.sheet-head .x svg { width: 20px; height: 20px; }
.sheet-body { overflow-y: auto; padding-block: 6px 22px; padding-left: max(22px, env(safe-area-inset-left, 0px)); padding-right: max(22px, env(safe-area-inset-right, 0px)); display: flex; flex-direction: column; gap: 20px; }
.sheet-foot { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; border-top: 1px solid var(--sheet-rule); padding-block: 14px; padding-left: max(22px, env(safe-area-inset-left, 0px)); padding-right: max(22px, env(safe-area-inset-right, 0px)); }
.sheet-foot .note { flex: 1 1 200px; margin: 0; font-size: 13px; color: var(--sheet-soft); }
.game-pick { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.gp {
  display: flex; flex-direction: column; align-items: center; gap: 7px; min-width: 0; padding: 11px 2px 9px;
  border-radius: 18px; border: 0; background: var(--field); color: var(--sheet-ink);
  font-family: var(--display); font-weight: 600; font-size: 13px; line-height: 1.1; text-align: center;
  box-shadow: inset 0 0 0 1.5px transparent; transition: box-shadow 0.15s, transform 0.12s;
}
.gp:active { transform: scale(0.95); }
.gp .gp-ico { width: 48px; height: 48px; display: grid; place-items: center; filter: drop-shadow(0 2px 3px rgba(20, 24, 40, 0.16)); }
.gp .gp-ico .badge { width: 48px; height: 48px; }
.gp.on { box-shadow: inset 0 0 0 2px var(--accent); }
.menu { display: flex; flex-direction: column; gap: 8px; }
.menu-item { display: flex; align-items: center; gap: 14px; width: 100%; padding: 12px 14px; border-radius: 18px; border: 0; background: var(--field); text-align: left; }
.menu-item .ico { width: 42px; height: 42px; border-radius: 14px; display: grid; place-items: center; background: var(--sheet); flex: none; }
.menu-item .ico svg { width: 22px; height: 22px; }
.menu-item b { display: block; font-family: var(--display); font-weight: 600; font-size: 18px; line-height: 1.2; }
.menu-item small { display: block; color: var(--sheet-soft); font-size: 13px; }
.menu-item .end { margin-left: auto; }
.switch { position: relative; display: inline-block; width: 50px; height: 30px; flex: none; vertical-align: middle; }
.switch input { position: absolute; inset: 0; opacity: 0; margin: 0; cursor: pointer; }
.switch span { position: absolute; inset: 0; border-radius: 999px; background: var(--sheet-rule); transition: background 0.2s; pointer-events: none; }
.switch span::after { content: ""; position: absolute; top: 3px; left: 3px; width: 24px; height: 24px; border-radius: 50%; background: #FFFFFF; box-shadow: 0 1px 3px rgba(0,0,0,.3); transition: transform 0.2s; }
.switch input:checked + span { background: var(--good); }
.switch input:checked + span::after { transform: translateX(20px); }
.switch input:focus-visible { outline: none; }
.switch input:focus-visible + span { outline: 3px solid var(--accent); outline-offset: 2px; }

fieldset { border: 0; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 10px; min-width: 0; }
legend { font-family: var(--display); font-weight: 600; font-size: 18px; padding: 0; margin-bottom: 8px; }
.fields { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px; }
.field { display: flex; flex-direction: column; gap: 5px; min-width: 0; }
.field label, .lbl { font-size: 13px; font-weight: 600; }
.help { font-size: 12.5px; color: var(--sheet-soft); }
input[type="text"], input[type="number"], select {
  border: 1.5px solid var(--sheet-rule); border-radius: 14px; background: var(--field); padding: 9px 12px; min-height: 44px; width: 100%; min-width: 0;
}
input:focus, select:focus { border-color: var(--accent); outline: none; }
.inline { display: flex; gap: 8px; align-items: stretch; }
.inline input { flex: 1; }
.btn {
  border: 1.5px solid var(--sheet-rule); background: transparent; border-radius: 999px;
  padding: 8px 16px; font-weight: 600; font-size: 14px; line-height: 1.1; min-height: 42px;
  display: inline-flex; align-items: center; justify-content: center; gap: 7px;
}
.btn svg { width: 17px; height: 17px; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.danger { color: var(--danger); border-color: color-mix(in srgb, var(--danger) 40%, var(--sheet-rule)); }
.btn[disabled] { opacity: 0.45; cursor: default; }
.plan { display: flex; flex-direction: column; gap: 8px; }
.plan-row { display: grid; grid-template-columns: 20px minmax(0, 1.4fr) minmax(0, 0.8fr) minmax(0, 0.8fr) auto 38px; gap: 8px; align-items: center; }
.plan-row .idx { font-family: var(--mono); font-size: 12px; color: var(--sheet-soft); text-align: right; }
.plan-head { font-size: 12px; color: var(--sheet-soft); font-weight: 600; }
.check { display: flex; gap: 10px; align-items: center; font-size: 14px; }
.check input { width: 20px; height: 20px; accent-color: var(--accent); margin: 0; flex: none; }
.checks { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 12px 16px; }
.icon-btn { border: 1.5px solid var(--sheet-rule); background: transparent; border-radius: 12px; width: 38px; height: 38px; display: grid; place-items: center; padding: 0; }
.icon-btn svg { width: 16px; height: 16px; }
.presets { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.error { color: var(--danger); font-size: 13.5px; font-weight: 600; margin: 0; }
.summary-line { font-family: var(--mono); font-size: 12.5px; color: var(--sheet-soft); margin: 0; }
@media (max-width: 460px) {
  .plan-row { grid-template-columns: 16px minmax(0, 1fr) 62px 62px auto 34px; gap: 6px; }
}
.stats-row { display: flex; gap: 22px; flex-wrap: wrap; font-size: 13px; color: var(--sheet-soft); }
.stats-row b { font-family: var(--display); font-weight: 600; font-size: 28px; color: var(--sheet-ink); display: block; line-height: 1.1; }
.table-wrap { overflow-x: auto; border: 1.5px solid var(--sheet-rule); border-radius: 16px; }
table { border-collapse: collapse; width: 100%; font-size: 13px; }
th, td { text-align: left; padding: 9px 12px; border-bottom: 1px solid var(--sheet-rule); white-space: nowrap; }
th { font-size: 12px; color: var(--sheet-soft); font-weight: 600; background: var(--field); }
tr:last-child td { border-bottom: 0; }
td.num { font-family: var(--mono); font-variant-numeric: tabular-nums; text-align: right; }
.empty-state { color: var(--sheet-soft); font-size: 14px; margin: 0; }
details summary { cursor: pointer; }
code { font-family: var(--mono); font-size: 12px; }
.copybox { width: 100%; min-height: 170px; font-family: var(--mono); font-size: 12px; border: 1.5px solid var(--sheet-rule); border-radius: 14px; background: var(--field); padding: 10px; resize: vertical; }
.confirm { border: 1.5px solid color-mix(in srgb, var(--danger) 40%, var(--sheet-rule)); border-radius: 16px; padding: 14px; display: flex; flex-direction: column; gap: 10px; }

.toast {
  position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(22px + env(safe-area-inset-bottom, 0px)); z-index: 30;
  background: #1F2230; color: #FFFDF7; padding: 11px 18px; border-radius: 999px; font-size: 14px; font-weight: 500;
  max-width: calc(100% - 32px); box-shadow: 0 10px 30px rgba(0,0,0,.3); animation: rise 0.25s;
}

@keyframes spin { to { transform: rotate(360deg); } }
@keyframes bump { 0% { transform: scale(1); } 40% { transform: scale(1.18); } 100% { transform: scale(1); } }
@keyframes pop { 0% { transform: scale(0.4); } 100% { transform: scale(1); } }
@keyframes flip { 0% { transform: rotateX(0); } 50% { transform: rotateX(90deg); } 100% { transform: rotateX(0); } }
@keyframes flow { to { stroke-dashoffset: -3; } }
@keyframes drip { 0% { transform: translate(0, 0); opacity: 1; } 100% { transform: translate(var(--dx, 0), var(--dy, 3px)); opacity: 0; } }
@keyframes blink { 0%, 100% { stroke-opacity: 1; } 50% { stroke-opacity: 0.25; } }
@keyframes breathe { 0%, 100% { opacity: 0.85; } 50% { opacity: 0.4; } }
@keyframes callout { 0%, 100% { box-shadow: 0 0 0 0 rgba(255,255,255,.0); } 50% { box-shadow: 0 0 0 7px var(--halo); } }
@keyframes rattle { 0%, 100% { transform: translateX(0); } 20% { transform: translateX(-7px) rotate(-1deg); } 40% { transform: translateX(6px) rotate(1deg); } 60% { transform: translateX(-4px); } 80% { transform: translateX(3px); } }
@keyframes tap { 0%, 100% { transform: translateY(0) scale(1); } 40% { transform: translateY(5px) scale(0.92); } 55% { transform: translateY(5px) scale(0.92); } }
@keyframes ripple { 0%, 35% { opacity: 0; transform: scale(0.3); } 45% { opacity: 0.9; } 100% { opacity: 0; transform: scale(1.4); } }
@keyframes spark { 0% { transform: translate(0, 0) scale(1); opacity: 1; } 100% { transform: translate(var(--x), var(--y)) scale(0.2); opacity: 0; } }
@keyframes floatup { 0% { opacity: 0; transform: translate(-50%, -30%) scale(0.8); } 20% { opacity: 1; transform: translate(-50%, -50%) scale(1.05); } 100% { opacity: 0; transform: translate(-50%, -140%) scale(1); } }
@keyframes rise { from { transform: translateY(40px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
@keyframes stampin { 0% { transform: translate(-50%, -50%) rotate(-14deg) scale(1.6); opacity: 0; } 100% { transform: translate(-50%, -50%) rotate(-4deg) scale(1); opacity: 1; } }
@keyframes skipkick { 0% { transform: translateX(-7px); opacity: 0.4; } 55% { transform: translateX(5px); opacity: 1; } 100% { transform: translateX(0); } }
@keyframes starin { 0% { transform: scale(0) rotate(-30deg); } 100% { transform: scale(1) rotate(0); } }
@keyframes nudgeup { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }
@keyframes fadein { from { opacity: 0; } to { opacity: 1; } }
@keyframes lookpulse { 0% { transform: scale(0.86); opacity: 0.55; } 100% { transform: scale(1.3); opacity: 0; } }
@keyframes dragx { 0%, 100% { transform: translateX(-16px) rotate(-6deg); } 50% { transform: translateX(16px) rotate(6deg); } }
@keyframes birdin { 0% { transform: scale(0.2) rotate(-18deg); opacity: 0; } 100% { transform: scale(1) rotate(0); opacity: 1; } }

@media (max-height: 640px) {
  .scene { padding-top: calc(54px + env(safe-area-inset-top, 0px)); }
  .game-name { font-size: 21px; }
  .tool .disc { width: 46px; height: 46px; }
  .tools { gap: 14px; padding-bottom: 10px; }
  .row { min-height: 46px; padding: 4px 8px; }
  .gem { width: 34px; height: 34px; }
  .palette .gem { width: 38px; height: 38px; }
  .vbtn { height: 44px; }
  .result { padding-top: 14px; gap: 6px; }
  .res-title { font-size: 28px; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; transition-duration: 0.01ms !important; transition-delay: 0ms !important; }
  .res-stars svg { transform: scale(1); }
}

/* ------------------------------------------------------------ profile */
/* Two views: every game at a glance, and one game's own page. Sized to be read
   at arm's length: big numbers, nothing under 13px. Each game brings its tile
   colors (--g1, --gc, --gi) and a mark color for this sheet (--pc). */
.profile [data-game] { --pc: #3A4770; --pc-ink: #FFFFFF; --mute: #BDB6A9; --g1: #6D7AA8; --gc: #3A4770; --gi: #FFFFFF; }
.profile [data-game="outbound"] { --g1: #FFE68A; --gc: #FFB648; --gi: #3A2810; --pc: #BD7210; }
.profile [data-game="conduit"] { --g1: #C5F0B0; --gc: #5FBF6C; --gi: #0F3A1D; --pc: #3A9550; }
.profile [data-game="tumbler"] { --g1: #6550B8; --gc: #3B2A86; --gi: #FBF8FF; --pc: #5B46C4; }
.profile [data-game="glimpse"] { --g1: #3A86EE; --gc: #1D3F93; --gi: #FFFFFF; --pc: #2F68D8; }
.profile [data-game="stacks"] { --g1: #BFE6E8; --gc: #5FAEB0; --gi: #10343A; --pc: #2A8689; }
.profile [data-game="switchback"] { --g1: #FFDDB8; --gc: #EF8E68; --gi: #3A1F14; --pc: #D85F37; }
.profile [data-game="keepsake"] { --g1: #FFE6EE; --gc: #E9789D; --gi: #4A1F2E; --pc: #C94F7A; }
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) .profile [data-game] { --pc-ink: #11152A; --mute: #59607A; }
  :root:not([data-theme="light"]) .profile [data-game="outbound"] { --pc: #FFBE55; }
  :root:not([data-theme="light"]) .profile [data-game="conduit"] { --pc: #72D486; }
  :root:not([data-theme="light"]) .profile [data-game="tumbler"] { --pc: #A596FF; }
  :root:not([data-theme="light"]) .profile [data-game="glimpse"] { --pc: #7FA6FF; }
  :root:not([data-theme="light"]) .profile [data-game="stacks"] { --pc: #6ACFD2; }
  :root:not([data-theme="light"]) .profile [data-game="switchback"] { --pc: #FF946C; }
  :root:not([data-theme="light"]) .profile [data-game="keepsake"] { --pc: #F48DB2; }
}
:root[data-theme="dark"] .profile [data-game] { --pc-ink: #11152A; --mute: #59607A; }
:root[data-theme="dark"] .profile [data-game="outbound"] { --pc: #FFBE55; }
:root[data-theme="dark"] .profile [data-game="conduit"] { --pc: #72D486; }
:root[data-theme="dark"] .profile [data-game="tumbler"] { --pc: #A596FF; }
:root[data-theme="dark"] .profile [data-game="glimpse"] { --pc: #7FA6FF; }
:root[data-theme="dark"] .profile [data-game="stacks"] { --pc: #6ACFD2; }
:root[data-theme="dark"] .profile [data-game="switchback"] { --pc: #FF946C; }
:root[data-theme="dark"] .profile [data-game="keepsake"] { --pc: #F48DB2; }

.sheet-head .back { flex: none; width: 40px; height: 40px; margin: 0 -4px 0 -8px; border-radius: 50%; border: 0; background: var(--field); color: var(--sheet-ink); display: grid; place-items: center; }
.sheet-head .back svg { width: 22px; height: 22px; stroke-width: 2.6; }
.sheet-head .back[hidden] { display: none; }

/* --- every game at a glance */
.pf-over { display: flex; flex-direction: column; gap: 11px; animation: pffade 0.22s ease-out; }
.pf-head { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.pf-big { display: flex; flex-direction: column; gap: 3px; min-width: 0; padding: 11px 12px 12px; border-radius: 18px; background: var(--field); }
.pf-big > span { display: flex; align-items: center; gap: 7px; }
.pf-big svg { flex: none; width: 21px; height: 21px; color: var(--sheet-soft); }
.pf-big.gold svg { color: var(--gold); filter: drop-shadow(0 1px 0 rgba(150, 95, 0, 0.35)); }
.pf-big b { font-family: var(--display); font-weight: 600; font-size: 28px; line-height: 1; white-space: nowrap; }
.pf-big small { font-size: 14px; color: var(--sheet-soft); line-height: 1.2; }
.pf-group h3 { margin: 0 0 5px 2px; font-family: var(--display); font-weight: 600; font-size: 15px; line-height: 1.2; color: var(--sheet-soft); letter-spacing: 0.01em; }
.pf-list { border-radius: 18px; background: var(--field); overflow: hidden; }
.pf-row { display: grid; grid-template-columns: 46px minmax(0, 1fr) auto 14px; align-items: center; gap: 12px; width: 100%; min-height: 60px; padding: 7px 10px 7px 7px;
  border: 0; background: none; color: var(--sheet-ink); text-align: left; transition: background 0.15s; -webkit-tap-highlight-color: transparent; }
.pf-row + .pf-row { box-shadow: inset 0 1px 0 color-mix(in srgb, var(--mute) 40%, transparent); }
.pf-row:active { background: color-mix(in srgb, var(--pc) 10%, transparent); }
.pf-ico { width: 46px; height: 46px; display: grid; place-items: center; flex: none; filter: drop-shadow(0 1.5px 2.5px rgba(20, 24, 40, 0.14)); }
.pf-ico .badge { width: 46px; height: 46px; }
.pf-row.fresh .pf-ico .badge { opacity: 0.75; filter: saturate(0.7); }
.pf-name { display: flex; flex-direction: column; gap: 5px; min-width: 0; }
.pf-name b { font-family: var(--display); font-weight: 600; font-size: 18px; line-height: 1.1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pf-sub { display: flex; align-items: center; gap: 10px; min-width: 0; }
.pf-sub small { font-size: 14px; color: var(--sheet-soft); line-height: 1.1; white-space: nowrap; }
.pf-row.fresh .pf-sub small { color: var(--pc); font-weight: 600; }
.pf-row .pf-stars { display: inline-flex; align-items: center; justify-content: flex-end; gap: 3px; font-family: var(--display); font-weight: 600; font-size: 16px; }
.pf-row .pf-stars svg { width: 16px; height: 16px; color: var(--gold); }
.pf-more { width: 14px; height: 14px; color: var(--sheet-soft); opacity: 0.7; stroke-width: 2.8; margin-left: -4px; }

/* five steps, Beginner to Master: the ones reached, the next one filling up,
   a lighter tint up to the best reached (for games that can step back) */
.pf-ladder { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 4px; }
.pf-ladder i { position: relative; height: 10px; border-radius: 5px; overflow: hidden; background: color-mix(in srgb, var(--mute) 45%, transparent); }
.pf-ladder i.on { background: var(--pc); }
.pf-ladder i.been { background: color-mix(in srgb, var(--pc) 32%, transparent); }
.pf-ladder i b { position: absolute; inset: 0 auto 0 0; border-radius: 5px; background: var(--pc); animation: pffill 0.9s 0.25s cubic-bezier(.3,1,.4,1) both; }
.pf-ladder i b::after { content: ''; position: absolute; inset: 0; background: linear-gradient(100deg, transparent 30%, rgba(255,255,255,.55) 50%, transparent 70%) no-repeat; background-size: 220% 100%; animation: pfshine 2.6s 1.4s ease-in-out infinite; }
.pf-ladder.pf-small { flex: none; grid-template-columns: repeat(5, clamp(14px, 5vw, 21px)); gap: 3px; }
.pf-ladder.pf-small i { height: 9px; }
@keyframes pffill { from { transform: scaleX(0); transform-origin: left; } to { transform: scaleX(1); transform-origin: left; } }
/* no-repeat and a wide range: the band starts and ends fully outside, so it never rests on the text */
@keyframes pfshine { from { background-position: 140% 0; } to { background-position: -140% 0; } }
@keyframes pffade { from { opacity: 0; } to { opacity: 1; } }

/* --- one game's own page */
.pf-page { display: flex; flex-direction: column; gap: 14px; animation: pfslide 0.28s cubic-bezier(.2,.9,.25,1); }
@keyframes pfslide { from { opacity: 0; transform: translateX(22px); } to { opacity: 1; transform: none; } }
.pf-hero { position: relative; display: grid; grid-template-columns: minmax(0, 1fr) auto; grid-template-rows: auto auto; align-items: center; gap: 12px 10px;
  padding: 14px 16px 15px 18px; border-radius: 22px; background: radial-gradient(130% 120% at 85% 0%, var(--g1), var(--gc)); color: var(--gi); overflow: hidden; }
.pf-hero > svg { width: 116px; height: 87px; margin: -8px -6px -4px 0; }
.pf-hero-text { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
.pf-hero-text small { font-size: 14px; opacity: 0.78; }
.pf-hero-text > b { font-family: var(--display); font-weight: 600; font-size: 28px; line-height: 1.05; }
.pf-hero-lv { display: flex; align-items: center; flex-wrap: wrap; gap: 4px 10px; margin-top: 4px; font-size: 14px; }
.pf-hero-lv > span:not(.pf-lv) { opacity: 0.8; }
.pf-lv { font-family: var(--display); font-weight: 600; font-size: 16px; padding: 3px 12px; border-radius: 999px; background: var(--gi); color: var(--gc); }
.pf-hero .pf-ladder { grid-column: 1 / -1; }
.pf-hero .pf-ladder i { background: color-mix(in srgb, var(--gi) 20%, transparent); }
.pf-hero .pf-ladder i.on, .pf-hero .pf-ladder i b { background: var(--gi); }
.pf-hero .pf-ladder i.been { background: color-mix(in srgb, var(--gi) 45%, transparent); }

/* the next level: slots that fill, what a good card is, and Play */
.pf-next { display: flex; flex-direction: column; gap: 10px; padding: 13px 14px 14px; border-radius: 18px; background: var(--field); }
.pf-next-top { display: flex; align-items: center; gap: 8px; min-height: 40px; }
.pf-next-k { font-size: 15px; color: var(--sheet-soft); }
.pf-next-top b { font-family: var(--display); font-weight: 600; font-size: 21px; line-height: 1.1; }
.pf-crown { width: 26px; height: 26px; color: var(--gold); filter: drop-shadow(0 1px 0 rgba(150, 95, 0, 0.4)); }
.pf-play { margin-left: auto; display: inline-flex; align-items: center; gap: 6px; height: 42px; padding: 0 17px 0 13px; border: 0; border-radius: 999px;
  background: var(--pc); color: var(--pc-ink); font-family: var(--display); font-weight: 600; font-size: 17px; transition: transform 0.12s; }
.pf-play:active { transform: scale(0.95); }
.pf-play svg { width: 18px; height: 18px; fill: currentColor; }
.pf-next-adds { margin: -6px 0 0; font-size: 15px; color: var(--sheet-soft); }
.pf-next-row { display: flex; align-items: center; flex-wrap: wrap; gap: 10px 14px; }
/* all five levels: done, here, ahead */
.pf-levels { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 2px; }
.pf-levels li { display: grid; grid-template-columns: 22px auto minmax(0, 1fr); align-items: center; gap: 10px; min-height: 34px; padding: 4px 10px 4px 8px; border-radius: 12px; font-size: 15px; color: var(--sheet-soft); }
.pf-levels li i { width: 20px; height: 20px; border-radius: 50%; display: grid; place-items: center; box-shadow: inset 0 0 0 2px color-mix(in srgb, var(--mute) 85%, transparent); }
.pf-levels li i svg { width: 13px; height: 13px; stroke-width: 3.2; }
.pf-levels li b { font-family: var(--display); font-weight: 600; font-size: 16px; color: var(--sheet-ink); white-space: nowrap; }
.pf-levels li span { min-width: 0; }
.pf-levels li.done i { background: var(--pc); color: var(--pc-ink); box-shadow: none; }
.pf-levels li.been i { background: color-mix(in srgb, var(--pc) 32%, transparent); box-shadow: none; }
.pf-levels li.now { background: var(--field); }
.pf-levels li.now i { box-shadow: inset 0 0 0 6px var(--pc); }
.pf-levels li.now b { color: var(--sheet-ink); }
.pf-slots { display: inline-flex; gap: 7px; }
.pf-slots i { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; box-shadow: inset 0 0 0 2.5px color-mix(in srgb, var(--mute) 85%, transparent); }
.pf-slots i:not(.on) { animation: pfwait 1.8s 1.2s ease-in-out infinite; }
.pf-slots i.on { background: var(--pc); color: var(--pc-ink); box-shadow: none; animation: pop 0.45s 0.35s cubic-bezier(.3,1.9,.5,1) both; }
.pf-slots svg { width: 19px; height: 19px; stroke-width: 3; }
@keyframes pfwait { 0%, 100% { box-shadow: inset 0 0 0 2.5px color-mix(in srgb, var(--mute) 85%, transparent); } 50% { box-shadow: inset 0 0 0 2.5px var(--pc); } }
.pf-chips { display: inline-flex; flex-wrap: wrap; gap: 6px; }
.pf-chip { display: inline-flex; align-items: center; gap: 6px; height: 34px; padding: 0 12px 0 9px; border-radius: 999px; background: var(--sheet);
  font-family: var(--display); font-weight: 600; font-size: 17px; white-space: nowrap; }
.pf-chip svg { width: 19px; height: 19px; color: var(--sheet-soft); }
.pf-chip.stars { gap: 1px; padding: 0 10px; }
.pf-chip.stars svg { width: 20px; height: 20px; color: var(--gold); }
.pf-chip.stars svg path { stroke: #C98A0C; stroke-width: 1.3; }

/* the player's own curve: last twelve rounds, newest on the right */
.pf-curve { margin: 0; display: flex; flex-direction: column; gap: 6px; }
.pf-cap { display: flex; align-items: center; gap: 7px; font-size: 15px; color: var(--sheet-soft); margin-top: 2px; }
.pf-cap svg { width: 18px; height: 18px; }
.pf-up { display: inline-flex; align-items: center; gap: 4px; height: 26px; padding: 0 10px 0 7px; border-radius: 999px; margin-left: 2px;
  background: color-mix(in srgb, var(--pc) 15%, transparent); color: var(--sheet-ink); font-family: var(--display); font-weight: 600; font-size: 15px; white-space: nowrap; }
.pf-up svg { width: 17px; height: 17px; color: var(--pc); stroke-width: 2.8; }
.pf-val { margin-left: auto; font-family: var(--display); font-weight: 600; font-size: 18px; color: var(--sheet-ink); white-space: nowrap; }
.pf-plot { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: 2px; align-items: end; margin-bottom: 10px; border-bottom: 1px solid color-mix(in srgb, var(--mute) 70%, transparent); }
.pf-col { position: relative; display: block; cursor: pointer; -webkit-tap-highlight-color: transparent; }
.pf-col.empty { cursor: default; }
/* the round being read: a dot under the baseline */
.pf-col.sel::after { content: ''; position: absolute; left: 50%; bottom: -10px; width: 6px; height: 6px; margin-left: -3px; border-radius: 50%; background: var(--sheet-ink); }
.pf-plot.bars { height: 88px; }
.pf-page[data-game="switchback"] .pf-plot.bars { height: 54px; }
.pf-plot.bars .pf-col { height: 100%; }
.pf-bar { position: absolute; bottom: 0; left: 50%; width: min(16px, 62%); transform: translateX(-50%) scaleY(1); transform-origin: bottom; border-radius: 4px 4px 0 0; background: var(--mute);
  animation: pfgrow 0.55s calc(0.15s + var(--d, 0ms)) cubic-bezier(.25,1.2,.4,1) both; }
.pf-col.ok .pf-bar { background: var(--pc); }
.pf-tick { position: absolute; left: 1px; right: 1px; height: 2px; margin-bottom: -1px; border-radius: 1px; background: var(--sheet-ink); opacity: 0.75; }
@keyframes pfgrow { from { transform: translateX(-50%) scaleY(0); } to { transform: translateX(-50%) scaleY(1); } }
.pf-plot.dots .pf-col { display: flex; flex-direction: column-reverse; align-items: center; gap: 3px; padding-bottom: 4px; height: calc(var(--rows, 5) * 13px + 4px); justify-content: flex-start; }
.pf-plot.dots .pf-col b { width: 10px; height: 10px; border-radius: 50%; box-shadow: inset 0 0 0 2px var(--mute); animation: pfdot 0.35s calc(0.15s + var(--d, 0ms)) cubic-bezier(.3,1.8,.5,1) both; }
.pf-plot.dots .pf-col b.on { background: var(--pc); box-shadow: none; }
@keyframes pfdot { from { transform: scale(0); } to { transform: scale(1); } }
.pf-plot.stars .pf-col { display: flex; flex-direction: column-reverse; align-items: center; gap: 1px; padding-bottom: 4px; }
.pf-plot.stars svg { width: 17px; height: 17px; color: transparent; animation: pfdot 0.35s calc(0.15s + var(--d, 0ms)) cubic-bezier(.3,1.8,.5,1) both; }
.pf-plot.stars svg path { stroke: var(--mute); stroke-width: 1.6; }
.pf-plot.stars svg.on { color: var(--gold); }
.pf-plot.stars svg.on path { stroke: #C98A0C; stroke-width: 1.3; }

/* three numbers, big */
.pf-nums { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; padding-top: 2px; }
.pf-num { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.pf-num svg { width: 20px; height: 20px; color: var(--sheet-soft); margin-bottom: 3px; }
.pf-num b { font-family: var(--display); font-weight: 600; font-size: 28px; line-height: 1.05; white-space: nowrap; }
.pf-num span { font-size: 14px; color: var(--sheet-soft); line-height: 1.2; }

/* duotone: closed shapes in the line icons carry a soft fill of their own color */
svg .df { fill: currentColor; stroke: none; opacity: 0.2; }

/* iPhone haptics: a switch toggled through its label, kept out of sight */
.haptic { position: fixed; left: -200px; top: -200px; width: 1px; height: 1px; overflow: hidden; opacity: 0; pointer-events: none; }

/* ---------------------------------------------------------------- level up
   The first time a game reaches a level: the badge takes its medal, the ladder fills a step,
   what the level brings, then play on (or see the result first). */
.lu { position: fixed; inset: 0; z-index: 40; display: grid; place-items: center; padding: 24px;
  background: radial-gradient(120% 80% at 50% 34%, color-mix(in srgb, var(--lu, #5B47AE) 70%, #FFFFFF) 0%, var(--lu, #5B47AE) 46%, color-mix(in srgb, var(--lu, #5B47AE) 55%, #0B0D1C) 100%);
  animation: fadein 0.32s ease-out both; color: #FFFFFF; }
.lu.out { animation: luout 0.28s ease-in both; }
@keyframes luout { to { opacity: 0; transform: scale(1.03); } }
.lu[data-game="outbound"] { --lu: #F2A31B; }
.lu[data-game="conduit"] { --lu: #3FA653; }
.lu[data-game="tumbler"] { --lu: #4E3BA6; }
.lu[data-game="glimpse"] { --lu: #2563CF; }
.lu[data-game="stacks"] { --lu: #3E9C98; }
.lu[data-game="switchback"] { --lu: #DD5A40; }
.lu[data-game="keepsake"] { --lu: #D45784; }
.lu-fx { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
.lu-card { position: relative; display: flex; flex-direction: column; align-items: center; text-align: center; max-width: 340px; width: 100%; }
.lu-badge { position: relative; width: 148px; height: 148px; display: grid; place-items: center; margin-bottom: 14px; animation: lubadge 0.75s 0.1s cubic-bezier(.25,1.6,.45,1) both; }
.lu-glow { position: absolute; inset: -40px; border-radius: 50%; background: radial-gradient(circle, rgba(255, 255, 255, 0.55) 0%, rgba(255, 255, 255, 0) 62%); animation: luglow 2.4s ease-in-out infinite; }
.lu-art { position: relative; width: 132px; height: 132px; filter: drop-shadow(0 10px 22px rgba(0, 0, 0, 0.3)); }
.lu-art .medal { transform-box: fill-box; transform-origin: center; animation: lumedal 0.6s 0.85s cubic-bezier(.3,1.9,.5,1) both; }
@keyframes lubadge { 0% { opacity: 0; transform: scale(0.3) rotate(-14deg); } 100% { opacity: 1; transform: scale(1) rotate(0); } }
@keyframes lumedal { 0% { opacity: 0; transform: scale(0.1); } 70% { opacity: 1; transform: scale(1.45); } 100% { transform: scale(1); } }
@keyframes luglow { 0%, 100% { opacity: 0.7; transform: scale(0.94); } 50% { opacity: 1; transform: scale(1.06); } }
.lu-k { margin: 0; font-family: var(--display); font-weight: 600; font-size: 15px; letter-spacing: 0.14em; text-transform: uppercase; opacity: 0.85; animation: luin 0.4s 0.45s both; }
.lu-name { margin: 2px 0 12px; font-family: var(--display); font-weight: 700; font-size: 52px; line-height: 1; letter-spacing: 0.005em; text-shadow: 0 3px 14px rgba(0, 0, 0, 0.22); animation: luname 0.6s 0.55s cubic-bezier(.3,1.6,.5,1) both; }
@keyframes luin { from { opacity: 0; transform: translateY(8px); } to { opacity: 0.85; transform: none; } }
@keyframes luname { from { opacity: 0; transform: scale(0.6); } to { opacity: 1; transform: none; } }
.lu-ladder { display: flex; gap: 6px; width: 220px; margin-bottom: 14px; animation: luin 0.4s 0.7s both; }
.lu-ladder i { flex: 1; height: 10px; border-radius: 5px; background: rgba(255, 255, 255, 0.25); overflow: hidden; position: relative; }
.lu-ladder i.on { background: #FFFFFF; }
.lu-ladder i.new::after { content: ''; position: absolute; inset: 0; background: #FFD23F; transform-origin: left; animation: lufill 0.7s 1.1s cubic-bezier(.4,1.4,.5,1) both; box-shadow: 0 0 10px #FFD23F; }
@keyframes lufill { from { transform: scaleX(0); } to { transform: scaleX(1); } }
.lu-adds { margin: 0 0 22px; padding: 8px 16px; border-radius: 14px; background: rgba(255, 255, 255, 0.16); font-size: 17px; line-height: 1.35; animation: luin 0.4s 1.3s both; }
.lu-adds b { font-family: var(--display); font-weight: 600; color: #FFE27A; }
.lu-go { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-width: 220px; height: 56px; padding: 0 26px; border: 0; border-radius: 999px;
  background: #FFFFFF; color: color-mix(in srgb, var(--lu, #5B47AE) 70%, #10132A); font-family: var(--display); font-weight: 700; font-size: 20px;
  box-shadow: 0 8px 22px rgba(0, 0, 0, 0.25); animation: luin 0.4s 1.5s both; cursor: pointer; }
.lu-go svg { width: 20px; height: 20px; }
.lu-go:active { transform: scale(0.96); }
.lu-go:focus { outline: none; }
.lu-go:focus-visible { box-shadow: 0 8px 22px rgba(0, 0, 0, 0.25), 0 0 0 4px rgba(255, 255, 255, 0.55); }
.lu-later { margin-top: 10px; padding: 10px 16px; border: 0; background: transparent; color: rgba(255, 255, 255, 0.85); font-family: var(--ui); font-size: 15px; font-weight: 500; cursor: pointer; animation: luin 0.4s 1.6s both; }
@media (prefers-reduced-motion: reduce) { .lu, .lu *, .lu-art .medal { animation: none !important; } }

/* ---------------------------------------------------------------- level looks
   In free play every level of a game has a look of its own: the scene's colors, the board's
   materials and a scene around the board (.decor, drawn behind everything in the card). The
   app carries the level too (data-lv), so the bar on top reads on dark scenes. */
.scene { isolation: isolate; }
.decor { position: absolute; inset: 0; width: 100%; height: 100%; z-index: -1; pointer-events: none; }
/* Outbound: the beach, the city at night, the ski lodge, the ferry at sunset */
[data-scene="outbound"][data-lv="2"], .scene[data-game="outbound"][data-lv="2"] { --bg1: #D4F7F4; --bg2: #49BCD9; --ink: #0D3A48; --ink2: rgba(13,58,72,.7); --chip: rgba(255,255,255,.6); --btn: #0D3A48; --btn-ink: #EFFFFF; --halo: rgba(235,255,255,.75); --ob-lot: #5E6470; --ob-road: #6E7480; --ob-dash: #FFFFFF; --ob-curb: #F6E2B0; }
[data-scene="outbound"][data-lv="3"], .scene[data-game="outbound"][data-lv="3"] { --bg1: #3B3F8E; --bg2: #0B0E2E; --ink: #F1F2FF; --ink2: rgba(241,242,255,.74); --chip: rgba(255,255,255,.14); --btn: #FFD23F; --btn-ink: #0B0E2E; --halo: rgba(110,130,255,.45); --ob-lot: #1F2338; --ob-road: #2B3050; --ob-dash: #4FE3FF; --ob-stall: #4FE3FF; --ob-stall-o: .3; --ob-curb: #4FE3FF; }
.scene[data-game="outbound"][data-lv="3"] .curb { filter: drop-shadow(0 0 1.2px #4FE3FF); }
[data-scene="outbound"][data-lv="4"], .scene[data-game="outbound"][data-lv="4"] { --bg1: #F4F9FF; --bg2: #A8C6E8; --ink: #1B2C48; --ink2: rgba(27,44,72,.7); --chip: rgba(255,255,255,.7); --btn: #1B2C48; --btn-ink: #F4F9FF; --halo: rgba(255,255,255,.85); --ob-lot: #586274; --ob-road: #6A7486; --ob-dash: #FFFFFF; --ob-curb: #FFFFFF; --ob-curb-w: 1.7; }
[data-scene="outbound"][data-lv="5"], .scene[data-game="outbound"][data-lv="5"] { --bg1: #FFC27A; --bg2: #B5427A; --ink: #2E0F22; --ink2: rgba(46,15,34,.72); --chip: rgba(255,255,255,.5); --btn: #2E0F22; --btn-ink: #FFF0E6; --halo: rgba(255,236,220,.7); --ob-lot: #36505E; --ob-road: #45606E; --ob-dash: #FFC83A; --ob-curb: #FFC83A; }
.scene[data-game="outbound"][data-lv="5"] .curb { stroke-dasharray: 1.6 1.2; }
/* Conduit: the vegetable patch, the greenhouse, the desert oasis, the palace garden at night */
[data-scene="conduit"][data-lv="2"], .scene[data-game="conduit"][data-lv="2"] { --bg1: #FFF1C4; --bg2: #D9B25E; --ink: #3A2A10; --ink2: rgba(58,42,16,.7); --chip: rgba(255,255,255,.55); --btn: #3A2A10; --btn-ink: #FFF8E6; --halo: rgba(255,248,225,.75); --cd-soil: #4E3220; --cd-bed: #6E4A2C; --cd-t1: #8DB64A; --cd-t2: #6E9A38; }
[data-scene="conduit"][data-lv="3"], .scene[data-game="conduit"][data-lv="3"] { --bg1: #FFF2F2; --bg2: #B7DABE; --ink: #1F3A2A; --ink2: rgba(31,58,42,.72); --chip: rgba(255,255,255,.6); --btn: #1F3A2A; --btn-ink: #FFF6F6; --halo: rgba(255,244,246,.75); }
[data-scene="conduit"][data-lv="4"], .scene[data-game="conduit"][data-lv="4"] { --bg1: #FFE2AE; --bg2: #E07A44; --ink: #3E1A08; --ink2: rgba(62,26,8,.7); --chip: rgba(255,255,255,.5); --btn: #3E1A08; --btn-ink: #FFF3E6; --halo: rgba(255,240,225,.7); --cd-soil: #A86F3A; --cd-bed: #CC9658; --cd-t1: #A7A24A; --cd-t2: #8A8A3A; }
[data-scene="conduit"][data-lv="5"], .scene[data-game="conduit"][data-lv="5"] { --bg1: #2E5A48; --bg2: #0A1C14; --ink: #EFFFF5; --ink2: rgba(239,255,245,.74); --chip: rgba(255,255,255,.14); --btn: #FFD23F; --btn-ink: #0A1C14; --halo: rgba(255,230,160,.35); --cd-soil: #2F2219; --cd-bed: #4A3626; --cd-t1: #4E8F55; --cd-t2: #3A7444; }
/* Tumbler: the school locker, the front door, the safe, the vault */
[data-scene="tumbler"][data-lv="2"], .scene[data-game="tumbler"][data-lv="2"] { --bg1: #6CC5BB; --bg2: #173F47; --halo: rgba(150,240,230,.4); --tb-v1: #4E8F94; --tb-v2: #2E6168; --tb-v3: #214A50; --tb-r1: #E3F2F2; --tb-r2: #7FA7AA; --tb-off: #2C565C; }
[data-scene="tumbler"][data-lv="3"], .scene[data-game="tumbler"][data-lv="3"] { --bg1: #D9A06A; --bg2: #5A2E18; --halo: rgba(255,210,160,.4); --tb-v1: #8E5A36; --tb-v2: #6A3F24; --tb-v3: #4E2C18; --tb-r1: #FFE9A8; --tb-r2: #B8862A; --tb-off: #5A3A24; }
[data-scene="tumbler"][data-lv="4"], .scene[data-game="tumbler"][data-lv="4"] { --bg1: #9AA3B2; --bg2: #262B35; --halo: rgba(220,230,245,.35); --tb-v1: #79818F; --tb-v2: #535A67; --tb-v3: #3B414C; --tb-r1: #F4F6FA; --tb-r2: #8D95A3; --tb-off: #444B57; }
[data-scene="tumbler"][data-lv="5"], .scene[data-game="tumbler"][data-lv="5"] { --bg1: #4A3714; --bg2: #0B0803; --halo: rgba(255,214,120,.35); --tb-v1: #2C2414; --tb-v2: #1A150B; --tb-v3: #0E0B06; --tb-r1: #FFE9A8; --tb-r2: #C9962E; --tb-off: #3A2E14; }
/* Keepsake: the park in summer, autumn, winter and at night */
[data-scene="keepsake"][data-lv="2"], .scene[data-game="keepsake"][data-lv="2"] { --bg1: #FFF6CC; --bg2: #FFB46B; --ink: #4A2A10; --ink2: rgba(74,42,16,.7); --btn: #4A2A10; --btn-ink: #FFF6E6; --halo: rgba(255,248,225,.75); }
[data-scene="keepsake"][data-lv="3"], .scene[data-game="keepsake"][data-lv="3"] { --bg1: #FFE6CC; --bg2: #D9773E; --ink: #44200C; --ink2: rgba(68,32,12,.7); --btn: #44200C; --btn-ink: #FFF1E6; --halo: rgba(255,238,225,.7); }
[data-scene="keepsake"][data-lv="4"], .scene[data-game="keepsake"][data-lv="4"] { --bg1: #F3F8FF; --bg2: #9FB9DC; --ink: #1E2C46; --ink2: rgba(30,44,70,.7); --chip: rgba(255,255,255,.65); --btn: #1E2C46; --btn-ink: #F3F8FF; --halo: rgba(255,255,255,.85); }
[data-scene="keepsake"][data-lv="5"], .scene[data-game="keepsake"][data-lv="5"] { --bg1: #2E3D78; --bg2: #0B1030; --ink: #F1F3FF; --ink2: rgba(241,243,255,.74); --chip: rgba(255,255,255,.14); --btn: #FFD23F; --btn-ink: #0B1030; --halo: rgba(140,160,255,.4); }
/* Glimpse: the night walk is the dark trip (each trip's colors come from the card) */

<body>
<div class="app" id="app" data-scene="outbound">
  <main class="stage" id="stage" aria-live="polite"></main>
  <header class="hud" id="hud">
    <div id="hud-left"></div>
    <div class="hud-mid" id="hud-mid"></div>
    <div class="hud-right" id="hud-right"></div>
  </header>
</div>
<div id="layer"></div>
<div class="toast" id="toast" role="status" hidden></div>

<script>/* Puzzle Reel engines: pure, deterministic, DOM-free.
 * Every generator takes (level, seed) and returns the same puzzle for the same pair.
 * Every game exposes the same run interface so one harness can log and score moves. */
function PuzzleEnginesFactory(root) {
  'use strict';

  // ---------- seeded randomness ----------
  function fnv1a(str) {
    let h = 0x811c9dc5;
    for (let i = 0; i < str.length; i++) {
      h ^= str.charCodeAt(i);
      h = Math.imul(h, 0x01000193);
    }
    return h >>> 0;
  }
  function mulberry32(a) {
    a = a >>> 0;
    return function () {
      a = (a + 0x6D2B79F5) >>> 0;
      let t = a;
      t = Math.imul(t ^ (t >>> 15), t | 1);
      t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  function makeRng(seed) {
    const r = mulberry32(seed);
    r.int = (n) => Math.floor(r() * n);
    r.shuffle = (arr) => {
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(r() * (i + 1));
        const t = arr[i]; arr[i] = arr[j]; arr[j] = t;
      }
      return arr;
    };
    return r;
  }
  function puzzleSeed(sessionSeed, block, game, level, j) {
    return fnv1a(sessionSeed + '|' + block + '|' + game + '|' + level + '|' + j);
  }

  // =====================================================================
  // OUTBOUND: cars only drive forward. A tapped car leaves the lot if its
  // lane is clear, otherwise it slides until it bumps into something.
  // Forward-only movement makes the state graph acyclic, so we can label
  // every reachable state with its distance to the goal.
  // =====================================================================
  const DIR = { N: [0, -1], E: [1, 0], S: [0, 1], W: [-1, 0] };
  const DIRS = ['N', 'E', 'S', 'W'];
  const EXIT = -1;

  function obOccupancy(p, st) {
    const occ = new Int16Array(p.w * p.h).fill(-1);
    for (let i = 0; i < p.cars.length; i++) {
      const a = st[i];
      if (a === EXIT) continue;
      const c = p.cars[i];
      const d = DIR[c.dir];
      for (let k = 0; k < c.len; k++) {
        occ[(c.y + (k + a) * d[1]) * p.w + (c.x + (k + a) * d[0])] = i;
      }
    }
    return occ;
  }
  // New advance for car i: EXIT if it leaves, unchanged if it cannot move.
  function obSlide(p, st, occ, i) {
    const c = p.cars[i];
    const a = st[i];
    const d = DIR[c.dir];
    let fx = c.x + (c.len - 1 + a) * d[0];
    let fy = c.y + (c.len - 1 + a) * d[1];
    let steps = 0;
    for (;;) {
      const nx = fx + d[0], ny = fy + d[1];
      if (nx < 0 || ny < 0 || nx >= p.w || ny >= p.h) return EXIT;
      if (occ[ny * p.w + nx] !== -1) return a + steps;
      fx = nx; fy = ny; steps++;
    }
  }
  function obKey(st, B) {
    let k = 0;
    for (let i = st.length - 1; i >= 0; i--) k = k * B + (st[i] === EXIT ? B - 1 : st[i]);
    return k;
  }
  function obMovable(p, st) {
    const occ = obOccupancy(p, st);
    const out = [];
    for (let i = 0; i < p.cars.length; i++) {
      if (st[i] === EXIT) continue;
      if (obSlide(p, st, occ, i) !== st[i]) out.push(i);
    }
    return out;
  }

  // Full analysis of the reachable state graph.
  // d: fewest taps to clear the lot (Infinity = dead end)
  // p: chance a player tapping movable cars at random clears the lot
  // q: chance a sensible player clears it: one who drives out a car whenever one can leave,
  //    and only when none can, taps one of the others at random (no undo)
  function obAnalyze(p) {
    const n = p.cars.length;
    const B = Math.max(p.w, p.h) + 2;
    const memo = new Map();
    let deadStates = 0;
    function solve(st) {
      const key = obKey(st, B);
      const hit = memo.get(key);
      if (hit) return hit;
      let left = 0;
      for (let i = 0; i < n; i++) if (st[i] !== EXIT) left++;
      let res;
      if (left === 0) {
        res = { d: 0, p: 1, q: 1, m: 0, s: 0 };
      } else {
        const occ = obOccupancy(p, st);
        let best = Infinity, ps = 0, m = 0, sl = Infinity, qe = 0, ne = 0, qs = 0;
        for (let i = 0; i < n; i++) {
          if (st[i] === EXIT) continue;
          const na = obSlide(p, st, occ, i);
          if (na === st[i]) continue;
          m++;
          const ns = st.slice();
          ns[i] = na;
          const r = solve(ns);
          if (r.d + 1 < best) best = r.d + 1;
          const rs = r.s + (na === EXIT ? 0 : 1);
          if (rs < sl) sl = rs;
          ps += r.p;
          if (na === EXIT) { qe += r.q; ne++; } else qs += r.q;
        }
        res = { d: best, p: m ? ps / m : 0, q: ne ? qe / ne : m ? qs / m : 0, m, s: sl };
        if (best === Infinity) deadStates++;
      }
      memo.set(key, res);
      return res;
    }
    const start = new Array(n).fill(0);
    const r0 = solve(start);
    // first-move profile
    const occ = obOccupancy(p, start);
    let firstMoves = 0, safeFirst = 0, optimalFirst = 0;
    for (let i = 0; i < n; i++) {
      const na = obSlide(p, start, occ, i);
      if (na === 0) continue;
      firstMoves++;
      const ns = start.slice(); ns[i] = na;
      const r = memo.get(obKey(ns, B));
      if (r.d !== Infinity) safeFirst++;
      if (r.d === r0.d - 1) optimalFirst++;
    }
    return {
      memo, B,
      optimal: r0.d,
      pRandom: r0.p,
      pSmart: r0.q,
      minSlides: r0.s,     // 0: tapping only cars with a clear way out always works
      states: memo.size,
      deadStates,
      firstMoves, safeFirst, optimalFirst,
    };
  }

  function dirOf(v) { return v[0] === 1 ? 'E' : v[0] === -1 ? 'W' : v[1] === 1 ? 'S' : 'N'; }

  // Plants a four-car trap. A sits in a lane that crosses V's lane. If A is
  // driven too early it slides onto that crossing, stops against B, and the
  // cycle A <- B <- Z <- V <- A can no longer be broken. Cars are added in an
  // order that keeps the lot solvable (V, then Z, then B, then A).
  function obPlantTrap(L, rng, occ, cars) {
    const w = L.w, h = L.h;
    const inb = (c) => c[0] >= 0 && c[1] >= 0 && c[0] < w && c[1] < h;
    const isFree = (c) => inb(c) && occ[c[1] * w + c[0]] === -1;
    const add = (a, v, k) => [a[0] + v[0] * k, a[1] + v[1] * k];
    const laneOf = (front, d) => {
      const out = [];
      let c = add(front, d, 1);
      while (inb(c)) { out.push(c); c = add(c, d, 1); }
      return out;
    };
    const clearLane = (front, d, extra) => laneOf(front, d).every((c) => isFree(c) && !(extra && extra.some((e) => e[0] === c[0] && e[1] === c[1])));
    const carCells = (rear, d, len) => { const out = []; for (let k = 0; k < len; k++) out.push(add(rear, d, k)); return out; };
    const len = () => (rng() < L.truck ? 3 : 2);
    for (let attempt = 0; attempt < 80; attempt++) {
      // A
      const d = DIR[DIRS[rng.int(4)]];
      const la = len();
      const aRear = [rng.int(w), rng.int(h)];
      const aCells = carCells(aRear, d, la);
      if (!aCells.every(isFree)) continue;
      const aFront = aCells[la - 1];
      if (!clearLane(aFront, d)) continue;
      const lane = laneOf(aFront, d);
      if (lane.length < 3) continue;
      // B: perpendicular, covering lane[k]; facing n
      const k = 1 + rng.int(lane.length - 1);
      const n = rng() < 0.5 ? [-d[1], d[0]] : [d[1], -d[0]];
      const lb = 2;
      const off = rng.int(lb);
      const bRear = add(lane[k], n, -off);
      const bCells = carCells(bRear, n, lb);
      if (!bCells.every(isFree) || bCells.some((c) => aCells.some((e) => e[0] === c[0] && e[1] === c[1]))) continue;
      const bFront = bCells[lb - 1];
      const bLane = laneOf(bFront, n);
      if (bLane.length < 2) continue;
      if (!clearLane(bFront, n, aCells)) continue;
      // X: a cell A covers only after sliding up to B
      const lo = Math.max(0, k - la);
      const xi = lo + rng.int(k - lo);
      const X = lane[xi];
      // Z: in B's lane, parallel to A, facing back toward X's line
      const t = rng.int(Math.min(2, bLane.length - 1));
      const Q = bLane[t];
      const lz = 2;
      const zDir = [-d[0], -d[1]];
      const zCells = carCells(add(Q, zDir, -(lz - 1)), zDir, lz); // rear first, front = Q
      const taken = aCells.concat(bCells);
      if (!zCells.every((c) => isFree(c) && !taken.some((e) => e[0] === c[0] && e[1] === c[1]))) continue;
      if (!clearLane(Q, zDir, taken)) continue;
      // P: where Z's lane meets X's line
      const P = add(Q, zDir, k - xi);
      // V: on X's line beyond A's lane, covering P, facing A's lane
      const vDir = [-n[0], -n[1]];
      const lv = 2;
      const q = rng.int(lv);
      const vFront = add(P, vDir, q);
      const vCells = carCells(add(vFront, vDir, -(lv - 1)), vDir, lv);
      // front must stay strictly on Z's side of A's lane
      const sideDist = (c) => (c[0] - X[0]) * n[0] + (c[1] - X[1]) * n[1];
      if (sideDist(vFront) < 1) continue;
      const taken2 = taken.concat(zCells);
      if (!vCells.every((c) => isFree(c) && !taken2.some((e) => e[0] === c[0] && e[1] === c[1]))) continue;
      if (!clearLane(vFront, vDir, taken2)) continue;
      // commit in solvable order: A, B, Z, V (V leaves first)
      const commit = (rear, dv, l) => {
        const id = cars.length;
        cars.push({ x: rear[0], y: rear[1], dir: dirOf(dv), len: l });
        for (const c of carCells(rear, dv, l)) occ[c[1] * w + c[0]] = id;
      };
      commit(aRear, d, la);
      commit(bRear, n, lb);
      commit(zCells[0], zDir, lz);
      commit(vCells[0], vDir, lv);
      return true;
    }
    return false;
  }

  // Plants a pinwheel: four cars that each block the next (X <- Y <- Z <- W <- X),
  // so none of them can leave until one slides part of the way. In the base
  // layout X (east) and Z (west) have room to slide past the car they block;
  // W and Y do not. g: columns between X's front and Y; q: rows between W and X.
  // Any of 8 rotations and mirror images, at a random place where it fits.
  function obPlantLoop(L, rng, occ, cars) {
    const w = L.w, h = L.h;
    for (let attempt = 0; attempt < 400; attempt++) {
      const g = 3 + (rng() < 0.3 ? 1 : 0), q = 1 + (rng() < 0.35 ? 1 : 0);
      // cars as [rear..front] cells and a direction, in base coordinates
      const base = [
        { cells: [[0, 1 + q], [1, 1 + q]], d: [1, 0] },              // X, east
        { cells: [[g + 1, 2 + q], [g + 1, 1 + q]], d: [0, -1] },     // Y, north
        { cells: [[g + 2, 1], [g + 1, 1]], d: [-1, 0] },             // Z, west
        { cells: [[1, 0], [1, 1]], d: [0, 1] },                      // W, south
      ];
      const sym = rng.int(8);
      const tf = (v) => { let x = v[0], y = v[1]; for (let k = 0; k < (sym & 3); k++) { const t = x; x = -y; y = t; } return sym & 4 ? [-x, y] : [x, y]; };
      let cs = base.map((c) => ({ cells: c.cells.map(tf), d: tf(c.d) }));
      let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
      for (const c of cs) for (const [x, y] of c.cells) { minX = Math.min(minX, x); minY = Math.min(minY, y); maxX = Math.max(maxX, x); maxY = Math.max(maxY, y); }
      if (maxX - minX >= w || maxY - minY >= h) continue;
      const ox = rng.int(w - (maxX - minX)) - minX, oy = rng.int(h - (maxY - minY)) - minY;
      cs = cs.map((c) => ({ cells: c.cells.map(([x, y]) => [x + ox, y + oy]), d: c.d }));
      const mine = new Set();
      for (const c of cs) for (const [x, y] of c.cells) mine.add(y * w + x);
      let ok = true;
      for (const id of mine) if (occ[id] !== -1) ok = false;
      // every lane, from each front to the edge, is clear of earlier cars
      for (const c of cs) {
        if (!ok) break;
        let [x, y] = c.cells[c.cells.length - 1];
        for (x += c.d[0], y += c.d[1]; x >= 0 && y >= 0 && x < w && y < h; x += c.d[0], y += c.d[1]) {
          if (occ[y * w + x] !== -1) { ok = false; break; }
        }
      }
      if (!ok) continue;
      for (const c of cs) {
        const id = cars.length;
        const [rx, ry] = c.cells[0];
        cars.push({ x: rx, y: ry, dir: dirOf(c.d), len: c.cells.length });
        for (const [x, y] of c.cells) occ[y * w + x] = id;
      }
      return true;
    }
    return false;
  }

  // Lots that need planning: traps first (cleared last), then pinwheels, then
  // ordinary cars with a clear way out (cleared first). Every pinwheel needs one
  // slide, so the lot cannot be cleared by tapping only cars with a clear way out.
  function obBuild(L, rng) {
    const w = L.w, h = L.h;
    const occ = new Int16Array(w * h).fill(-1);
    const cars = [];
    let planted = 0;
    for (let g = 0; g < (L.traps || 0); g++) {
      if (cars.length + 4 > L.cars) break;
      if (obPlantTrap(L, rng, occ, cars)) planted++;
    }
    if (L.traps && planted < 1) return null;
    for (let g = 0; g < (L.loops || 0); g++) if (!obPlantLoop(L, rng, occ, cars)) return null;
    let tries = 0;
    while (cars.length < L.cars && tries < (L.dense ? 2000 : 900)) {
      tries++;
      const len = rng() < L.truck ? 3 : 2;
      const dir = DIRS[rng.int(4)];
      const d = DIR[dir];
      const x = rng.int(w), y = rng.int(h);
      const fx = x + (len - 1) * d[0], fy = y + (len - 1) * d[1];
      if (fx < 0 || fy < 0 || fx >= w || fy >= h) continue;
      let ok = true;
      for (let k = 0; k < len && ok; k++) if (occ[(y + k * d[1]) * w + (x + k * d[0])] !== -1) ok = false;
      // a dense lot puts cars anywhere; otherwise each one's way out is clear of those before it
      if (!L.dense) for (let lx = fx + d[0], ly = fy + d[1]; ok && lx >= 0 && ly >= 0 && lx < w && ly < h; lx += d[0], ly += d[1]) if (occ[ly * w + lx] !== -1) ok = false;
      if (!ok) continue;
      const id = cars.length;
      cars.push({ x, y, dir, len });
      for (let k = 0; k < len; k++) occ[(y + k * d[1]) * w + (x + k * d[0])] = id;
    }
    return cars.length === L.cars ? cars : null;
  }

  // Constructive placement: each new car must have a clear lane to the edge
  // past the cars already placed, so clearing them in reverse order always works.
  function obPlace(L, rng) {
    const w = L.w, h = L.h;
    const occ = new Int16Array(w * h).fill(-1);
    const cars = [];
    let planted = 0;
    for (let g = 0; g < (L.traps || 0); g++) {
      if (cars.length + 4 > L.cars) break;
      if (obPlantTrap(L, rng, occ, cars)) planted++;
    }
    if (L.traps && planted < 1) return null;
    let tries = 0;
    while (cars.length < L.cars && tries < 600) {
      tries++;
      const len = rng() < L.truck ? 3 : 2;
      const dir = DIRS[rng.int(4)];
      const d = DIR[dir];
      const x = rng.int(w), y = rng.int(h);
      const fx = x + (len - 1) * d[0], fy = y + (len - 1) * d[1];
      if (fx < 0 || fy < 0 || fx >= w || fy >= h) continue;
      let ok = true;
      for (let k = 0; k < len && ok; k++) if (occ[(y + k * d[1]) * w + (x + k * d[0])] !== -1) ok = false;
      if (!ok) continue;
      let lx = fx + d[0], ly = fy + d[1];
      while (ok && lx >= 0 && ly >= 0 && lx < w && ly < h) {
        if (occ[ly * w + lx] !== -1) ok = false;
        lx += d[0]; ly += d[1];
      }
      if (!ok) continue;
      const id = cars.length;
      cars.push({ x, y, dir, len });
      for (let k = 0; k < len; k++) occ[(y + k * d[1]) * w + (x + k * d[0])] = id;
    }
    return cars.length === L.cars ? cars : null;
  }

  const Outbound = {
    id: 'outbound',
    name: 'Outbound',
    noun: 'car',
    rule: 'Tap a car to drive it forward. It leaves the lot if the way is clear, or stops when it bumps into something.',
    goal: 'Clear the lot.',
    // loops: pinwheels, each needing one slide part of the way (so tapping only
    // cars with a clear way out stops working); traps: tempting dead ends;
    // band: target range for the chance that random tapping clears the lot;
    // dense: the other cars go anywhere, not only where their way out is clear, so cars
    // hold each other up and a slide can end where it blocks for good; qBand: target range
    // for the chance that a sensible player clears the lot (one who drives out any car that
    // can leave, and only then slides one, picked at random); maxOpt: fewest taps at most
    // (until engines 1.24 levels 3 to 5 were chosen by random tapping alone, and a sensible
    // player cleared levels 1 to 4 almost every time)
    levels: {
      1: { w: 5, h: 5, cars: 5, truck: 0, loops: 0, traps: 0, band: [0.99, 1], attempts: 40 },
      2: { w: 6, h: 6, cars: 7, truck: 0.1, loops: 1, traps: 0, band: [0, 1], attempts: 40 },
      3: { w: 6, h: 6, cars: 9, truck: 0.1, loops: 1, traps: 0, dense: true, qBand: [0.3, 0.65], maxOpt: 11, attempts: 2000 },
      4: { w: 7, h: 7, cars: 11, truck: 0.15, loops: 2, traps: 0, dense: true, qBand: [0.15, 0.42], maxOpt: 13, attempts: 1500 },
      5: { w: 7, h: 7, cars: 12, truck: 0.15, loops: 2, traps: 0, dense: true, qBand: [0, 0.3], maxOpt: 15, attempts: 300 },
    },
    describe(p) { return p.w + '×' + p.h + ' lot, ' + p.cars.length + ' cars'; },
    generate(level, seed) {
      const L = this.levels[level];
      const rng = makeRng(seed);
      let best = null, bestGap = Infinity;
      for (let attempt = 0; attempt < L.attempts; attempt++) {
        const placed = L.loops ? obBuild(L, rng) : obPlace(L, rng);
        if (!placed) continue;
        rng.shuffle(placed); // car ids must not reveal the solution order
        const p = { w: L.w, h: L.h, cars: placed };
        const an = obAnalyze(p);
        if (an.optimal === Infinity) continue;
        const B = L.qBand || L.band, v = L.qBand ? an.pSmart : an.pRandom, lo = B[0], hi = B[1];
        const gap = (v < lo ? lo - v : v > hi ? v - hi : 0) + (L.maxOpt && an.optimal > L.maxOpt ? 1 + an.optimal - L.maxOpt : 0);
        if (gap < bestGap) { best = { p, an }; bestGap = gap; }
        if (gap === 0) break;
      }
      if (!best) {
        // extremely rare: fall back to a lot without planted traps
        const fallback = Object.assign({}, L, { traps: 0, loops: Math.min(1, L.loops || 0) });
        for (let attempt = 0; !best && attempt < 200; attempt++) {
          const placed = fallback.loops ? obBuild(fallback, rng) : obPlace(fallback, rng);
          if (!placed) continue;
          rng.shuffle(placed);
          const p = { w: L.w, h: L.h, cars: placed };
          const an = obAnalyze(p);
          if (an.optimal !== Infinity) best = { p, an };
        }
        bestGap = Infinity;
      }
      const cars = best.p.cars.map((c, i) => ({
        id: i, label: 'c' + (i + 1), x: c.x, y: c.y, dir: c.dir, len: c.len,
        color: (i * 7 + rng.int(3)) % 10,
      }));
      const an = best.an;
      return {
        game: 'outbound', level, seed,
        w: L.w, h: L.h, cars,
        an,
        reference: an.optimal,
        features: {
          cars: cars.length,

  // =====================================================================
  const N = 1, E = 2, S = 4, W = 8;
